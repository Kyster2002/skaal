          <p>Derefter går det med uret. Beskriv jeres ord uden at sige det, og stem så på, hvem I tror er impostoren. Bliver impostoren fanget, drikker de ${tar(S()*2)}. Ellers drikker alle andre ${tar(S())}.</p>`, chili(r.lvl)) +
        `<button class="peek" data-a="peek">${peek.on ? `<span><span class="label">Dit ord</span><br><span class="w">${esc(word)}</span></span>` : `<span class="hint">Tryk for at se dit ord<br>(skjul det for sidemanden)</span>`}</button>
        <div class="label">Hvem er impostoren?</div>` +
        voteButtons(r.players.filter(id => id !== myId && player(id)), r.answers[myId]) +
        progress(onlineIds().filter(id => r.players.includes(id)), id => r.answers[id]);
    },
    result(r, res){
      return card("violet", "Find impostoren", `<div class="who">Impostoren var ${who(r.impostor)}</div>
          <h2 class="prompt">${res.caught ? "Fanget! 🕵️" : "Slap væk! 😈"}</h2>
          <p>Holdets ord: <b>${esc(r.crew)}</b> · Impostorens ord: <b>${esc(r.fake)}</b></p>`, chili(r.lvl)) + tallyView(res.tally);
    }
  },

  /* ---------- Idé 11: Gæt bogstavet ---------- */
  letters:{
    name:"Gæt bogstavet", desc:"Afslør den hemmelige sætning", w:0.9, min:2,
    start(r, pool){
      const c = pickCard("letters", PHRASES); r.phrase = c[1]; r.lvl = c[0];
      r.order = shuffle(pool.map(p => p.id)); r.turn = 0; r.used = []; r.winner = null;
    },
    cur: r => r.order[r.turn],
    /* Næste tur går til en tilfældig anden spiller, ikke på omgang */
    next(r){
      const cand = r.order.filter((id,i) => i !== r.turn && player(id)?.online);
      if(cand.length) r.turn = r.order.indexOf(pick(cand));
    },
    act(r, pid, v){
      const T = TYPES.letters;
      if(v === "skipturn" && pid === myId && !r.winner){ T.next(r); return true }
      if(r.winner){
        if(pid === r.winner && isObj(v) && player(v.victim) && v.victim !== pid){ r.victim = v.victim; return "reveal" }
        return false;
      }
      if(pid !== T.cur(r) || !isObj(v)) return false;
      if(typeof v.l === "string" && ABC.includes(v.l) && !r.used.includes(v.l)){
        r.used.push(v.l);
        if(r.phrase.includes(v.l)){
          if([...r.phrase].every(ch => !ABC.includes(ch) || r.used.includes(ch))) r.winner = pid;
        } else { giveNow(pid, 1, `Intet ${v.l}!`); T.next(r) }
        return true;
      }
      if(typeof v.full === "string"){
        if(norm(v.full) === norm(r.phrase)){ r.winner = pid; r.solvedFull = true; return true }
        giveNow(pid, S(), `Forkert gæt på hele sætningen.`); T.next(r); return true;
      }
      return false;
    },
    reveal(r){ return r.victim ? {win:[r.winner], drink:[{id:r.victim, s:S()*2}]} : {drink:[]} },
    board(r, all){
      return `<div class="board-letters">${r.phrase.split(" ").map(w => `<div class="lw">${[...w].map(ch => {
        const show = all || !ABC.includes(ch) || r.used.includes(ch);
        return `<span class="lc">${show ? esc(ch) : ""}</span>`}).join("")}</div>`).join("")}</div>`;
    },
    view(r){
      const T = TYPES.letters, cur = T.cur(r);
      let body = card("violet", "Gæt bogstavet", T.board(r, !!r.winner), chili(r.lvl));
      if(r.winner){
        if(r.winner === myId) return body + `<div class="drinkhead">Du løste den!</div><div class="label">Giv ${tar(S()*2)} til…</div>
          <div class="voters">${online().filter(p => p.id !== myId).map(p => `<button class="choice" ${actj({victim:p.id})}><span class="em">${avatar(p)}</span>${esc(p.name)}</button>`).join("")}</div>
          <p class="hint">Eller find på en alkoholfri straf til dem i stedet.</p>`;
        return body + `<p class="waiting">${nameOf(r.winner)} løste den og vælger, hvem der skal straffes…</p>`;
      }
      body += `<div class="label">Brugt: ${r.used.join(" ") || "ingen endnu"}</div>`;
      if(cur === myId) return body + `<div class="drinkhead" style="font-size:24px">Din tur! Forkert bogstav koster 1 tår.</div>
          <div class="abc">${ABC.map(ch => `<button ${actj({l:ch})} ${r.used.includes(ch)?"disabled":""}>${ch}</button>`).join("")}</div>
          <div class="row"><input class="field" id="full-${r.n}" autocomplete="off" placeholder="Gæt hele sætningen" maxlength="80"><button class="btn small" data-a="fullsend" style="flex:0 0 auto;width:auto">Gæt</button></div>
          <p class="hint">Gætter du forkert på hele sætningen, drikker du ${tar(S())}.</p>`;
      return body + `<p class="waiting">${who(cur)} gætter…</p>` +
        (isHost() ? `<button class="btn small ghost" data-a="hostact" data-v="skipturn">Spring ${gen(nameOf(cur))} tur over</button>` : "");
    },
    result(r){
      return card("violet", "Gæt bogstavet", TYPES.letters.board(r, true) + `<p>${who(r.winner)} løste den${r.solvedFull ? " i ét gæt" : ""} og gav ${tar(S()*2)} til ${nameOf(r.victim)}.</p>`, chili(r.lvl));
    }
  },

  /* ---------- Idé 12: Timingkæden ---------- */
  chain:{
    name:"Timingkæden", desc:"Samarbejd i den rigtige rækkefølge", w:0.8, min:2,
    start(r, pool){
      let order = shuffle(pool.map(p => p.id));
      if(order.length < 4) order = order.concat(shuffle([...order]));
      r.order = order; r.acts = order.map(() => pick(CHAIN_ACTIONS)); r.step = 0; r.started = null; r.fail = null;
    },
    timer(r){
      const n = r.n, step = r.step;
      setTimeout(() => {
        const q = state.round;
        if(q && q.n === n && state.phase === "round" && q.step === step && !q.fail){ q.fail = {id:q.order[step], why:"for langsom"}; doReveal() }
      }, step === 0 ? 6000 : 3500);
    },
    act(r, pid, v){
      if(v === "start" && pid === myId && !r.started){ r.started = Date.now(); TYPES.chain.timer(r); return true }
      if(v !== "tap" || !r.started || r.fail) return false;
      if(pid !== r.order[r.step]){ r.fail = {id:pid, why:"trykkede uden for tur"}; return "reveal" }
      r.step++;
      if(r.step >= r.order.length) return "reveal";
      TYPES.chain.timer(r); return true;
    },
    reveal(r){
      if(!r.fail && r.step >= r.order.length) return {drink:[]};
      if(!r.fail) r.fail = {id:r.order[r.step], why:"nåede ikke"};
      return {drink:[{id:r.fail.id, s:S()}, ...onlineIds().filter(id => id !== r.fail.id).map(id => ({id, s:1}))]};
    },
    list(r){
      return `<div class="chain">${r.order.map((id,i) => `<div class="step ${i < r.step ? "done" : i === r.step && r.started ? "now" : ""} ${id===myId?"me":""}">
        <span class="e">${i < r.step ? "✅" : emojiOf(id)}</span><span class="n">${i+1}. ${nameOf(id)}<small>${esc(r.acts[i])}</small></span></div>`).join("")}</div>`;
    },
    view(r){
      const myTurn = r.started && r.order[r.step] === myId;
      return card("sky", "Timingkæden", `<h2 class="prompt sm">Gør jeres handling og tryk, når det er jeres tur. Én ad gangen, i rækkefølge.</h2>
          <p>Hvert led har ${dk(3.5,1)} sekunder. Trykker nogen uden for tur, eller går der for lang tid, ryger kæden. Så drikker synderen ${tar(S())} og alle andre 1.</p>`) +
        (!r.started ? (isHost() ? `<button class="btn primary" data-a="hostact" data-v="start">Start kæden</button>` : `<p class="waiting">Venter på, at ${nameOf(state.hostId)} starter kæden…</p>`)
          : `<button class="btn ${myTurn ? "go" : ""}" data-act="tap" style="min-height:96px;font-size:22px">${myTurn ? `${esc(r.acts[r.step])}, TRYK NU!` : "Vent på din tur…"}</button>`) +
        TYPES.chain.list(r);
    },
    result(r){
      const ok = !r.fail;
      return card("sky", "Timingkæden", `<h2 class="prompt">${ok ? "Hele kæden holdt! 🎉" : `Kæden røg ved ${nameOf(r.fail.id)}`}</h2>${ok ? "<p>Ingen drikker. I er et hold.</p>" : `<p>${nameOf(r.fail.id)} ${esc(r.fail.why)}.</p>`}`) + TYPES.chain.list(r);
    }
  },

  /* ---------- Idé 13: Regnestykke under pres ---------- */
  mathpress:{
    name:"Regnestykke under pres", desc:"Flere fejl end spillere = straf", w:0.9, min:1,
    gen(){
      const k = rnd(4);
      if(k === 0){ const a = 3+rnd(10), b = 3+rnd(7), c = 5+rnd(36); return {q:`${a} × ${b} + ${c}`, a:a*b+c} }
      if(k === 1){ const a = 4+rnd(9), b = 4+rnd(6), c = 2+rnd(Math.min(15, a*b-2)); return {q:`${a} × ${b} − ${c}`, a:a*b-c} }
      if(k === 2){ const a = 2+rnd(11), b = 2+rnd(11), c = 2+rnd(5); return {q:`(${a} + ${b}) × ${c}`, a:(a+b)*c} }
      const a = 12+rnd(49), b = 12+rnd(49), c = 5+rnd(Math.min(40, a+b-6)); return {q:`${a} + ${b} − ${c}`, a:a+b-c};
    },
    start(r, pool){ r.probs = {}; r.err = {}; r.solved = {}; pool.forEach(p => r.probs[p.id] = TYPES.mathpress.gen()) },
    act(r, pid, v){
      if(!isObj(v) || typeof v.g !== "number" || !r.probs[pid] || r.solved[pid]) return false;
      if(v.g === r.probs[pid].a) r.solved[pid] = true;
      else r.err[pid] = (r.err[pid]||0) + 1;
      return true;
    },
    done: r => { const ids = onlineIds().filter(id => r.probs[id]); return ids.length > 0 && ids.every(id => r.solved[id]) },
    reveal(r){
      const ids = Object.keys(r.probs).filter(id => player(id)?.online || r.solved[id]);
      const E = Object.values(r.err).reduce((a,b) => a+b, 0), P = ids.length, excess = Math.min(10, Math.max(0, E - P));
      return {E, P, excess, drink: excess ? onlineIds().map(id => ({id, s:excess})) : []};
    },
    view(r){
      const prob = r.probs[myId], ids = onlineIds().filter(id => r.probs[id]);
      const E = Object.values(r.err).reduce((a,b) => a+b, 0);
      if(kp.n !== r.n) kp = {n:r.n, v:"", seen:0};
      const myErr = r.err[myId] || 0;
      if(myErr > kp.seen){ kp.seen = myErr; setTimeout(() => { toast("Forkert! Prøv igen."); buzz([40,40,40]) }) }
      let mine;
      if(!prob) mine = `<p class="hint">Du kom med midt i runden. Hep på de andre.</p>`;
      else if(r.solved[myId]) mine = `<div class="drinkhead" style="text-align:center">Løst! ✅</div><p class="waiting">Venter på de andre…</p>`;
      else mine = `<div class="eq">${esc(prob.q)} = ?</div><div class="kpdisp">${esc(kp.v) || "&nbsp;"}</div>
        <div class="keypad">${["1","2","3","4","5","6","7","8","9","del","0","ok"].map(k => `<button data-kp="${k}" class="${k==="ok"?"ok":""}">${k==="del"?"⌫":k==="ok"?"OK":k}</button>`).join("")}</div>`;
      return card("teal", "Regnestykke under pres", `<h2 class="prompt sm">Alle skal løse deres eget regnestykke.</h2>
          <p>Fejl tæller for hele bordet. Bliver der flere fejl end spillere (${ids.length}), drikker alle 1 tår pr. ekstra fejl.</p>`) +
        `<div class="label">Fejl indtil nu: ${E} af ${ids.length} tilladte</div>` + mine +
        progress(ids, id => r.solved[id]);
    },
    result(r, res){
      return card("teal", "Regnestykke under pres", `<h2 class="prompt">${res.E} fejl, ${res.P} spillere</h2>
          <p>${res.excess ? `${res.excess} fejl for meget. Alle drikker ${tar(res.excess)}.` : "Under grænsen. Ingen fælles straf!"}</p>`) +
        `<div class="result">${Object.keys(r.probs).filter(id => player(id)).map(id => `<div class="res"><span class="e">${emojiOf(id)}</span><span class="n">${nameOf(id)}</span><span class="v">${r.solved[id] ? "✅" : "❌"} ${r.err[id]||0} fejl</span></div>`).join("")}</div>`;
    }
  },

  /* ---------- Konkurrencer fra før ---------- */
  duel:{
    name:"Duel", desc:"1 mod 1, tilskuerne dømmer", w:2, min:3,
    start(r, pool){
      const [a,b] = pickLeast("duel", pool, 2);
      const c = pickCard("duel", DUELS);
      r.a = a.id; r.b = b.id; r.text = c[1]; r.lvl = c[0];
    },
    /* Kun tilskuerne stemmer om vinderen, aldrig de to i duellen */
    judges: r => onlineIds().filter(id => id !== r.a && id !== r.b),
    act(r, pid, v){
      if(["a","b","tie"].includes(v) && pid !== r.a && pid !== r.b){ r.answers[pid] = v; return true }
      return false;
    },
    opt: v => ["a","b","tie"].includes(v),
    done: r => { const j = TYPES.duel.judges(r); return j.length > 0 && j.every(id => r.answers[id]) },
    reveal(r){
      const A = Object.values(r.answers), va = A.filter(x => x === "a").length, vb = A.filter(x => x === "b").length, vt = A.filter(x => x === "tie").length;
      const w = va > vb && va >= vt ? "a" : vb > va && vb >= vt ? "b" : "tie";
      const res = {winner:w, votes:{a:va, b:vb, tie:vt}};
      if(w === "tie") res.drink = [{id:r.a, s:S()}, {id:r.b, s:S()}];
      else { res.drink = [{id: w === "a" ? r.b : r.a, s:S()*2}]; res.win = [w === "a" ? r.a : r.b] }
      return res;
    },
    vs(r, res){
      const cls = s => !res || res.winner === "tie" ? "" : res.winner === s ? "win" : "lose";
      return `<div class="vs"><div class="side ${cls("a")}"><div class="e">${emojiOf(r.a)}</div><div class="nm">${nameOf(r.a)}</div></div><div class="x">VS</div>
        <div class="side ${cls("b")}"><div class="e">${emojiOf(r.b)}</div><div class="nm">${nameOf(r.b)}</div></div></div>`;
    },
    view(r){
      const inDuel = r.a === myId || r.b === myId, vote = r.answers[myId];
      return card("pink", "Duel", TYPES.duel.vs(r) + `<h2 class="prompt sm">${esc(r.text)}</h2>`, chili(r.lvl)) +
        (inDuel ? `<p class="hint">Kæmp! Tilskuerne stemmer om, hvem der vandt. Taberen drikker ${tar(S()*2)}, og står det lige, drikker I begge ${tar(S())}.</p>`
        : `<div class="label">Du er dommer. Stem, når duellen er slut</div><div class="choices two">
          <button class="choice tall" data-act="a" aria-pressed="${vote==="a"}"><span class="em">${emojiOf(r.a)}</span>${nameOf(r.a)} vandt</button>
          <button class="choice tall" data-act="b" aria-pressed="${vote==="b"}"><span class="em">${emojiOf(r.b)}</span>${nameOf(r.b)} vandt</button></div>
          <button class="choice" data-act="tie" aria-pressed="${vote==="tie"}">🤝 Uafgjort</button>`) +
        progress(TYPES.duel.judges(r), id => r.answers[id]);
    },
    result(r, res){
      const w = res.winner === "a" ? r.a : res.winner === "b" ? r.b : null;
      return card("pink", "Duel", TYPES.duel.vs(r, res) + `<h2 class="prompt">${w ? `${nameOf(w)} vandt!` : "Uafgjort!"}</h2>
        <p>Dommernes stemmer: ${nameOf(r.a)} ${res.votes.a} · ${nameOf(r.b)} ${res.votes.b} · uafgjort ${res.votes.tie}</p>`, chili(r.lvl));
    }
  },

  hot:{
    name:"Sandhed eller konsekvens", desc:"Gør det, eller drik dobbelt", w:1.5, min:1,
    start(r, pool){
      r.target = pickLeast("hot", pool, 1)[0].id;
      const t = pickCard("truth", TRUTHS), d = pickCard("dare", DARES);
      Object.assign(r, {truth:t[1], tl:t[0], dare:d[1], dl:d[0], pick:null});
    },
    act(r, pid, v){
      if(pid !== r.target && pid !== myId) return false;
      if((v === "truth" || v === "dare") && !r.pick){ r.pick = v; return true }
      if((v === "done" || v === "drank") && r.pick){ r.choice = v; return "reveal" }
      return false;
    },
    reveal: r => r.choice === "done" ? {win:[r.target], drink:[]} : {drink:[{id:r.target, s:S()*2}]},
    view(r){
      const isT = r.target === myId, t = nameOf(r.target);
      if(!r.pick) return card("violet", "Sandhed eller konsekvens", `<div class="who">${isT ? "Det er dig i stolen!" : `${who(r.target)} er i stolen`}</div>
          <h2 class="prompt">${isT ? "Sandhed eller konsekvens?" : `${t} vælger…`}</h2>`) +
        (isT ? `<div class="choices two"><button class="choice hotpick" data-act="truth">Sandhed</button><button class="choice hotpick" data-act="dare">Konsekvens</button></div>
          <p class="hint">Du ser kortet, når du har valgt. Siger du nej bagefter, drikker du ${tar(S()*2)}.</p>` : judge("Vælg for dem", [["truth","Sandhed"],["dare","Konsekvens"]]));
      const isTruth = r.pick === "truth";
      return card("violet", isTruth ? "Sandhed" : "Konsekvens", `<div class="who">${isT ? "Din tur:" : `${who(r.target)}:`}</div><h2 class="prompt sm">${esc(isTruth ? r.truth : r.dare)}</h2>`, chili(isTruth ? r.tl : r.dl)) +
        (isT ? `<div class="choices two"><button class="choice tall" data-act="done"><span class="em">😈</span>${isTruth ? "Svaret" : "Klaret"}</button>
          <button class="choice tall" data-act="drank"><span class="em">🍺</span>Drik ${tar(S()*2)}</button></div>`
          : `<p class="waiting">${t} ${isTruth ? "svarer" : "gør det"} eller drikker ${tar(S()*2)}.</p>` + judge("Dommer", [["done",`${t} klarede det`],["drank",`${t} drak`]]));
    },
    result(r){
      const isTruth = r.pick === "truth";
      return card("violet", isTruth ? "Sandhed" : "Konsekvens", `<div class="who">${who(r.target)}:</div><h2 class="prompt sm">${esc(isTruth ? r.truth : r.dare)}</h2>
        ${r.choice === "done" ? `<p>${nameOf(r.target)} turde! +1 🏆</p>` : ""}`, chili(isTruth ? r.tl : r.dl));
    }
  },

  /* ---------- Roulette ---------- */
  roulette:{
    name:"Roulette", desc:"Sats 1-3 tår på rød, sort eller grøn", w:1, min:1,
    start(r){ r.spin = null },
    act(r, pid, v){
      if(v === "spin" && pid === myId && !r.spin && Object.keys(r.answers).length){ TYPES.roulette.spin(r); return true }
      if(r.spin || !isObj(v) || ![1,2,3].includes(v.stake) || !["red","black","green"].includes(v.color)) return false;
      r.answers[pid] = {stake:v.stake, color:v.color};
      if(onlineIds().every(id => r.answers[id])) TYPES.roulette.spin(r);   // alle har satset: hjulet snurrer
      return true;
    },
    /* Værten trækker tallet. Alle telefoner animerer hjulet hen til det samme tal */
    spin(r){
      r.spin = {start:Date.now() + 400, idx:rnd(WHEEL.length), turns:5 + rnd(3)};
      const n = r.n;
      setTimeout(() => { if(state.round && state.round.n === n && state.phase === "round") doReveal() }, 400 + SPIN_MS + 700);
    },
    reveal(r){
      if(!r.spin) return {drink:[], give:[]};
      const num = WHEEL[r.spin.idx], col = pocketColor(num), give = [], drink = [];
      Object.entries(r.answers).forEach(([id,b]) => {
        if(!player(id)) return;
        if(b.color === col) give.push({id, s: col === "green" ? b.stake * GREEN_PAYS : b.stake});
        else drink.push({id, s:b.stake});
      });
      return {num, col, give, drink};
    },
    bets(r){
      const list = Object.entries(r.answers).filter(([id]) => player(id));
      if(!list.length) return "";
      return `<div class="progress">${list.map(([id,b]) => `<span class="dot"><span class="e">${emojiOf(id)}</span>${nameOf(id)} · ${b.stake} på <span class="pip ${b.color}"></span>${COLOR_DK[b.color]}</span>`).join("")}</div>`;
    },
    view(r){
      const wheel = wheelSvg(r.spin);
      if(r.spin) return wheel + `<p class="waiting">Hjulet snurrer…</p>` + TYPES.roulette.bets(r);
      if(rouSel.n !== r.n) rouSel = {n:r.n, stake:null, color:null};
      const mine = r.answers[myId], n = Object.keys(r.answers).length;
      const hostSpin = isHost() && n ? `<button class="btn small" data-a="hostact" data-v="spin">Snur hjulet nu (${n} har satset)</button>` : "";
      if(mine) return wheel + `<div class="drinkhead" style="text-align:center">Du satser ${tar(mine.stake)} på ${COLOR_DK[mine.color]}</div>
        <p class="waiting">Hjulet snurrer, når alle har satset.</p>` + TYPES.roulette.bets(r) + hostSpin;
      return wheel + `<div class="label">Hvor mange tår satser du?</div>
        <div class="seg">${[1,2,3].map(s => `<button data-rou="stake:${s}" aria-pressed="${rouSel.stake===s}">${s}<small>${s === 1 ? "tår" : "tår"}</small></button>`).join("")}</div>
        <div class="label">På hvilken farve?</div>
        <div class="choices" style="grid-template-columns:1fr 1fr 1fr">${["red","black","green"].map(c => `<button class="choice colorbet ${c}" data-rou="color:${c}" aria-pressed="${rouSel.color===c}">${COLOR_DK[c][0].toUpperCase() + COLOR_DK[c].slice(1)}</button>`).join("")}</div>
        <p class="hint">Rammer du farven, må du dele din indsats ud. Grøn (0) er sjælden og betaler ${GREEN_PAYS} gange indsatsen. Taber du, drikker du selv indsatsen.</p>
        <button class="btn primary" data-a="rouplace" ${rouSel.stake && rouSel.color ? "" : "disabled"}>Placér indsats</button>` + TYPES.roulette.bets(r) + hostSpin;
    },
    result(r, res){
      if(res.num === undefined) return card("red", "Roulette", `<h2 class="prompt sm">Ingen satsede.</h2>`);
      return wheelSvg(r.spin, true) + `<div class="rouresult"><span class="pip big ${res.col}">${res.num}</span><span>${COLOR_DK[res.col][0].toUpperCase() + COLOR_DK[res.col].slice(1)}</span></div>` +
        (res.give.length ? `<div class="label">Må dele tår ud</div><div class="result">${res.give.map(g => `<div class="res win"><span class="e">${emojiOf(g.id)}</span><span class="n">${nameOf(g.id)}</span><span class="v">deler ${tar(g.s)} ud</span></div>`).join("")}</div>` : "");
    }
  },

  /* ---------- Hexagon ---------- */
  hex:{
    name:"Hexagon", desc:"Vælg en flise, der ikke falder", w:1, min:2,
    start(r, pool){ r.tiles = hexTiles(pool.length > 10 ? 3 : 2); r.fall = null },
    act(r, pid, v){
      if(v === "go" && pid === myId && !r.fall && Object.keys(r.answers).length){ TYPES.hex.go(r); return true }
      if(r.fall || !isObj(v) || !Number.isInteger(v.tile) || v.tile < 0 || v.tile >= r.tiles.length) return false;
      if(Object.entries(r.answers).some(([id,t]) => t === v.tile && id !== pid)) return false;   // en flise pr. spiller
      r.answers[pid] = v.tile;
      const ids = onlineIds();
      if(ids.length >= 2 && ids.every(id => r.answers[id] !== undefined)) TYPES.hex.go(r);
      return true;
    },
    /* En tilfældig optaget flise overlever. De andre falder i tilfældig rækkefølge, indtil kun den er tilbage */
    go(r){
      const occupied = new Set(Object.values(r.answers));
      const survivor = pick([...occupied]);
      let seq = shuffle(r.tiles.map((_,i) => i).filter(i => i !== survivor));
      let last = -1; seq.forEach((t,i) => { if(occupied.has(t)) last = i });
      seq = seq.slice(0, Math.max(last + 1, Math.min(4, seq.length)));
      r.fall = {start:Date.now() + 700, seq, survivor};
      const n = r.n;
      setTimeout(() => { if(state.round && state.round.n === n && state.phase === "round") doReveal() }, 700 + seq.length * HEX_STEP + 1200);
    },
    reveal(r){
      if(!r.fall) return {drink:[]};
      const A = r.answers, ids = Object.keys(A).filter(id => player(id));
      const win = ids.filter(id => A[id] === r.fall.survivor);
      const drink = ids.filter(id => A[id] !== r.fall.survivor).map(id => ({id, s:1}))
        .concat(onlineIds().filter(id => A[id] === undefined).map(id => ({id, s:1})));
      return {win, drink};
    },
    view(r){
      if(r.fall) return hexBoard(r) + `<p class="waiting">Fliserne falder…</p>`;
      const mine = r.answers[myId], n = Object.keys(r.answers).length;
      return `<div class="drinkhead" style="font-size:24px;margin:0">${mine === undefined ? "Tryk på en flise" : "Godt valg? Du kan stadig skifte"}</div>` + hexBoard(r) +
        `<p class="hint">Fliserne falder i tilfældig rækkefølge. Falder din, drikker du 1 tår. Den sidste, der står tilbage, vinder et 🏆 og må dele 2 tår ud. Der kan kun stå én på hver flise.</p>` +
        progress(onlineIds(), id => r.answers[id] !== undefined) +
        (isHost() && n ? `<button class="btn small" data-a="hostact" data-v="go">Lad fliserne falde nu</button>` : "");
    },
    result(r, res){
      return hexBoard(r, true) + `<div class="drinkhead" style="text-align:center">${res.win.length ? `${res.win.map(nameOf).join(" og ")} overlevede! 🏆` : "Ingen valgte en flise"}</div>` +
        (res.win.length ? `<p class="hint" style="text-align:center">${res.win.map(nameOf).join(" og ")} må dele 2 tår ud.</p>` : "");
    }
  },

  /* ---------- Tegn efter streg ---------- */
  trace:{
    name:"Tegn efter streg", desc:"Mest præcis vinder · 40 tegninger", w:1.2, min:1,
    can: () => (state.used.trace || []).length < DRAWINGS.length,   // ingen tegning gentages i samme spil
    start(r){
      const used = state.used.trace = state.used.trace || [];
      const i = pick(DRAWINGS.map((_,k) => k).filter(k => !used.includes(k)));
      used.push(i); r.drawing = i; r.limit = 3000 + TRACE_MS + 5000;
    },
    act(r, pid, v){
      if(!isObj(v) || typeof v.s !== "number" || !isFinite(v.s) || r.answers[pid] !== undefined) return false;
      const p = typeof v.p === "string" && v.p.length <= 6000 && /^[0-9,| ]*$/.test(v.p) ? v.p : "";
      r.answers[pid] = {s:Math.max(0, Math.min(100, Math.round(v.s))), p};
      return true;
    },
    done: allOnlineAnswered,
    /* Placering efter præcision. Nr. 1 vinder, og alle andre drikker én tår pr. plads under nr. 1 */
    reveal(r){
      const A = r.answers, ids = Object.keys(A).filter(id => player(id)).sort((a,b) => A[b].s - A[a].s);
      const places = []; let place = 0, prev = null;
      ids.forEach((id,i) => { if(A[id].s !== prev){ place = i + 1; prev = A[id].s } places.push({id, place}) });
      const asleep = onlineIds().filter(id => A[id] === undefined);
      const drink = places.filter(o => o.place > 1).map(o => ({id:o.id, s:o.place - 1}))
        .concat(asleep.map(id => ({id, s:ids.length})));
      return {places, asleep, drink, win: places.filter(o => o.place === 1 && A[o.id].s > 0).map(o => o.id)};
    },
    result(r, res){
      const D = DRAWINGS[r.drawing], A = r.answers;
      return card("teal", "Tegn efter streg", `<h2 class="prompt">${res.win.length ? `${res.win.map(nameOf).join(" og ")} vandt!` : "Ingen ramte stregerne"}</h2>
          <div class="who">Tegningen var: ${esc(D[0])}</div><p>Nr. 2 drikker 1 tår, nr. 3 drikker 2 tår, og så videre.</p>`) +
        `<div class="thumbs">${res.places.map(o => `<div class="thumb ${o.place===1?"first":""}">${traceSvg(D[1], decodeStrokes(A[o.id].p))}
          <div class="meta"><b>${o.place}. ${emojiOf(o.id)} ${nameOf(o.id)}</b><span>${A[o.id].s} %</span></div></div>`).join("")}
          ${res.asleep.map(id => `<div class="thumb">${traceSvg(D[1], [])}<div class="meta"><b>${emojiOf(id)} ${nameOf(id)}</b><span>Tegnede ikke</span></div></div>`).join("")}</div>`;
    }
  },

  reflex:{
    name:"Hurtigste finger", desc:"Tryk når skærmen er grøn", w:0.8, min:1,
    start(r){ r.delay = 1500 + rnd(4000); r.limit = 3000 + r.delay + 6000 },
    act: gameAct(99999), done: allOnlineAnswered,
    reveal: r => gameReveal(r, true),
    result: (r,res) => gameResult(r, res, "teal", () => `må dele ${tar(S())} ud`)
  },
  tap:{
    name:"Tap-krig", desc:"Flest tryk på 5 sekunder", w:0.8, min:1,
    start(r){ r.limit = 3000 + 5000 + 5000 },
    act: gameAct(150), done: allOnlineAnswered,
    reveal: r => gameReveal(r, false),
    result: (r,res) => gameResult(r, res, "teal", () => `må dele ${tar(S())} ud`)
  },

  vote:{
    name:"Afstemning", desc:"Flest stemmer drikker", w:0.8, min:2,
    start(r){ const c = pickCard("vote", VOTES); r.text = c[1]; r.lvl = c[0] },
    act(r, pid, v){ if(player(v)){ r.answers[pid] = v; return true } return false },
    opt: () => true, done: allOnlineAnswered,
    reveal(r){
      const tally = tallyVotes(r.answers), max = tally.length ? tally[0][1] : 0;
      return {tally, drink: tally.filter(([,c]) => c === max && max > 0).map(([id]) => ({id, s:S()}))};
    },
    view(r){
      return card("amber", "Afstemning", `<h2 class="prompt">${esc(r.text)}</h2>`, chili(r.lvl)) +
        `<div class="label">Stem på én · flest stemmer drikker ${tar(S())}</div>` + voteButtons(state.players.map(p => p.id), r.answers[myId]) +
        progress(onlineIds(), id => r.answers[id]);
    },
    result: (r,res) => card("amber", "Afstemning", `<h2 class="prompt">${esc(r.text)}</h2>`, chili(r.lvl)) + tallyView(res.tally)
  },

  chaos:{
    name:"Kaoskort", desc:"Tilfældige kort", w:0.8, min:1,
    start(r, pool){
      const c = pickCard("chaos", CHAOS); r.lvl = c.l;
      const p = pick(pool); let drinkers = [], pName = p.name;
      if(c.who === "rand") drinkers = [p];
      if(c.who === "all") drinkers = pool;
      if(c.who === "least"){ const min = Math.min(...pool.map(x => x.sips)); drinkers = pool.filter(x => x.sips === min); pName = drinkers.map(x => x.name).join(" og ") }
      r.text = c.t.replace(/\{p\}/g, "\u0001" + pName + "\u0002").replace(/\{S\}/g, tar(S()));
      return {drink: drinkers.map(x => ({id:x.id, s:S()}))};
    },
    result: r => card("chaos", "Kaoskort", `<h2 class="prompt sm">${esc(r.text).replace(/\u0001(.*?)\u0002/g, "<b>$1</b>")}</h2>`, chili(r.lvl))
  }
};

/* ============================================================
   GÆST
   ============================================================ */
/* Gæstens forbindelse til signalserveren åbnes allerede på forsiden, så "Deltag" går hurtigt */
let warmPeer = null;
const newGuestPeer = () => new Peer(PREFIX + "g-" + Math.random().toString(36).slice(2,12), {debug:0});
function warmUp(){
  if(role || warmPeer || typeof Peer !== "function") return;
  try{ warmPeer = newGuestPeer(); warmPeer.on("error", () => {}) }catch(e){ warmPeer = null }
}
function dropWarm(){ if(warmPeer) try{ warmPeer.destroy() }catch(e){} warmPeer = null }

function joinGame(code){
  const warm = warmPeer; warmPeer = null;
  teardown();
  role = "guest"; state = null; lastJson = ""; lastFlash = null;
  ui = {...ui, screen:"connecting", err:"", code, menu:false, status:`Forbinder til spillet ${code}…`};
  render();
  if(warm && !warm.destroyed && !warm.disconnected) peer = warm;
  else { if(warm) try{ warm.destroy() }catch(e){} peer = newGuestPeer() }
  if(peer.open) setTimeout(connectHost); else peer.on("open", () => connectHost());
  peer.on("disconnected", () => setTimeout(() => { if(peer && !peer.destroyed) peer.reconnect() }, 1500));
  peer.on("error", e => {
    if(e.type === "peer-unavailable"){
      connecting = false;
      if(!everConnected){ teardown(); role=null; ui = {...ui, screen:"home", err:`Fandt ikke spillet ${code}. Tjek koden, og at værten har spillet åbent.`}; render(); return }
      ui.online = false; render(); scheduleReconnect();
      return;
    }
    if(["network","server-error","socket-error","disconnected"].includes(e.type)){ ui.online=false; render(); scheduleReconnect() }
  });
}

function connectHost(){
  if(!peer || peer.destroyed || connecting || (hostConn && hostConn.open)) return;
  if(peer.disconnected){ peer.reconnect(); scheduleReconnect(); return }
  connecting = true;
  const c = peer.connect(PREFIX + ui.code.toLowerCase(), {reliable:true});
  const timeout = setTimeout(() => { if(!c.open){ connecting=false; try{c.close()}catch(e){} scheduleReconnect() } }, 6000);
  c.on("open", () => {
    clearTimeout(timeout); connecting = false;
    hostConn = c; everConnected = true; lastHostMsg = Date.now(); ui.online = true;
    store.set(SAVE_LAST, ui.code);
    c.send({t:"hello", id:myId, name:me.name, emoji:me.emoji, photo:me.photo});
    keepAwake();
  });
  c.on("data", d => {
    lastHostMsg = Date.now();
    if(!isObj(d)) return;
    if(d.t === "state" && isObj(d.s)){
      if(typeof d.now === "number") clockOffset = Date.now() - d.now;
      const json = JSON.stringify(d.s);
      const wasOffline = !ui.online || ui.screen !== "game";
      ui.screen = "game"; ui.online = true;
      if(json === lastJson && !wasOffline) return;   // intet nyt: undgå at gentegne midt i en indtastning
      lastJson = json; state = d.s; render();
    }
    if(d.t === "roster" && isObj(d.photos)){
      photoCache = {}; Object.entries(d.photos).forEach(([id, ph]) => { if(okPhoto(ph)) photoCache[id] = ph });
      if(state) render();
    }
    if(d.t === "closed"){ store.del(SAVE_LAST); teardown(); role=null; state=null; ui={...ui, screen:"home", err:"Værten har lukket spillet."}; render() }
    if(d.t === "kicked"){ store.del(SAVE_LAST); teardown(); role=null; state=null; ui={...ui, screen:"home", err:"Du blev fjernet fra spillet."}; render() }
  });
  c.on("close", () => { if(hostConn === c){ hostConn = null; ui.online = false; render(); scheduleReconnect() } });
  c.on("error", () => {});
}
function scheduleReconnect(){
  if(role !== "guest" || guestTimer) return;
  if(!everConnected){ ui.status = `Prøver igen at finde spillet ${ui.code}…`; if(ui.screen === "connecting") render() }
  guestTimer = setTimeout(() => { guestTimer = null; if(role === "guest" && !(hostConn && hostConn.open)) connectHost() }, 1200);
}
setInterval(() => {
  if(role !== "guest") return;
  if(hostConn && hostConn.open){
    try{ hostConn.send({t:"ping"}) }catch(e){}
    if(Date.now() - lastHostMsg > 14000){ try{ hostConn.close() }catch(e){} hostConn = null; ui.online = false; render(); scheduleReconnect() }
  }
}, 4000);

function send(msg){ if(hostConn && hostConn.open) try{ hostConn.send(msg) }catch(e){} }

function closeGame(){
  if(role === "host"){
    guests.forEach(g => { try{ g.conn.send({t:"closed"}) }catch(e){} });
    store.del(SAVE_HOST);
  } else if(hostConn && hostConn.open){
    try{ hostConn.send({t:"leave"}) }catch(e){}
    store.del(SAVE_LAST);
  }
  setTimeout(() => { teardown(); state = null; role = null; ui = {screen:"home", err:"", code:"", menu:false, online:true, call:false}; render() }, 250);
}

function teardown(){
  clearTimeout(guestTimer); guestTimer = null;
  guests.forEach(g => { try{ g.conn.close() }catch(e){} }); guests.clear();
  if(hostConn) try{ hostConn.close() }catch(e){}
  hostConn = null;
  if(peer) try{ peer.destroy() }catch(e){}
  peer = null; everConnected = false; connecting = false;
  clearMg(); mg = {n:-1};
  lgClose(); lg = {n:-1};
}

  const T = TYPES[r.type];
  if(T.opt && T.opt(v)){ r.answers[myId] = v; render() }   // vis valget med det samme
  send({t:"act", n:r.n, v});
}
function side(v){
  buzz(15);
  if(role === "host") hostSide(myId, v); else send({t:"side", v});
}

let mfkSel = {n:-1}, kp = {n:-1}, peek = {n:-1};
let mg = {n:-1};
const MG_TYPES = ["reflex","tap","stop","trace"];
function clearMg(){ (mg.timers || []).forEach(clearTimeout) }
function mgLater(fn, ms){ const n = mg.n; mg.timers.push(setTimeout(() => { if(mg.n === n) fn() }, ms)) }
function ensureMg(r){
  if(mg.n === r.n) return;
  clearMg();
  mg = {n:r.n, type:r.type, phase:"count", start:performance.now() + 3000, timers:[]};
  if(r.answers[myId] !== undefined){ mg.phase = "done"; mg.score = isObj(r.answers[myId]) ? r.answers[myId].s : r.answers[myId]; return }
  mgLater(render, 1000); mgLater(render, 2000);
  mgLater(() => beginMg(r), 3000);
}
function beginMg(r){
  if(mg.phase !== "count") return;
  mg.t0 = performance.now();
  if(r.type === "reflex"){
    mg.phase = "wait";
    mgLater(() => { if(mg.phase === "wait"){ mg.phase = "go"; mg.t0 = performance.now(); buzz(60); render() } }, r.delay);
  }
  if(r.type === "tap"){ mg.phase = "play"; mg.taps = 0; mgLater(() => finishMg(mg.taps), 5000) }
  if(r.type === "stop"){ mg.phase = "play"; mg.target = r.target; mgLater(() => { if(mg.phase === "play") finishMg(9999) }, r.target + 5000) }
  if(r.type === "trace"){ mg.phase = "play"; trace = {n:r.n, strokes:[], cur:null, drawing:false}; mgLater(finishTrace, TRACE_MS) }
  buzz(30); render();
}

/* ============================================================
   PARTY-MOTOR: minispil i fuld skærm på et lærred (360×640 logiske enheder).
   Værten sender et frø; alle telefoner bygger samme bane og måler selv deres score.
   ============================================================ */
const LG = {};
const LW = 360, LH = 640;
const PC = {bg:"#23101B", bg2:"#33172A", line:"#4A2440", foam:"#FFF3E2", amber:"#FFB020", pink:"#FF5C8A", teal:"#3DD6C0", sky:"#6EC1FF", red:"#FF4D3D", green:"#2FD36B", muted:"#C9A9B8", ink:"#23101B", violet:"#A98BFF"};
const DISPF = "'Bagel Fat One', 'Arial Black', system-ui, sans-serif";
let lg = {n:-1};
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
const hashStr = s => { let h = 2166136261; for(const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0 };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
/* tegnehjælpere */
function rrect(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r); g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath() }
function txt(g, s, x, y, size, color, align, weight){ g.fillStyle = color; g.font = `${weight || 800} ${size}px Figtree, system-ui, sans-serif`; g.textAlign = align || "center"; g.textBaseline = "middle"; g.fillText(s, x, y) }
function dtxt(g, s, x, y, size, color){ g.fillStyle = color; g.font = `${size}px ${DISPF}`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(s, x, y) }
function emo(g, e, x, y, size){ g.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui,sans-serif`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(e, x, y) }
function btn(g, x, y, w, h, label, color, on){ rrect(g, x, y, w, h, 18); g.fillStyle = on ? color : PC.bg2; g.fill(); g.lineWidth = 3; g.strokeStyle = color; g.stroke(); txt(g, label, x + w/2, y + h/2, 22, on ? PC.ink : PC.foam) }
const swipeDir = (a, b, min) => { const dx = b.x - a.x, dy = b.y - a.y; if(Math.hypot(dx, dy) < (min || 40)) return null; return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down") };

/* Fælles rangregel: sidst drikker S, den nederste fjerdedel drikker 1, nr. 1 får 🏆 og deler S ud */
function rankOutcome(scores, better){
  const ids = Object.keys(scores).filter(id => player(id)).sort((a,b) => better === "low" ? scores[a] - scores[b] : scores[b] - scores[a]);
  const asleep = onlineIds().filter(id => scores[id] === undefined);
  const places = []; let place = 0, prev = null;
  ids.forEach((id,i) => { if(scores[id] !== prev){ place = i + 1; prev = scores[id] } places.push({id, place, score:scores[id]}) });
  const n = ids.length + asleep.length, drink = [];
  if(n >= 2){
    const lastPlace = places.length ? places[places.length-1].place : 0;
    const lastIds = asleep.length ? asleep : places.filter(p => p.place === lastPlace && p.place !== 1).map(p => p.id);
    lastIds.forEach(id => drink.push({id, s:S()}));
    const worstFirst = [...asleep, ...[...places].reverse().map(p => p.id)];
    const k = Math.ceil(n / 4), placeOf = id => { const pl = places.find(p => p.id === id); return pl ? pl.place : Infinity };
    /* står flere lige på grænsen til den nederste fjerdedel, drikker de alle */
    const edge = worstFirst[k - 1] !== undefined ? placeOf(worstFirst[k - 1]) : null;
    worstFirst.forEach((id, i) => {
      if(i >= k && placeOf(id) !== edge) return;
      if(!drink.some(d => d.id === id) && placeOf(id) !== 1) drink.push({id, s:1});
    });
  }
  const win = places.filter(p => p.place === 1).map(p => p.id);
  return {places, asleep, drink, win, give: win.map(id => ({id, s:S()}))};
}

function lgType(key, def){
  return {
    name:def.name, desc:def.desc, w:def.w || 1, min:2, cat:"ffa", tag:def.tag, cap:true,
    start(r){ r.seed = rnd(2147483647); r.limit = 3500 + def.secs * 1000 + 6000 },
    act(r, pid, v){
      if(typeof v !== "number" || !isFinite(v) || r.answers[pid] !== undefined) return false;
      r.answers[pid] = Math.round(v * 100) / 100; return true;
    },
    done: allOnlineAnswered,
    reveal: r => rankOutcome(r.answers, def.better),
    view: r => lgView(r, def),
    result(r, res){
      return card("teal", def.name, `<h2 class="prompt">${res.win.length ? res.win.map(nameOf).join(" og ") + " vandt!" : "Ingen gennemførte"}</h2>`) +
        `<div class="label">Resultater</div><div class="result">${[
          ...res.places.map(p => `<div class="res ${p.place===1?"win":""}"><span class="e">${emojiOf(p.id)}</span><span class="n">${p.place}. ${nameOf(p.id)}</span><span class="v">${esc(def.fmt(p.score))}</span></div>`),
          ...res.asleep.map(id => `<div class="res"><span class="e">${emojiOf(id)}</span><span class="n">${nameOf(id)}</span><span class="v">Nåede ikke</span></div>`)
        ].join("")}</div>`;
    }
  };
}

function lgEnsure(r){
  if(lg.n === r.n) return;
  lgClose();
  lg = {n:r.n, type:r.type, phase:"count", start:performance.now() + 3500};
  if(r.answers[myId] !== undefined){ lg.phase = "done"; lg.score = r.answers[myId]; return }
  lg.timers = [setTimeout(() => lgBegin(r), 3500), setTimeout(render, 1000), setTimeout(render, 2000), setTimeout(render, 3000)];
}
function lgBegin(r){
  if(lg.n !== r.n || lg.phase !== "count") return;
  const def = LG[r.type], stage = $("#stage");
  stage.innerHTML = `<div class="hud"><span class="gt">${esc(def.name)}</span><span class="sc" id="lgsc"></span><span class="tm" id="lgtm"></span></div><canvas id="lgcv"></canvas>`;
  stage.hidden = false;
  const cv = $("#lgcv");
  Object.assign(lg, {cv, g:cv.getContext("2d"), def, phase:"play", t0:performance.now(), last:performance.now(), ended:false, ptrs:{}});
  lg.api = {
    common: mulberry32(r.seed >>> 0),                          // samme for alle telefoner
    rng: mulberry32((r.seed ^ hashStr(myId)) >>> 0),           // kun denne telefon (så man ikke kan skrive af)
    end: () => { lg.ended = true }, buzz
  };
  lg.game = def.create(lg.api);
  lgResize();
  const P = e => { const b = cv.getBoundingClientRect(); return {x:(e.clientX - b.left - lg.ox) / lg.scale, y:(e.clientY - b.top - lg.oy) / lg.scale, id:e.pointerId, t:performance.now()} };
  cv.addEventListener("pointerdown", e => { e.preventDefault(); try{ cv.setPointerCapture(e.pointerId) }catch(_){} const p = P(e); lg.ptrs[e.pointerId] = p; lg.game.down && lg.game.down(p) }, {passive:false});
  cv.addEventListener("pointermove", e => { if(!lg.ptrs[e.pointerId]) return; e.preventDefault(); const p = P(e); lg.ptrs[e.pointerId] = p; lg.game.move && lg.game.move(p) }, {passive:false});
  const up = e => { if(!lg.ptrs[e.pointerId]) return; const p = P(e); delete lg.ptrs[e.pointerId]; lg.game.up && lg.game.up(p, e.type === "pointercancel") };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  buzz(30);
  requestAnimationFrame(lgFrame);
}
function lgResize(){
  if(!lg.cv) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = lg.cv.clientWidth, h = lg.cv.clientHeight;
  lg.cv.width = Math.round(w * dpr); lg.cv.height = Math.round(h * dpr);
  lg.dpr = dpr; lg.scale = Math.min(w / LW, h / LH); lg.ox = (w - LW * lg.scale) / 2; lg.oy = (h - LH * lg.scale) / 2;
}
window.addEventListener("resize", () => { if(lg.phase === "play") lgResize() });
function lgFrame(now){
  if(lg.phase !== "play") return;
  const dt = Math.min(0.05, (now - lg.last) / 1000), t = (now - lg.t0) / 1000, def = lg.def, g = lg.g;
  lg.last = now;
  try{ lg.game.update && lg.game.update(dt, t) }catch(e){ console.error(e) }
  g.setTransform(1,0,0,1,0,0); g.fillStyle = "#160A11"; g.fillRect(0, 0, lg.cv.width, lg.cv.height);
  g.setTransform(lg.dpr * lg.scale, 0, 0, lg.dpr * lg.scale, lg.dpr * lg.ox, lg.dpr * lg.oy);
  g.save(); g.beginPath(); g.rect(0, 0, LW, LH); g.clip();
  g.fillStyle = PC.bg; g.fillRect(0, 0, LW, LH);
  try{ lg.game.draw(g, t) }catch(e){ console.error(e) }
  g.restore();
  const tm = $("#lgtm"), sc = $("#lgsc");
  if(tm) tm.textContent = Math.max(0, Math.ceil(def.secs - t));
  if(sc) sc.textContent = lg.game.hud ? lg.game.hud() : "";
  if(t >= def.secs || lg.ended) return setTimeout(lgFinish, lg.ended ? 600 : 0);   // en kort pause, så man ser slutningen
  requestAnimationFrame(lgFrame);
}
function lgFinish(){
  if(lg.phase !== "play") return;
  let s = 0; try{ s = lg.game.score() }catch(e){}
  lg.phase = "done"; lg.score = s; lgCloseStage();
  act(s); render();
}
function lgCloseStage(){ const st = $("#stage"); if(st){ st.hidden = true; st.innerHTML = "" } lg.cv = null }
function lgClose(){ (lg.timers || []).forEach(clearTimeout); if(lg.phase === "play") lg.phase = "aborted"; lgCloseStage() }
function lgView(r, def){
  lgEnsure(r);
  const prog = progress(onlineIds(), id => r.answers[id] !== undefined);
  if(lg.phase === "count") return card("teal", def.name, `<h2 class="prompt sm">${esc(def.help)}</h2>`) +
    `<div class="lgcount">${Math.max(1, Math.ceil((lg.start - performance.now()) / 1000))}</div><p class="hint" style="text-align:center">Spillet åbner i fuld skærm.</p>` + prog;
  if(lg.phase === "play") return `<p class="waiting">Spillet kører…</p>`;
  const A = r.answers, fin = Object.keys(A).filter(id => player(id)).sort((a,b) => def.better === "low" ? A[a] - A[b] : A[b] - A[a]);
  return card("teal", def.name, `<div class="who">Din score</div><h2 class="prompt">${esc(def.fmt(lg.score))}</h2>`) +
    `<div class="label">Tribunen</div><div class="result">${fin.map((id,i) => `<div class="res ${id===myId?"drink":""}"><span class="e">${emojiOf(id)}</span><span class="n">${i+1}. ${nameOf(id)}</span><span class="v">${esc(def.fmt(A[id]))}</span></div>`).join("")}</div>` +
    `<p class="hint">Sidst drikker ${tar(S())}, den nederste fjerdedel drikker 1, og nr. 1 får 🏆 og deler ${tar(S())} ud.</p>` + prog;
}

/* 1. Dræsinen: pump skiftevis, brems før svingene */
LG.pump = {name:"Dræsinen", desc:"Pump frem, brems før svingene", tag:"hamre", secs:35, better:"low",
  help:"Tryk skiftevis VENSTRE og HØJRE for at pumpe. Før hvert sving skal farten under den røde grænse, ellers afsporer du i 2 sek. Først til 300 m vinder.",
  fmt: v => v < 100 ? dk(v,1) + " s" : Math.round(300 - (v - 100)) + " m",
  create(api){
    const curves = []; let d = 40;
    while(true){ d += 50 + api.common() * 40; if(d > 285) break; curves.push({at:d, max:8 + Math.floor(api.common() * 4)}) }
    let dist = 0, speed = 0, lastSide = null, lock = 0, done = null, flash = 0, msg = "", msgT = 0;
    const next = () => curves.find(c => c.at > dist);
    const tap = side => {
      if(lock > 0 || done !== null) return;
      if(side === lastSide){ speed *= 0.6; flash = 0.3 } else speed = Math.min(26, speed + 1.25);
      lastSide = side; api.buzz(4);
    };
    return {
      down(p){ if(p.y > 430) tap(p.x < LW/2 ? "L" : "R") },
      update(dt, t){
        msgT = Math.max(0, msgT - dt); flash = Math.max(0, flash - dt);
        if(done !== null) return;
        if(lock > 0){ lock -= dt; speed = 0; return }
        speed *= Math.pow(0.55, dt);
        const prev = dist; dist += speed * dt;
        for(const c of curves) if(prev < c.at && dist >= c.at){
          if(speed > c.max){ lock = 2; speed = 0; msg = "AFSPORET!"; msgT = 2; api.buzz(200) } else { msg = "Flot sving!"; msgT = 0.8 }
        }
        if(dist >= 300){ dist = 300; done = t; msg = "I MÅL!"; msgT = 3; api.end() }
      },
      draw(g){
        /* fremdrift med sving */
        rrect(g, 20, 20, 320, 14, 7); g.fillStyle = PC.bg2; g.fill();
        rrect(g, 20, 20, 320 * dist / 300, 14, 7); g.fillStyle = PC.amber; g.fill();
        curves.forEach(c => { g.fillStyle = PC.red; g.fillRect(20 + 320 * c.at / 300 - 2, 16, 4, 22) });
        /* skinner i bevægelse */
        g.fillStyle = "#3A1E2E"; g.fillRect(0, 150, LW, 110);
        const off = (dist * 14) % 40;
        g.fillStyle = "#6B4A3A"; for(let x = -off; x < LW; x += 40) g.fillRect(x, 186, 14, 46);
        g.fillStyle = "#B8B0A8"; g.fillRect(0, 194, LW, 6); g.fillRect(0, 220, LW, 6);
        const nc = next();
        if(nc && nc.at - dist < 25){
          const x = 120 + (nc.at - dist) * 9;
          rrect(g, x - 34, 98, 68, 44, 8); g.fillStyle = PC.red; g.fill(); txt(g, "↪ " + nc.max, x, 120, 20, "#fff");
        }
        emo(g, "🛒", 110, 190, 56);
        /* fartmåler */
        const lim = nc && nc.at - dist < 45 ? nc.max : null;
        dtxt(g, speed.toFixed(1), 180, 312, 56, lim && speed > lim ? PC.red : PC.foam);
        txt(g, "fart", 180, 350, 16, PC.muted, "center", 600);
        rrect(g, 40, 370, 280, 18, 9); g.fillStyle = PC.bg2; g.fill();
        rrect(g, 40, 370, 280 * Math.min(1, speed / 26), 18, 9); g.fillStyle = lim && speed > lim ? PC.red : PC.teal; g.fill();
        if(lim){ const lx = 40 + 280 * lim / 26; g.fillStyle = PC.red; g.fillRect(lx - 2, 362, 4, 34); txt(g, "SVING om " + Math.ceil(nc.at - dist) + " m", 180, 410, 16, PC.red) }
        /* pumpeknapper */
        btn(g, 16, 440, 158, 170, "VENSTRE", PC.amber, lastSide !== "L");
        btn(g, 186, 440, 158, 170, "HØJRE", PC.amber, lastSide === "L");
        if(flash > 0) txt(g, "Skiftevis!", 180, 425, 18, PC.pink);
        if(msgT > 0) dtxt(g, msg, 180, 268, 40, msg === "AFSPORET!" ? PC.red : PC.amber);
      },
      score: () => done !== null ? done : 100 + (300 - dist),
      hud: () => Math.round(dist) + " / 300 m"
    };
  }};

/* 2. Etiketpuslet: drej brikkerne, til etiketten er hel */
LG.label = {name:"Etiketpuslet", desc:"Drej brikkerne på plads", tag:"tænk", secs:35, better:"low",
  help:"En øletiket er delt i 3×3 brikker, der er drejet skævt. Tryk på en brik for at dreje den. Bliv hurtigst færdig med to etiketter.",
  fmt: v => v < 100 ? dk(v,1) + " s" : Math.round(v - 100) + " brikker manglede",
  create(api){
    const names = ["PILS","BOCK","IPA","SKÅL","STOUT","CLASSIC"], cols = [PC.amber, PC.pink, PC.teal, PC.sky, PC.violet, PC.green];
    const labels = [0,1].map(() => {
      const c = document.createElement("canvas"); c.width = c.height = 540; const x = c.getContext("2d"); x.scale(2,2);
      const col = cols[Math.floor(api.common() * cols.length)], word = names[Math.floor(api.common() * names.length)];

      x.font = "800 16px Figtree, sans-serif"; x.fillText("ANNO " + (1847 + Math.floor(api.common() * 150)), 135, 170);
      x.fillStyle = col; x.beginPath(); for(let i=0;i<10;i++){ const a = -Math.PI/2 + i*Math.PI/5, rr = i % 2 ? 9 : 22; x.lineTo(46 + Math.cos(a)*rr, 46 + Math.sin(a)*rr) } x.fill();
      x.fillStyle = col; x.fillRect(150, 228, 110, 26); x.fillStyle = PC.ink; x.font = "800 13px Figtree, sans-serif"; x.fillText("33 cl · 4,6 %", 205, 241);
      return c;
    });
    const scramble = () => { let r; do { r = Array.from({length:9}, () => Math.floor(api.common() * 4)) } while(r.filter(v => v).length < 6); return r };
    let li = 0, rot = scramble(), done = null, solvedAt = 0, next = [scramble()];

      update(dt, t){

      draw(g){

          g.drawImage(L, c*180, r*180, 180, 180, -T/2 + 1, -T/2 + 1, T - 2, T - 2); g.restore();
          if(rot[i]){ g.strokeStyle = "rgba(255,255,255,.12)"; g.lineWidth = 1; g.strokeRect(X0 + c*T + 1, Y0 + r*T + 1, T - 2, T - 2) }
        }
        if(solvedAt) dtxt(g, "Klar! 🍺", 180, 470, 40, PC.green);
        txt(g, "Tryk for at dreje en brik", 180, 520, 18, PC.muted, "center", 600);
      },
      score(){ if(done !== null) return done; return 100 + rot.filter(v => v).length + (li < 1 ? 9 : 0) },
      hud: () => "Etiket " + Math.min(li + 1, 2) + "/2"
    };
  }};

/* 3. Buffeten: spis mad, smid alt andet væk */
LG.buffet = {name:"Buffeten", desc:"Swipe op for at spise", tag:"swipe", secs:25, better:"high",
  help:"Swipe OP for at spise mad, og swipe til SIDEN for at smide alt andet væk. Spiser du noget forkert, får du ondt i maven i 2 sek.",
  fmt: v => v + " point",
  create(api){
    const FOOD = [["🌭",1],["🍕",2],["🍰",3],["🍔",2],["🌮",1]], JUNK = ["👟","🧼","📺","🧦","🔋","🪴","🧸"];
    const items = Array.from({length:120}, () => api.common() < 0.6 ? {e:FOOD[Math.floor(api.common() * FOOD.length)], food:true} : {e:[JUNK[Math.floor(api.common() * JUNK.length)], 0], food:false});
    let i = 0, pts = 0, sick = 0, start = null, anim = null, msg = "", msgT = 0;
    const go = dir => {
      if(sick > 0 || anim) return;
      const it = items[i];
      if(dir === "up"){ if(it.food){ pts += it.e[1]; msg = "+" + it.e[1]; msgT = 0.5; api.buzz(8) } else { sick = 2; msg = "Av, maven! 🤢"; msgT = 2; api.buzz(150) } }
      anim = {dir, t:0, e:it.e[0]}; i++;
    };
    return {
      down(p){ start = p },
      up(p){ if(!start) return; const d = swipeDir(start, p, 40); start = null; if(d === "up") go("up"); else if(d === "left" || d === "right") go(d) },
      update(dt){ sick = Math.max(0, sick - dt); msgT = Math.max(0, msgT - dt); if(anim){ anim.t += dt; if(anim.t > 0.22) anim = null } },
      draw(g){
        txt(g, "↑ SPIS", 180, 70, 22, PC.green);
        txt(g, "← SMID VÆK →", 180, 560, 20, PC.muted);
        g.fillStyle = PC.foam; g.beginPath(); g.ellipse(180, 380, 130, 40, 0, 0, 7); g.fill();
        g.fillStyle = "#E8D8C0"; g.beginPath(); g.ellipse(180, 380, 100, 28, 0, 0, 7); g.fill();
        if(anim){ const k = anim.t / 0.22, dx = anim.dir === "left" ? -260*k : anim.dir === "right" ? 260*k : 0, dy = anim.dir === "up" ? -260*k : 0; g.globalAlpha = 1 - k; emo(g, anim.e, 180 + dx, 300 + dy, 120); g.globalAlpha = 1 }
        else if(items[i]) emo(g, items[i].e[0], 180, 300, 120);
        if(items[i+1]){ g.globalAlpha = .5; emo(g, items[i+1].e[0], 300, 470, 40); g.globalAlpha = 1; txt(g, "næste", 300, 505, 13, PC.muted, "center", 600) }
        if(sick > 0){ g.fillStyle = "rgba(47,211,107,.18)"; g.fillRect(0,0,LW,LH) }
        if(msgT > 0) dtxt(g, msg, 180, 180, 34, sick > 0 ? PC.green : PC.amber);
      },
      score: () => pts,
      hud: () => pts + " point"
    };
  }};

/* 4. Kassetårnet: stabl ølkasserne, det der stikker ud skæres af */
LG.stack = {name:"Kassetårnet", desc:"Stabl ølkasser så højt du kan", tag:"timing", secs:30, better:"high",
  help:"En ølkasse glider frem og tilbage. Tryk for at slippe den på tårnet. Det, der stikker ud, bliver skåret af. Flest kasser vinder.",
  fmt: v => v + " kasser",
  create(api){
    const H = 30;
    let tower = [{x:80, w:200}], cur = {x:0, w:200, dir:1}, speed = 150, over = false, perfect = 0, cut = null;
    const drop = () => {
      if(over) return;
      const top = tower[tower.length-1];
      let l = Math.max(cur.x, top.x), r = Math.min(cur.x + cur.w, top.x + top.w);
      if(Math.abs(cur.x - top.x) < 5){ l = top.x; r = top.x + top.w; perfect = 0.6; api.buzz(20) }
      if(r - l < 8){ over = true; cut = {x:cur.x, w:cur.w, y:0, vy:0}; api.buzz(200); api.end(); return }
      cut = cur.x < l ? {x:cur.x, w:l - cur.x, y:0, vy:0} : cur.x + cur.w > r ? {x:r, w:cur.x + cur.w - r, y:0, vy:0} : null;
      tower.push({x:l, w:r - l}); speed = Math.min(420, speed + 14);
      cur = {x: cur.dir > 0 ? 0 : LW - (r - l), w:r - l, dir:cur.dir};
      api.buzz(8);
    };
    return {
      down(){ drop() },
      update(dt){
        perfect = Math.max(0, perfect - dt);
        if(cut){ cut.vy += 900*dt; cut.y += cut.vy*dt; if(cut.y > 700) cut = null }
        if(over) return;
        cur.x += cur.dir * speed * dt;
        if(cur.x < 0){ cur.x = 0; cur.dir = 1 } if(cur.x + cur.w > LW){ cur.x = LW - cur.w; cur.dir = -1 }
      },
      draw(g){
        const n = tower.length, baseY = 600, cam = Math.max(0, n - 12) * H;
        const box = (x, y, w, c) => { g.fillStyle = c; g.fillRect(x, y, w, H - 2); g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(x, y + H - 9, w, 7); g.fillStyle = "rgba(255,255,255,.25)"; for(let k = x + 12; k < x + w - 6; k += 22) g.fillRect(k, y + 6, 10, 10) };
        tower.forEach((b, i) => box(b.x, baseY - i*H + cam, b.w, i % 2 ? PC.amber : "#E89A10"));
        const curY = baseY - n*H + cam;
        if(!over) box(cur.x, curY, cur.w, PC.pink);
        if(cut){ g.globalAlpha = .7; box(cut.x, curY + H + cut.y, cut.w, PC.pink); g.globalAlpha = 1 }
        if(perfect > 0) dtxt(g, "Perfekt!", 180, 120, 36, PC.green);
        if(over) dtxt(g, "Væltet!", 180, 200, 44, PC.red);
        dtxt(g, String(n - 1), 300, 70, 44, PC.foam);
        txt(g, "Tryk hvor som helst", 120, 70, 16, PC.muted, "center", 600);
      },
      score: () => tower.length - 1,
      hud: () => (tower.length - 1) + " kasser"
    };
  }};

/* 5. Tjenerbakken: hold glasset på bakken */
LG.tray = {name:"Tjenerbakken", desc:"Hold ølglasset på bakken", tag:"træk", secs:30, better:"high",
  help:"Træk fingeren til siden for at vippe bakken og holde ølglasset på midten, mens bakken bliver skubbet. Glider glasset af, er du ude.",
  fmt: v => v < 30 ? dk(v,1) + " s" : "Hele tiden · " + Math.round((v - 30) * 100) + " % midt",
  create(api){
    const pushes = []; let pt = 1.2; while(pt < 30){ pt += 1.0 + api.common() * 1.6; pushes.push({t:pt, v:(api.common() < .5 ? -1 : 1) * (60 + api.common() * 110 + pt * 4)}) }
    let x = 0, v = 0, ang = 0, finger = null, out = null, sum = 0, tt = 0, wind = 0, windDir = 1;
    return {
      down(p){ finger = p.x }, move(p){ finger = p.x }, up(){ finger = null },
      update(dt, t){
        if(out !== null) return;
        tt = t; wind = Math.max(0, wind - dt);
        const target = finger === null ? ang * 0.98 : clamp((finger - 180) / 260, -0.45, 0.45);
        ang += (target - ang) * Math.min(1, dt * 12);
        for(const p of pushes) if(!p.used && t >= p.t){ p.used = true; v += p.v; wind = 0.6; windDir = Math.sign(p.v) }
        v += 520 * Math.sin(ang) * dt; v *= Math.pow(0.85, dt); x += v * dt;
        sum += Math.abs(x) * dt;
        if(Math.abs(x) > 125){ out = t; api.buzz(250); api.end() }
      },
      draw(g){
        g.save(); g.translate(180, 360); g.rotate(ang);
        rrect(g, -140, 0, 280, 14, 7); g.fillStyle = "#C9C2B8"; g.fill();
        g.fillStyle = "rgba(47,211,107,.25)"; g.fillRect(-30, -4, 60, 4);
        emo(g, out !== null ? "💥" : "🍺", x, -26, 46);
        g.restore();
        if(wind > 0) emo(g, windDir > 0 ? "💨" : "💨", windDir > 0 ? 50 : 310, 300, 40);
        txt(g, "Træk til siden for at vippe", 180, 560, 18, PC.muted, "center", 600);
        if(out !== null) dtxt(g, "Glasset røg!", 180, 200, 40, PC.red);
      },
      score(){ if(out !== null) return out; return 30 + Math.max(0, 1 - (sum / 30) / 125) * 0.99 },
      hud: () => dk(out !== null ? out : tt, 1) + " s"
    };
  }};

/* 6. Ballonpumpen: pump, men bind knude før den springer */
LG.balloon = {name:"Ballonpumpen", desc:"Pump, men bind knude i tide", tag:"nerve", secs:30, better:"high",
  help:"Pump ballonen. Jo større, jo flere point. Når den sitrer og viser ⚠, er den tæt på at springe, så tryk BIND KNUDE i tide. Du har tre balloner.",
  fmt: v => Math.round(v) + " liter",
  create(api){
    const th = [0,1,2].map(() => 45 + api.common() * 50);                         // samme tre grænser for alle
    for(let i = th.length - 1; i > 0; i--){ const j = Math.floor(api.rng() * (i + 1)); [th[i], th[j]] = [th[j], th[i]] }   // men egen rækkefølge
    const warn = th.map(t => t * 0.8 + (api.rng() - .5) * 6);
    let k = 0, s = 0, banked = [], pop = 0, done = false;
    const nextB = () => { k++; s = 0; if(k >= 3){ done = true; api.end() } };
    return {
      down(p){
        if(done || pop > 0 || p.y < 430) return;
        if(p.x < 220){ s += 3.2; api.buzz(4); if(s >= th[k]){ banked.push(0); pop = 0.8; api.buzz(250) } }
        else if(s > 0){ banked.push(Math.round(s)); api.buzz(30); nextB() }
      },
      update(dt){ if(pop > 0){ pop -= dt; if(pop <= 0) nextB() } },
      draw(g, t){
        const warnOn = !done && pop <= 0 && s >= warn[k];
        const rr = 20 + Math.sqrt(s) * 13, jx = warnOn ? Math.sin(t * 60) * 3 : 0;
        if(!done){
          if(pop > 0){ dtxt(g, "BANG!", 180, 240, 56, PC.red) }
          else {
            g.fillStyle = [PC.pink, PC.sky, PC.amber][k % 3]; g.beginPath(); g.ellipse(180 + jx, 250, rr, rr * 1.15, 0, 0, 7); g.fill();
            g.strokeStyle = PC.foam; g.lineWidth = 2; g.beginPath(); g.moveTo(180, 250 + rr * 1.15); g.lineTo(180, 400); g.stroke();
            if(warnOn) dtxt(g, "⚠", 180, 250, 46, PC.ink);
            txt(g, Math.round(s) + " liter", 180, 418, 18, PC.foam);
          }
        } else dtxt(g, "Færdig!", 180, 250, 44, PC.green);
        txt(g, "Ballon " + Math.min(k + 1, 3) + " af 3 · " + banked.map(b => b || "💥").join(" + "), 180, 60, 16, PC.muted, "center", 600);
        btn(g, 16, 440, 196, 170, "PUMP", PC.amber, true);
        btn(g, 224, 440, 120, 170, "BIND", PC.green, s > 0);
      },
      score: () => banked.reduce((a,b) => a + b, 0),
      hud: () => banked.reduce((a,b) => a + b, 0) + " l"
    };
  }};

/* 7. Find fætteren: find den ene, der ligner forbilledet */
LG.cousin = {name:"Find fætteren", desc:"Find den rigtige i mylderet", tag:"øje", secs:40, better:"low",
  help:"40 næsten ens fætre myldrer rundt. Find og tryk på den, der ligner forbilledet øverst. Et forkert tryk giver 2 sek straf. Tre omgange på tid.",
  fmt: v => dk(v,1) + " s",
  create(api){
    const R = api.rng, SHIRTS = [PC.pink, PC.sky, PC.teal, PC.violet, PC.amber];
    const rf = () => ({hat:Math.floor(R()*4), gl:Math.floor(R()*3), mu:Math.floor(R()*2), sh:Math.floor(R()*3)});
    const same = (a, b) => a.hat === b.hat && a.gl === b.gl && a.mu === b.mu && a.sh === b.sh;
    let round = 0, target, figs, rStart = 0, total = 0, penalty = 0, flash = 0, done = false;
    const build = t => {
      target = rf(); figs = [];
      for(let i=0;i<40;i++){ let f; do { f = rf() } while(i > 0 && same(f, target)); if(i === 0) f = {...target};
        figs.push({...f, col:SHIRTS[Math.floor(R()*SHIRTS.length)], x:30 + R()*300, y:150 + R()*450, vx:(R()-.5)*50, vy:(R()-.5)*50, t:i === 0}) }
      rStart = t;
    };
    const drawFig = (g, f, x, y, s) => {
      g.fillStyle = f.col; g.fillRect(x - 10*s, y + 6*s, 20*s, 16*s);
      if(f.sh === 1){ g.fillStyle = "rgba(255,255,255,.7)"; for(let k=0;k<3;k++) g.fillRect(x - 10*s, y + (8 + k*5)*s, 20*s, 2*s) }
      if(f.sh === 2){ g.fillStyle = "rgba(255,255,255,.8)"; [[-5,11],[4,11],[-1,17]].forEach(([a,b]) => { g.beginPath(); g.arc(x + a*s, y + b*s, 1.8*s, 0, 7); g.fill() }) }
      g.fillStyle = "#F2C9A0"; g.beginPath(); g.arc(x, y, 9*s, 0, 7); g.fill();
      g.fillStyle = PC.ink;
      if(f.hat === 1){ g.fillRect(x - 7*s, y - 20*s, 14*s, 12*s); g.fillRect(x - 11*s, y - 9*s, 22*s, 3*s) }
      if(f.hat === 2){ g.beginPath(); g.arc(x, y - 6*s, 8*s, Math.PI, 0); g.fill(); g.fillRect(x, y - 7*s, 12*s, 3*s) }
      if(f.hat === 3){ g.fillStyle = "#E8C77A"; g.beginPath(); g.moveTo(x - 8*s, y - 7*s); g.lineTo(x - 8*s, y - 17*s); g.lineTo(x - 3*s, y - 12*s); g.lineTo(x, y - 18*s); g.lineTo(x + 3*s, y - 12*s); g.lineTo(x + 8*s, y - 17*s); g.lineTo(x + 8*s, y - 7*s); g.fill() }
      g.strokeStyle = PC.ink; g.lineWidth = 1.6*s;
      if(f.gl === 1){ g.beginPath(); g.arc(x - 4*s, y - 1*s, 3*s, 0, 7); g.moveTo(x + 7*s, y - 1*s); g.arc(x + 4*s, y - 1*s, 3*s, 0, 7); g.stroke() }
      if(f.gl === 2){ g.strokeRect(x - 7*s, y - 4*s, 6*s, 5*s); g.strokeRect(x + 1*s, y - 4*s, 6*s, 5*s) }
      if(f.gl === 0){ g.fillStyle = PC.ink; g.fillRect(x - 4.5*s, y - 2*s, 2*s, 2*s); g.fillRect(x + 2.5*s, y - 2*s, 2*s, 2*s) }
      if(f.mu){ g.fillStyle = "#5A3A22"; g.fillRect(x - 5*s, y + 3*s, 10*s, 2.5*s) }
    };
    let now = 0;
    build(0);
    return {
      down(p){
        if(done) return;
        let best = null, bd = 30;
        figs.forEach(f => { const d = Math.hypot(f.x - p.x, f.y + 6 - p.y); if(d < bd){ bd = d; best = f } });
        if(!best) return;
        if(best.t){ round++; api.buzz(30); if(round >= 3){ done = true; api.end() } else build(now) }
        else { penalty += 2; flash = 0.4; api.buzz(120) }
      },
      update(dt, t){
        now = t; flash = Math.max(0, flash - dt);
        if(done) return;
        total = t + penalty;
        if(t - rStart > 15){ round++; if(round >= 3){ done = true; api.end() } else build(t) }   // en omgang varer højst 15 sek
        figs.forEach(f => { f.x += f.vx*dt; f.y += f.vy*dt; if(f.x < 18 || f.x > 342) f.vx *= -1; if(f.y < 150 || f.y > 610) f.vy *= -1 });
      },
      draw(g){
        rrect(g, 110, 8, 140, 110, 16); g.fillStyle = PC.foam; g.fill();
        txt(g, "Find mig!", 180, 24, 13, PC.ink);
        drawFig(g, {...target, col:"#9A8A80"}, 180, 70, 2.2);
        g.fillStyle = PC.line; g.fillRect(0, 128, LW, 2);
        figs.forEach(f => drawFig(g, f, f.x, f.y, 1));
        if(flash > 0){ g.fillStyle = "rgba(255,77,61,.25)"; g.fillRect(0,0,LW,LH); dtxt(g, "+2 sek", 180, 320, 40, PC.red) }
        txt(g, "Omgang " + Math.min(round + 1, 3) + "/3", 50, 24, 13, PC.muted);
      },
      score: () => Math.round(total * 10) / 10,
      hud: () => dk(total, 1) + " s"
    };
  }};

/* 8. Skænkeren: skænk til stregen */
LG.pour = {name:"Skænkeren", desc:"Skænk fadøl præcis til stregen", tag:"timing", secs:30, better:"low",
  help:"Hold fingeren nede for at skænke. Træk op for at hælde stejlt (hurtigt, meget skum) og ned for fladt (roligt). Slip, så øl og skum ender på stregen. Fem glas.",
  fmt: v => v + " point fra stregen",
  create(api){
    const targets = [0,1,2,3,4].map(() => 0.55 + api.common() * 0.33);
    let k = 0, beer = 0, foam = 0, pouring = false, steep = 0.5, y0 = 0, settle = 0, devs = [], done = false;
    const finishGlass = () => {
      const top = beer + foam * 0.8, tg = targets[k];
      const dev = top > 1 ? (1 - tg) + (top - 1) * 2 : Math.abs(top - tg);
      devs.push(Math.round(dev * 100)); settle = 0.9;
    };
    return {
      down(p){ if(done || settle > 0 || p.y < 380) return; pouring = true; y0 = p.y; steep = 0.5 },
      move(p){ if(pouring) steep = clamp(0.5 + (y0 - p.y) / 200, 0, 1) },
      up(){ if(pouring && beer + foam > 0.02){ pouring = false; finishGlass() } else pouring = false },
      update(dt){
        if(done) return;
        if(settle > 0){ settle -= dt; if(settle <= 0){ k++; beer = 0; foam = 0; if(k >= 5){ done = true; api.end() } } return }
        if(pouring){ beer += (0.10 + 0.30 * steep) * dt; foam += (0.015 + 0.2 * steep * steep) * dt; if(beer + foam > 1.25){ pouring = false; finishGlass() } }
      },
      draw(g){
        const gx = 110, gy = 120, gw = 140, gh = 260, top = beer + foam * (settle > 0 ? 0.8 : 1);
        g.save(); g.beginPath(); g.moveTo(gx, gy); g.lineTo(gx + gw, gy); g.lineTo(gx + gw - 18, gy + gh); g.lineTo(gx + 18, gy + gh); g.closePath(); g.clip();
        g.fillStyle = "rgba(255,255,255,.06)"; g.fillRect(gx, gy, gw, gh);
        const bh = Math.min(1, beer) * gh, fh = Math.min(1, top) * gh - bh;
        g.fillStyle = PC.amber; g.fillRect(gx, gy + gh - bh, gw, bh);
        g.fillStyle = PC.foam; g.fillRect(gx, gy + gh - bh - fh, gw, Math.max(0, fh));
        g.restore();
        g.strokeStyle = PC.foam; g.lineWidth = 3; g.beginPath(); g.moveTo(gx, gy); g.lineTo(gx + 18, gy + gh); g.lineTo(gx + gw - 18, gy + gh); g.lineTo(gx + gw, gy); g.stroke();
        if(k < 5){ const ty = gy + gh - targets[k] * gh; g.setLineDash([8,6]); g.strokeStyle = PC.red; g.lineWidth = 3; g.beginPath(); g.moveTo(gx - 20, ty); g.lineTo(gx + gw + 20, ty); g.stroke(); g.setLineDash([]); txt(g, "stregen", gx + gw + 30, ty, 13, PC.red, "left") }
        if(top > 1){ g.fillStyle = PC.foam; g.beginPath(); g.ellipse(180, gy, 80, 10, 0, 0, 7); g.fill() }
        txt(g, "Glas " + Math.min(k + 1, 5) + " af 5 · " + devs.join(" · "), 180, 60, 16, PC.muted, "center", 600);
        rrect(g, 30, 420, 300, 190, 22); g.fillStyle = pouring ? PC.amber : PC.bg2; g.fill(); g.strokeStyle = PC.amber; g.lineWidth = 3; g.stroke();
        txt(g, pouring ? (steep > .66 ? "STEJLT · skummer" : steep < .33 ? "FLADT · roligt" : "skænker…") : "HOLD FOR AT SKÆNKE", 180, 500, 20, pouring ? PC.ink : PC.foam);
        txt(g, "↑ stejlt   ·   ↓ fladt", 180, 545, 15, pouring ? PC.ink : PC.muted, "center", 600);
        if(settle > 0 && devs.length) dtxt(g, devs[devs.length-1] <= 3 ? "Perfekt!" : devs[devs.length-1] + " fra", 180, 95, 30, devs[devs.length-1] <= 3 ? PC.green : PC.amber);
      },
      score: () => devs.reduce((a,b) => a + b, 0) + (5 - devs.length) * 100,
      hud: () => devs.reduce((a,b) => a + b, 0) + " fra"
    };
  }};

/* 9. Fingerknuden: hold fingrene på de glidende cirkler */
LG.fingers = {name:"Fingerknuden", desc:"Hold fingrene på cirklerne", tag:"hold", secs:30, better:"high",
  help:"Læg telefonen foran dig, væk fra glassene. Hold en finger på hver cirkel, der dukker op. Der kommer op til tre, og de glider rundt. Er en cirkel uden finger i over ½ sek, er du ude.",
  fmt: v => v >= 30 ? "Hele vejen!" : dk(v,1) + " s",
  create(api){
    const C = [0,1,2].map(i => ({born:[0,6,12][i], x:[110,250,180][i], y:[300,300,470][i], ang:api.common()*6.28, sp:0.5 + api.common()*0.4, miss:0}));
    let out = null, tt = 0;
    return {
      update(dt, t){
        tt = t; if(out !== null) return;
        const ptrs = Object.values(lg.ptrs);
        C.forEach((c, i) => {
          if(t < c.born) return;
          const sp = (18 + t * 1.6) * c.sp;
          c.ang += (api.common() - .5) * 0.6 * dt * 10;
          c.x = clamp(c.x + Math.cos(c.ang) * sp * dt, 60, 300); c.y = clamp(c.y + Math.sin(c.ang) * sp * dt, 120, 580);
          if(c.x <= 60 || c.x >= 300 || c.y <= 120 || c.y >= 580) c.ang += Math.PI / 2;
          const armed = t > c.born + 2.2;
          const held = ptrs.some(p => Math.hypot(p.x - c.x, p.y - c.y) < 52);
          c.miss = held || !armed ? 0 : c.miss + dt;
          if(c.miss > 0.5){ out = t; api.buzz(250); api.end() }
        });
      },
      draw(g, t){
        C.forEach((c, i) => {
          if(t < c.born - 1) return;
          const appearing = t < c.born;

  let body;
  if(mg.phase === "count") body = `<div class="eyebrow"><span class="label">Gør dig klar</span><span class="timer" style="font-size:28px">${Math.max(1, Math.ceil((mg.start - performance.now())/1000))}</span></div>` + traceSvg(D[1], [], false);
  else if(mg.phase === "play") body = `<div class="eyebrow"><span class="timer" id="tracetime" style="font-size:28px">${TRACE_MS/1000} s</span><button class="btn small" data-a="tracedone" style="width:auto">Færdig</button></div>` + traceSvg(D[1], trace.n === r.n ? trace.strokes : [], true);
  else {
    const mine = r.answers[myId], strokes = trace.n === r.n && trace.strokes.length ? trace.strokes : decodeStrokes(mine && mine.p);
    body = traceSvg(D[1], strokes, false) + `<div class="drinkhead" style="text-align:center">${mg.score} % præcis</div><p class="waiting">Venter på de andre…</p>`;
  }
  return `<div class="drinkhead" style="font-size:26px;margin:0">Tegn efter streg: ${esc(D[0])}</div>${body}
    <p class="hint">Tegn oven i den stiplede streg, så præcist du kan, inden tiden løber ud. Mest præcis vinder et 🏆. Nr. 2 drikker 1 tår, nr. 3 drikker 2 tår, og så videre.</p>` +
    progress(onlineIds(), id => r.answers[id] !== undefined);
}
function finishMg(score){
  if(mg.phase === "done") return;
  mg.phase = "done"; mg.score = score; clearMg(); mg.timers = [];
  act(score); render();
}
function mgTap(){
  const r = state && state.round;
  if(!r || state.phase !== "round" || mg.n !== r.n) return;
  if(r.type === "reflex"){
    if(mg.phase === "wait") finishMg(-1);
    else if(mg.phase === "go") finishMg(Math.round(performance.now() - mg.t0));
  }
  if(r.type === "tap" && mg.phase === "play"){ mg.taps++; const el = $("#tapn"); if(el) el.textContent = mg.taps }
  if(r.type === "stop" && mg.phase === "play") finishMg(Math.round(Math.abs(performance.now() - mg.t0 - r.target)));
}
function mgView(r){
  if(r.type === "trace") return traceView(r);
  ensureMg(r);
  const rules = {
    reflex:"Tryk, så snart feltet bliver grønt. Trykker du for tidligt, drikker du.",
    tap:"Tryk så mange gange som muligt på 5 sekunder.",
    stop:`Stop uret på præcis ${dk(r.target/1000,2)} sekunder. Tallene forsvinder efter 1,5 sekund. Mere end 1 sekund ved siden af koster ${tar(S())}.`
  }[r.type];
  let pad;
  if(mg.phase === "count") pad = `<div class="pad"><div class="big">${Math.max(1, Math.ceil((mg.start - performance.now())/1000))}</div><p>${esc(rules)}</p></div>`;
  else if(mg.phase === "done") pad = `<div class="pad"><div class="big" style="font-size:44px">${fmtScore(r, mg.score)}</div><p>Venter på de andre…</p></div>`;
  else if(r.type === "reflex") pad = mg.phase === "wait" ? `<div class="pad wait" data-mg="1"><div class="big">Vent…</div><p>Ikke endnu!</p></div>` : `<div class="pad go" data-mg="1"><div class="big">TRYK!</div></div>`;
  else if(r.type === "tap") pad = `<div class="pad play" data-mg="1"><div class="big" id="tapn">${mg.taps}</div><p>TRYK! TRYK! TRYK! · <span id="tapleft">5,0</span> s</p></div>`;
  else if(r.type === "stop") pad = `<div class="pad play" data-mg="1"><p>Stop på ${dk(r.target/1000,2)}</p><div class="big" id="sw">0,00</div><p>Tryk når du tror, tiden er inde</p></div>`;
  return `<div class="drinkhead" style="font-size:26px;margin:0">${TYPES[r.type].name}</div>${pad}
    <p class="hint">Bedst vinder et 🏆. Dårligst drikker ${tar(S())}.</p>` + progress(onlineIds(), id => r.answers[id] !== undefined);
}
(function loop(){
  if(mg.phase === "play" && mg.t0){
    const e = performance.now() - mg.t0;
    if(mg.type === "tap"){ const el = $("#tapn"); const l = $("#tapleft"); if(l) l.textContent = dk(Math.max(0,(5000-e)/1000),1) }
    if(mg.type === "stop"){ const el = $("#sw"); if(el) el.textContent = e < 1500 ? dk(e/1000,2) : "?,??" }
    if(mg.type === "trace"){ const el = $("#tracetime"); if(el) el.textContent = Math.max(0, Math.ceil((TRACE_MS - e)/1000)) + " s" }
  }
  const rr = state && state.round;
  if(rr && rr.type === "roulette" && rr.spin && state.phase === "round"){ const g = $("#wheel"); if(g) g.setAttribute("transform", `rotate(${wheelAngle(rr.spin).toFixed(2)})`) }
  if(rr && rr.type === "hex" && rr.fall){
    const now = Date.now();
    document.querySelectorAll(".hexboard [data-fall]").forEach(el => {
      const t = +el.dataset.fall;
      if(now >= t) el.classList.add("fallen"); else if(now >= t - 350) el.classList.add("wobble");
    });
  }
  requestAnimationFrame(loop);
})();
/* Nedtællinger på skærmen */
setInterval(() => {
  let rerender = false;
  document.querySelectorAll("[data-until]").forEach(el => {
    const left = +el.dataset.until - Date.now();
    el.textContent = fmtLeft(Math.max(0, left));
    if(left <= 0 && el.hasAttribute("data-rerender") && !el.dataset.fired){ el.dataset.fired = "1"; rerender = true }
  });
  document.querySelectorAll("[data-bar]").forEach(el => { el.style.width = Math.max(0, Math.min(100, (+el.dataset.bar - Date.now()) / +el.dataset.dur * 100)) + "%" });
  if(rerender) render();
}, 250);

/* Hold skærmen tændt */
let wakeLock = null;
async function keepAwake(){
  try{ if("wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null) } }catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "visible" || !role) return;
  keepAwake();
  if(peer && !peer.destroyed && peer.disconnected) peer.reconnect();
  if(role === "guest" && !(hostConn && hostConn.open)) scheduleReconnect();
});

function render(){
  /* behold det man er ved at skrive, når skærmen tegnes igen */
  const keep = {}; let focus = null;
  app.querySelectorAll("input[id]").forEach(i => keep[i.id] = i.value);
  const ae = document.activeElement;
  if(ae && ae.tagName === "INPUT" && ae.id) focus = {id:ae.id, s:ae.selectionStart, e:ae.selectionEnd};

  if(ui.screen === "home") renderHome();
  else if(ui.screen === "connecting" || !state) renderConnecting();
  else renderGame();

  if(ui.screen !== "home") Object.entries(keep).forEach(([id,v]) => { const el = document.getElementById(id); if(el) el.value = v });
  if(focus){ const el = document.getElementById(focus.id); if(el){ el.focus(); try{ el.setSelectionRange(focus.s, focus.e) }catch(e){} } }
  if(state && state.flash && state.flash.id !== lastFlash){
    if(lastFlash !== null || role === "host") toast(state.flash.text, 4500);
    lastFlash = state.flash.id;
  }
}

function banners(){
  let h = "";

  if(ev && L(ev.end) > Date.now() && state.phase !== "lobby" && state.phase !== "end"){
    const until = L(ev.end);
    h += `<div class="banner event"><div class="top"><span class="lbl">Hændelse</span><span class="timer" data-until="${until}" data-rerender>${fmtLeft(until - Date.now())}</span></div>
      <div class="txt">${esc(ev.text)}</div><div class="tbar"><i data-bar="${until}" data-dur="${ev.dur}" style="width:${Math.max(0,(until-Date.now())/ev.dur*100)}%"></i></div>
      <button class="btn small ink" data-a="call">Nogen brød reglen</button></div>`;
  }
  const t = state.trial;
  if(t){
    const until = L(t.end), voters = trialVoters(), n = voters.filter(id => t.votes[id] !== undefined).length;
    const canVote = voters.includes(myId) && t.votes[myId] === undefined;
    h += `<div class="banner trial"><div class="top"><span class="lbl">🚨 Snyd?</span><span class="timer" data-until="${until}">${fmtLeft(Math.max(0, until - Date.now()))}</span></div>
      <div class="txt">${who(t.accuser)} anklager ${who(t.accused)} for at snyde.</div>
      ${canVote ? `<div class="row"><button class="btn small ink" ${sidej({k:"verdict", id:t.id, yes:true})}>Ja, snyd!</button><button class="btn small" ${sidej({k:"verdict", id:t.id, yes:false})}>Nej</button></div>`
        : `<div class="hint" style="color:inherit">${n} af ${voters.length} har stemt. Flertal for snyd: ${nameOf(t.accused)} drikker ${tar(S()*2)}. Ellers drikker ${nameOf(t.accuser)} ${tar(S())}.</div>`}</div>`;
  }
  state.missions.filter(m => m.agent === myId).forEach(m => {
    const until = L(m.end);
    h += `<div class="banner mission"><div class="top"><span class="lbl" style="color:var(--amber)">Din hemmelige mission 🤫</span><span class="timer" data-until="${until}">${fmtLeft(Math.max(0, until - Date.now()))}</span></div>

  });
  return h;
}

function renderGame(){
  /* sprang værten runden over midt i et minispil, lukkes fuldskærmen */
  if(lg.phase === "play" && (!state.round || state.round.n !== lg.n || state.phase !== "round")) lgClose();
  const mine = player(myId), b = state.buddy;
  const mate = b && (b.a === myId ? b.b : b.b === myId ? b.a : null);
  let body = "";
  if(state.phase === "lobby") body = lobbyView();
  else if(state.phase === "round") body = roundView();

function revealView(){
  const r = state.round, T = TYPES[r.type], res = r.reveal;
  const silent = (r.type === "mission" || r.type === "event") && !res.drink.length;
  const last = state.n >= state.maxRounds;
  return `<div class="eyebrow"><span class="t">Runde ${r.n} af ${state.maxRounds} · Resultat</span></div>
    ${T.result(r, res)}
    ${silent ? "" : drinkList(res)}
    ${res.give && res.give.length && T.cap ? `<div class="label">Må dele tår ud</div><div class="result">${res.give.map(g => `<div class="res win"><span class="e">${emojiOf(g.id)}</span><span class="n">${nameOf(g.id)}${g.id===myId?" (dig)":""}</span><span class="v">deler ${tar(g.s)} ud</span></div>`).join("")}</div>` : ""}
