<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#23101B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pokaljagt">
<title>Pokaljagt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: én kolonne, telefon-først. Topbar med kode + egne tår/sejre, bannere for hændelser/missioner, et stort kort pr. runde. */
:root{
  --bg:#23101B;        /* aubergine bodega-mørke */
  --bg2:#33172A;
  --line:#4A2440;
  --foam:#FFF3E2;      /* ølskum */
  --ink:#23101B;
  --amber:#FFB020;     /* pilsner */
  --pink:#FF5C8A;
  --teal:#3DD6C0;
  --sky:#6EC1FF;
  --violet:#A98BFF;
  --red:#FF4D3D;
  --green:#2FD36B;
  --muted:#C9A9B8;
  --display:"Bagel Fat One","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:22px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--foam);font-family:var(--body);font-size:16px}
body{min-height:100dvh;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}

.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:16px;min-height:100dvh}
.wrap.game{padding-top:calc(env(safe-area-inset-top,0px) + 72px)}

/* Topbar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.topbar-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-weight:800;font-size:14px;letter-spacing:.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip .k{color:var(--muted);font-weight:600;letter-spacing:.04em;font-size:11px;text-transform:uppercase}
.spacer{flex:1}
.iconbtn{width:44px;height:44px;flex:none;border-radius:14px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.offline-banner{background:var(--red);color:#fff;text-align:center;font-weight:800;padding:8px 12px;border-radius:14px;font-size:14px}

/* Bannere: hændelse og hemmelig mission */
.banner{border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.banner .top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800}
.banner .top .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.banner .txt{font-weight:800;font-size:17px;line-height:1.3}
.banner.event{background:var(--amber);color:var(--ink)}
.banner.mission{background:var(--bg2);border:2px dashed var(--amber)}
.banner.trial{background:var(--red);color:#fff}
.banner.trial .btn:not(.ink){background:#fff;color:var(--ink);border-color:#fff}
.tbar{height:6px;border-radius:3px;background:rgba(0,0,0,.18);overflow:hidden}
.banner.mission .tbar{background:var(--line)}
.tbar i{display:block;height:100%;background:currentColor;transition:width .2s linear}
.timer{font-family:var(--display);font-variant-numeric:tabular-nums}

/* Hero */
.hero{padding-top:24px;text-align:center;position:relative}
.logo{font-family:var(--display);font-size:clamp(54px,15vw,96px);line-height:.9;margin:0;color:var(--amber);text-shadow:0 6px 0 #8A4A00,0 10px 30px rgba(255,176,32,.25);transform:rotate(-4deg);font-weight:400}
.logo small{display:block;font-family:var(--body);font-weight:800;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);text-shadow:none;margin-top:18px;transform:rotate(4deg)}
.bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bubbles i{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(255,243,226,.35);animation:rise 6s linear infinite}
@keyframes rise{to{transform:translateY(-240px);opacity:0}}
@media (prefers-reduced-motion:reduce){.bubbles{display:none}*{animation:none!important;transition:none!important}}

/* Paneler & felter */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field{width:100%;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--bg);font-size:18px;font-weight:600}
.field:focus{border-color:var(--amber);outline:none}
.field.code{text-transform:uppercase;letter-spacing:.4em;text-align:center;font-family:var(--display);font-size:28px;padding:12px}
.emojis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.emojis button{aspect-ratio:1;min-width:0;padding:0;border-radius:12px;font-size:24px;background:var(--bg);border:2px solid transparent}
.emojis button[aria-pressed="true"]{border-color:var(--amber);background:#4a2a1a}
.photorow{display:flex;align-items:center;gap:10px}
.photobtns{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.photobtns .btn{cursor:pointer}
.avatar-lg{width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:38px;background:var(--bg);border:2px solid var(--amber);overflow:hidden}
.avatar-lg img{width:100%;height:100%;object-fit:cover}
img.av{width:1.15em;height:1.15em;border-radius:50%;object-fit:cover;vertical-align:-.22em;display:inline-block;background:var(--line)}
.err{color:var(--pink);font-weight:600;margin:0}
.hint{color:var(--muted);font-size:14px;line-height:1.45;margin:0}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:14px 18px;border-radius:18px;font-weight:800;font-size:18px;background:var(--bg2);border:2px solid var(--line);width:100%;text-align:center;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--amber);color:var(--ink);border-color:var(--amber);box-shadow:0 5px 0 #8A4A00}
.btn.primary:active{box-shadow:0 1px 0 #8A4A00;transform:translateY(4px)}
.btn.go{background:var(--green);color:var(--ink);border-color:var(--green)}
.btn.ghost{background:transparent}
.btn.small{min-height:44px;font-size:15px;padding:10px 14px;border-radius:14px}
.btn.ink{background:var(--ink);color:var(--foam);border-color:var(--ink)}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

/* Lobby */
.bigcode{font-family:var(--display);font-size:clamp(56px,18vw,84px);letter-spacing:.12em;text-align:center;line-height:1;color:var(--foam)}
.qr{display:grid;place-items:center}
.qr img{width:180px;height:180px;border-radius:14px;background:#fff;padding:8px;image-rendering:pixelated}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pl{position:relative;background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:12px 6px 10px;text-align:center;min-width:0}
.pl .em{font-size:34px;line-height:1.1}
.pl .nm{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .sub{font-size:12px;color:var(--muted)}
.pl.off{opacity:.45}
.pl.me{border-color:var(--amber)}
.pl .x{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:10px;color:var(--muted);font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding:5px;border-radius:16px}
.seg button{padding:10px 4px;border-radius:12px;font-weight:800;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--ink)}
.seg.hot button[aria-pressed="true"]{background:var(--pink);color:var(--ink)}
.seg button small{display:block;font-weight:600;font-size:11px;opacity:.85}
.consent{border-left:4px solid var(--pink);padding:2px 0 2px 12px}
.toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tog{padding:10px 12px;border-radius:14px;background:var(--bg);border:2px solid var(--line);text-align:left;font-weight:800;font-size:14px;line-height:1.25;min-width:0}
.tog small{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:2px}
.tog[aria-pressed="true"]{border-color:var(--amber)}
.tog[aria-pressed="false"]{opacity:.4;text-decoration:line-through}
.tog:disabled{cursor:default}

/* Spilkort */
.eyebrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.eyebrow .t{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.card{--c:var(--amber);background:var(--c);color:var(--ink);border-radius:28px;padding:24px 22px 26px;box-shadow:0 8px 0 color-mix(in srgb,var(--c) 45%,#000);position:relative;overflow:hidden;animation:deal .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes deal{from{transform:translateY(30px) rotate(-3deg);opacity:0}}
.card .kind{font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.75;display:flex;justify-content:space-between;gap:8px}
.card .prompt{font-family:var(--display);font-size:clamp(25px,7.2vw,34px);line-height:1.12;margin:10px 0 0;text-wrap:balance;font-weight:400}
.card .prompt.sm{font-size:clamp(21px,6vw,27px)}
.card .who{font-weight:800;font-size:18px;margin-top:6px}
.card p{margin:10px 0 0;font-weight:600;line-height:1.4}
.card b{font-weight:800}
.card.amber{--c:var(--amber)}
.card.pink{--c:var(--pink)}
.card.violet{--c:var(--violet)}
.card.teal{--c:var(--teal)}
.card.sky{--c:var(--sky)}
.card.red{--c:var(--red)}
.card.chaos{--c:var(--foam);background:repeating-linear-gradient(-45deg,var(--foam) 0 22px,#FFE7C2 22px 44px)}
.card.secret{--c:var(--bg2);color:var(--foam);border:2px dashed var(--amber);box-shadow:none}
.card.secret .kind{color:var(--amber);opacity:1}
.chili{letter-spacing:-.1em}

.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:14px;text-align:center}
.vs .side{min-width:0}
.vs .e{font-size:44px;line-height:1}
.vs .nm{font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs .x{font-family:var(--display);font-size:30px;transform:rotate(-8deg)}
.vs .side.win .nm::after{content:" 🏆"}
.vs .side.lose{opacity:.55}

/* Minispil-flade */
.pad{min-height:300px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:24px;user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer;background:var(--bg2);border:2px solid var(--line);color:var(--foam);position:relative}
.pad .big{font-family:var(--display);font-size:clamp(48px,16vw,76px);line-height:1;font-variant-numeric:tabular-nums}
.pad p{margin:0;font-weight:600;opacity:.85}
.pad.wait{background:var(--red);border-color:var(--red);color:#fff}
.pad.go{background:var(--green);border-color:var(--green);color:var(--ink)}
.pad.play{background:var(--teal);border-color:var(--teal);color:var(--ink)}
.pad.play:active{transform:scale(.985)}

.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{min-height:64px;padding:14px;border-radius:18px;background:var(--bg2);border:2px solid var(--line);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;line-height:1.2;min-width:0}
.choice .em{font-size:26px}
.choice[aria-pressed="true"]{background:var(--foam);color:var(--ink);border-color:var(--foam)}
.choice.tall{min-height:110px;flex-direction:column}
.choice.hotpick{min-height:130px;font-family:var(--display);font-weight:400;font-size:26px}
.choice:disabled{opacity:.4}
.voters{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}

.progress{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dot{display:inline-flex;align-items:center;gap:4px;padding:4px 10px 4px 6px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:600}
.dot.ok{background:#1f3a2c;border-color:var(--green)}
.dot .e{font-size:16px}

/* Ord, bogstaver, tastatur, kæde, MFK */
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{font-family:var(--display);font-size:26px;background:var(--foam);color:var(--ink);padding:6px 14px;border-radius:14px}
.peek{min-height:120px;border-radius:22px;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;padding:16px;background:var(--bg2)}
.peek .w{font-family:var(--display);font-size:clamp(36px,11vw,52px);line-height:1}
.board-letters{display:flex;flex-wrap:wrap;gap:12px 16px;justify-content:center;padding:6px 0}
.lw{display:flex;gap:3px}
.lc{width:24px;height:34px;border-bottom:3px solid currentColor;display:grid;place-items:center;font-family:var(--display);font-size:21px;line-height:1}
.abc{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.abc button{height:46px;border-radius:10px;background:var(--foam);color:var(--ink);font-weight:800;font-size:18px;min-width:0;padding:0}
.abc button:disabled{opacity:.2}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{height:58px;border-radius:14px;background:var(--bg2);border:2px solid var(--line);font-family:var(--display);font-size:26px}
.keypad button.ok{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.kpdisp{font-family:var(--display);font-size:44px;text-align:center;min-height:64px;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:6px;font-variant-numeric:tabular-nums}
.eq{font-family:var(--display);font-size:clamp(34px,11vw,48px);text-align:center;line-height:1.1}
.chain{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.step .e{font-size:24px}
.step .n{flex:1;min-width:0;font-weight:800}
.step .n small{display:block;font-weight:600;color:var(--muted)}
.step.done{opacity:.5}
.step.now{border-color:var(--green);background:#1f3a2c}
.step.me .n::after{content:" · dig";color:var(--amber)}
.mfk{display:flex;flex-direction:column;gap:8px}
.mfkrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.mfkrow .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mfkbtns{display:flex;gap:6px}
.mfkbtns button{min-width:56px;height:44px;border-radius:12px;background:var(--bg);border:2px solid var(--line);font-weight:800;font-size:13px;padding:0 8px}
.mfkbtns button[aria-pressed="true"]{background:var(--pink);color:var(--ink);border-color:var(--pink)}
.counter{font-family:var(--display);font-size:72px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
/* Roulette: rigtige rouletfarver, guldkant */
.wheel{display:block;width:100%;max-width:320px;margin:0 auto}
.wheel .rim{fill:#4A2A12;stroke:#E8C77A;stroke-width:3}
.wheel .pk{stroke:#E8C77A;stroke-width:.6}
.wheel .pk.red{fill:#D7263D}
.wheel .pk.black{fill:#1B1B1F}
.wheel .pk.green{fill:#1E9E5A}
.wheel text{fill:#fff;font-size:8.5px;font-weight:800;text-anchor:middle;dominant-baseline:central;font-family:var(--body)}
.wheel .hub{fill:#3A2414;stroke:#E8C77A;stroke-width:1.5}
.wheel .hub2{fill:#E8C77A}
.wheel .ptr{fill:var(--foam);stroke:var(--ink);stroke-width:1.5}
.pip{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin:0 3px;vertical-align:-.05em}
.pip.red{background:#D7263D}
.pip.black{background:#1B1B1F;box-shadow:0 0 0 1px #888}
.pip.green{background:#1E9E5A}
.pip.big{width:auto;height:auto;min-width:72px;padding:6px 16px;border-radius:999px;font-family:var(--display);font-size:40px;color:#fff;text-align:center;margin:0}
.rouresult{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--display);font-size:30px}
.choice.colorbet{color:#fff;min-height:64px}
.choice.colorbet.red,.choice.colorbet.red[aria-pressed="true"]{background:#D7263D;border-color:#D7263D}
.choice.colorbet.black,.choice.colorbet.black[aria-pressed="true"]{background:#1B1B1F;border-color:#555}
.choice.colorbet.green,.choice.colorbet.green[aria-pressed="true"]{background:#1E9E5A;border-color:#1E9E5A}
.choice.colorbet[aria-pressed="true"]{color:#fff;outline:3px solid var(--foam);outline-offset:2px}
/* Hexagon: fliser over lava */
.hexboard{display:block;width:100%;max-width:400px;margin:0 auto;background:radial-gradient(circle at 50% 60%, rgba(255,77,61,.35), transparent 70%);border-radius:24px}
.hex{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .55s cubic-bezier(.5,0,.9,.5),opacity .55s ease-in}
.hex polygon{fill:var(--amber);stroke:#8A4A00;stroke-width:1.2}
.hex.taken{cursor:default}
.hex.taken polygon{fill:var(--violet)}
.hex.mine polygon{fill:var(--pink);stroke:#fff;stroke-width:2}
.hex text{font-size:13px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hex image{pointer-events:none}
.hex.wobble{animation:wob .12s linear infinite}
@keyframes wob{0%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}100%{transform:rotate(-5deg)}}
.hex.fallen{transform:translateY(30px) scale(.2);opacity:0;animation:none}
.hex.survivor polygon{stroke:#fff;stroke-width:2.5}
/* Tegn efter streg: lyst papir, stiplet omrids, pink streg */
.trsvg{display:block;width:100%;aspect-ratio:1;background:#FFF8EE;border-radius:20px}
.trsvg .ol{fill:none;stroke:#B9A79A;stroke-width:3;stroke-dasharray:7 7;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.trsvg .st{fill:none;stroke:#E8336B;stroke-width:5;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.tracepad{max-width:440px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.thumb{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.thumb.first{border-color:var(--amber)}
.thumb .trsvg{border-radius:12px}
.thumb .trsvg .st{stroke-width:3}
.thumb .meta{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-variant-numeric:tabular-nums}
.thumb .meta b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Resultat */
.result{display:flex;flex-direction:column;gap:8px}
.res{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--bg2);border:1px solid var(--line)}
.res .e{font-size:28px}
.res .n{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .v{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted);white-space:nowrap}
.res.drink{background:var(--foam);color:var(--ink);border-color:var(--foam)}
.res.drink .v{color:var(--ink)}
.res.win{border-color:var(--amber)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--amber)}
.drinkhead{font-family:var(--display);font-size:30px;color:var(--amber);margin:4px 0 0;font-weight:400}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split .col{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:12px;min-width:0}
.split .col h4{margin:0 0 8px;font-size:14px;line-height:1.3}
.names{font-size:14px;color:var(--muted);line-height:1.5;word-break:break-word}

.waiting{color:var(--muted);text-align:center;font-weight:600;padding:8px;margin:0}
.hostbar{display:flex;gap:8px;flex-wrap:wrap}
.hostbar .btn{flex:1 1 140px}
.judge{border:1px dashed var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.stickybottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}

/* Menu-ark */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-top:2px solid var(--line);border-radius:26px 26px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:85dvh;overflow:auto;animation:up .2s ease-out}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(100%)}}
.board{display:flex;flex-direction:column;gap:6px}
.board .res .rank{font-family:var(--display);width:26px;text-align:center;color:var(--muted)}

.podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;align-items:end;text-align:center}
.podium .p{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 6px 6px;padding:12px 4px;min-width:0}
.podium .p .e{font-size:38px}
.podium .p .nm{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .p .s{font-family:var(--display);font-size:24px;color:var(--amber)}
.podium .p1{padding-block:26px;border-color:var(--amber)}
/* Beskeder vises under topbaren og kan ikke tage tryk, så de aldrig dækker en knap */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 72px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:var(--foam);color:var(--ink);font-weight:800;padding:12px 18px;border-radius:14px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.4);text-align:center;pointer-events:none;animation:drop .25s ease-out}
@keyframes drop{from{transform:translate(-50%,-12px);opacity:0}}
.foot{font-size:12px;color:var(--muted);text-align:center;opacity:.8;margin:0}
.btn .btnsub{display:block;font-size:12px;font-weight:600;opacity:.75}
.btn:has(.btnsub){flex-direction:column;gap:0}
/* Lobby: spil i grupper */
.catgroup{display:flex;flex-direction:column;gap:8px}
.catgroup+.catgroup{border-top:1px solid var(--line);padding-top:12px}
.cathead{font-weight:800;font-size:15px}
.cathead small{color:var(--muted);font-weight:600}
.catbtn{width:auto;min-height:36px;padding:6px 12px;font-size:13px}
/* Bonusstjerner */
.bonus{display:grid;gap:10px}
.bstar{background:var(--bg);border:2px solid var(--amber);border-radius:18px;padding:12px 14px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.bstar .bt{font-family:var(--display);font-size:22px;color:var(--amber)}
.bstar .bw{font-weight:800;font-size:18px;margin-top:2px}
.bstar small{color:var(--muted)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
/* Party-scenen: fuldskærm over appen, mens et minispil kører. render() rører den ikke */
#stage{position:fixed;inset:0;z-index:40;background:#160A11;display:flex;flex-direction:column;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

#stage canvas{flex:1;width:100%;min-height:0;display:block;touch-action:none}
.lgcount{font-family:var(--display);font-size:64px;text-align:center;line-height:1}

/* Beskær til kvadrat og skaler ned til 96×96, så billedet er let at sende rundt */
async function processPhoto(file){
  if(!file || !/^image\//.test(file.type)) return toast("Vælg et billede.");
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url });
    const size = 96, c = document.createElement("canvas"); c.width = c.height = size;
    const s = Math.min(img.naturalWidth, img.naturalHeight);
    c.getContext("2d").drawImage(img, (img.naturalWidth - s)/2, (img.naturalHeight - s)/2, s, s, 0, 0, size, size);
    const data = okPhoto(c.toDataURL("image/jpeg", 0.75));
    if(!data) throw new Error("for stort");
    me.photo = data; store.set("skaal-photo", data);
  }catch(e){ toast("Kunne ikke læse billedet. Prøv et andet.") }
  finally{ URL.revokeObjectURL(url) }
  renderHome();
}

const inMode = t => MODES[modeOf()].cats.includes(TYPES[t].cat || "klassik");

function newState(code, mode){
  const enabled = {}; Object.keys(TYPES).forEach(t => enabled[t] = true);
  return {code, mode: MODES[mode] ? mode : "party", phase:"lobby", hostId:myId, intensity:2, spice:2, maxRounds:40, n:0, round:null, used:{}, seen:{}, count:{}, enabled,

function hostGame(resume, mode){
  dropWarm();
  teardown();
  role = "host"; clockOffset = 0;
  ui = {...ui, screen:"connecting", err:"", menu:false, status:""};
  render();
  const code = resume ? resume.code : makeCode();
  let tries = 0;
  const start = () => {
    peer = new Peer(PREFIX + code.toLowerCase(), {debug:0});
    peer.on("open", () => {
      if(!state || state.code !== code) state = resume || newState(code, mode);
      if(!MODES[state.mode]) state.mode = "klassik";   // gemte spil fra før versionerne var klassiske
      const mine = player(myId);
      if(mine){mine.name=me.name;mine.emoji=me.emoji;mine.photo=me.photo;mine.online=true}
      state.players.forEach(p => { if(p.id!==myId) p.online=false });
      ui.screen = "game"; ui.online = true;
      commit(); keepAwake();
    });
    peer.on("connection", conn => {
      conn.on("data", d => onGuestData(conn, d));
      conn.on("close", () => dropConn(conn));
      conn.on("error", () => dropConn(conn));
    });
    peer.on("disconnected", () => { ui.online=false; render(); setTimeout(() => { if(peer && !peer.destroyed) peer.reconnect() }, 1500) });
    peer.on("error", e => {
      if(e.type === "unavailable-id"){
        peer.destroy();
        if(resume && tries++ < 12){ setTimeout(start, 2500); return }   // den gamle forbindelse er ikke sluppet endnu
        if(!resume){ setTimeout(() => hostGame(), 100); return }
        ui = {...ui, screen:"home", err:"Koden er optaget. Start et nyt spil."}; role=null; render(); return;
      }
      if(e.type === "network" || e.type === "server-error" || e.type === "socket-error"){
        ui.online=false; render(); setTimeout(() => { if(peer && !peer.destroyed && peer.disconnected) peer.reconnect() }, 3000);
      }
    });
  };
  start();
}

function onGuestData(conn, d){
  if(!isObj(d) || !state) return;
  if(d.t === "hello"){
    const id = clean(d.id, 24), name = clean(d.name, 16) || "Gæst", emoji = clean(d.emoji, 8) || "🍺", photo = okPhoto(d.photo);
    if(!id || id === myId) return;
    const old = guests.get(id);
    if(old && old.conn !== conn) try{ old.conn.close() }catch(e){}
    guests.set(id, {conn, seen:Date.now()});
    conn._pid = id;
    const p = player(id);
    if(p){ p.name=name; p.emoji=emoji; p.photo=photo; p.online=true }
    else state.players.push({id,name,emoji,photo,sips:0,wins:0,online:true});
    commit(); sendRoster();
    return;
  }
  const id = conn._pid; if(!id) return;
  const g = guests.get(id); if(g) g.seen = Date.now();
  const p = player(id); if(!p) return;
  if(d.t === "ping"){ if(!p.online){ p.online=true; commit() } return }
  if(d.t === "act") hostAct(id, d.n, d.v);
  if(d.t === "side" && isObj(d.v)) hostSide(id, d.v);
  if(d.t === "leave") removePlayer(id);
}

function dropConn(conn){
  const id = conn._pid; if(!id) return;
  const g = guests.get(id);
  if(g && g.conn === conn){ guests.delete(id); const p = player(id); if(p){ p.online=false; commit(); checkAllIn() } }
}

function removePlayer(id){
  if(id === myId) return;
  const g = guests.get(id); if(g){ try{ g.conn.send({t:"kicked"}) }catch(e){} setTimeout(()=>{try{g.conn.close()}catch(e){}},300); guests.delete(id) }
  state.players = state.players.filter(p => p.id !== id);
  state.missions = state.missions.filter(m => m.agent !== id && m.target !== id);
  if(state.buddy && (state.buddy.a === id || state.buddy.b === id)) state.buddy = null;
  commit(); checkAllIn();
}

const lvl = c => Array.isArray(c) ? c[0] : c.l;
function pickCard(key, arr){
  const spice = state.spice;
  const ok = arr.map((_,i) => i).filter(i => lvl(arr[i]) <= spice);
  const used = state.used[key] = state.used[key] || [];
  let free = ok.filter(i => !used.includes(i));
  if(!free.length){ used.length = 0; free = ok }
  const top = free.filter(i => lvl(arr[i]) === spice);
  if(spice > 1 && top.length && Math.random() < 0.6) free = top;   // højere krydderi = flere af de stærke kort
  const i = pick(free);
  used.push(i); return arr[i];
}
/* Vælg et kort, der ikke har været vist de sidste `gap` runder */
function pickFresh(key, arr, gap){
  const seen = state.seen = state.seen || {};
  const ok = arr.map((_,i) => i).filter(i => lvl(arr[i]) <= state.spice);
  const last = i => seen[key + i] ?? -Infinity;
  let free = ok.filter(i => state.n - last(i) >= gap);
  if(!free.length) free = [ok.sort((a,b) => last(a) - last(b))[0]];   // nødløsning: den der er længst siden
  const top = free.filter(i => lvl(arr[i]) === state.spice);
  if(state.spice > 1 && top.length && Math.random() < 0.5) free = top;
  const i = pick(free);
  seen[key + i] = state.n;
  return arr[i];
}
/* Vælg dem, der har haft rollen færrest gange */
function pickLeast(key, pool, k){
  const c = state.count[key] = state.count[key] || {};
  const chosen = shuffle([...pool]).sort((a,b) => (c[a.id]||0) - (c[b.id]||0)).slice(0,k);
  chosen.forEach(p => c[p.id] = (c[p.id]||0) + 1);
  return chosen;
}
const others = (pool, id) => pool.filter(p => p.id !== id);

function pickType(pool){
  const last = state.round && state.round.type, lastTag = last && TYPES[last] && TYPES[last].tag;
  /* samme spil eller samme slags input (mærke) kommer aldrig to gange i træk */
  const opts = Object.entries(TYPES).filter(([t,T]) =>
    inMode(t) && state.enabled[t] !== false && t !== last && !(lastTag && T.tag === lastTag) && pool.length >= T.min && (!T.can || T.can(pool)));
  if(!opts.length){
    const any = modeTypes().filter(t => state.enabled[t] !== false && pool.length >= TYPES[t].min && t !== last);
    return any.length ? pick(any) : (modeOf() === "party" ? modeTypes()[0] : "chaos");
  }
  const total = opts.reduce((a,[,T]) => a + T.w, 0);
  let x = Math.random() * total;
  for(const [t,T] of opts){ if((x -= T.w) <= 0) return t }
  return opts[0][0];
}

function flash(text){ state.flash = {id: ++state.fid, text} }

/* Tår uden for en afsløring (fx en forkert gæt) — makkeren drikker med */
function giveNow(id, s, why){
  const list = withMate([{id, s}]);
  list.forEach(d => { const p = player(d.id); if(p) p.sips += d.s });
  const mate = list.find(d => d.mate);
  flash(`${why} ${player(id)?.name || "?"} drikker ${tar(s)}${mate ? ` (og makker ${player(mate.id)?.name} med)` : ""}.`);
}
function withMate(list){
  const b = state.buddy; if(!b) return list;
  const out = [...list];
  for(const d of list){
    const m = d.id === b.a ? b.b : d.id === b.b ? b.a : null;
    if(m && player(m) && !out.some(x => x.id === m)) out.push({id:m, s:d.s, mate:true});
  }
  return out;
}

/* Missioner og snyd-afstemninger udløber på tid; værten tjekker hvert sekund */
function expireTimers(){
  let changed = false;
  const keep = [];
  for(const m of state.missions){
    if(Date.now() >= m.end){
      const a = player(m.agent); changed = true;
      if(a) giveNow(m.agent, S()*2, `Tiden er gået for ${gen(a.name)} hemmelige mission (kald ${player(m.target)?.name} for "${m.name}").`);
    } else keep.push(m);
  }
  state.missions = keep;
  if(state.trial && Date.now() >= state.trial.end){ resolveTrial(); changed = true }
  /* rundens frist ligger i state, så den holder, selv hvis værten genindlæser siden */
  const r = state.round;
  if(r && state.phase === "round" && r.until && Date.now() >= r.until){ doReveal(); return false }
  return changed;
}
setInterval(() => { if(role === "host" && state && expireTimers()) commit() }, 1000);

/* Slut: bonusstjerner som i et party-brætspil. Hver stjerne giver +1 🏆, før podiet vises */
function endGame(){
  const ps = state.players.filter(p => p.wins || p.sips);
  const top = f => { const max = Math.max(0, ...ps.map(f)); return max > 0 ? ps.filter(p => f(p) === max).map(p => p.id) : [] };
  state.bonus = [
    {title:"Minispilstjernen", desc:"flest 🏆 i aftenens spil", ids:top(p => p.wins || 0)},
    {title:"Uheldsstjernen", desc:"flest tår i løbet af aftenen", ids:top(p => p.sips)}
  ].filter(b => b.ids.length && modeOf() === "party");   // kun i Pokaljagt; Skål! er som før
  state.bonus.forEach(b => b.ids.forEach(id => { const p = player(id); if(p) p.wins = (p.wins||0) + 1 }));
  state.phase = "end"; state.round = null; state.event = null; state.trial = null;
  commit();
}

function startRound(){
  if(state.n >= state.maxRounds) return endGame();
  if(state.event && Date.now() > state.event.end) state.event = null;
  const pool = online();
  const type = pickType(pool);
  const r = {type, n: ++state.n, answers:{}, reveal:null};
  state.round = r;
  const instant = TYPES[type].start(r, pool);
  if(instant) return applyReveal(r, instant);
  if(r.limit) r.until = Date.now() + r.limit;
  state.phase = "round";
  commit();
}

function hostAct(pid, n, v){
  const r = state.round;
  if(!r || r.n !== n || state.phase !== "round") return;
  const T = TYPES[r.type];
  const out = T.act ? T.act(r, pid, v) : false;
  if(out === "reveal") return doReveal();
  if(out){ commit(); checkAllIn() }
}

function checkAllIn(){
  const r = state && state.round;
  if(!r || state.phase !== "round") return;
  const T = TYPES[r.type];
  if(!T.done || !T.done(r)) return;
  const n = r.n;
  setTimeout(() => { if(state.round && state.round.n === n && state.phase === "round") doReveal() }, 900);
}

function doReveal(){
  const r = state.round; if(!r || state.phase !== "round") return;
  applyReveal(r, TYPES[r.type].reveal(r));
}

function applyReveal(r, res){
  res.win = res.win || [];
  res.drink = withMate(res.drink || []);
  /* De nye spil har et loft: ingen drikker mere end S+1 i ét spil (makkertår medregnet) */
  if(TYPES[r.type] && TYPES[r.type].cap){
    const sum = {};
    res.drink.forEach(d => { sum[d.id] = Math.min(S() + 1, (sum[d.id] || 0) + d.s) });
    res.drink = Object.entries(sum).map(([id, s]) => ({id, s, mate: res.drink.some(d => d.id === id && d.mate) && !res.drink.some(d => d.id === id && !d.mate)}));
  }
  res.drink.forEach(d => { const p = player(d.id); if(p) p.sips += d.s });
  res.win.forEach(id => { const p = player(id); if(p) p.wins = (p.wins||0) + 1 });
  if(res.buddy) state.buddy = res.buddy;   // nye makkere gælder først fra næste runde
  r.reveal = res; state.phase = "reveal";
  commit();
}

/* Snyd-afstemning: alle undtagen anklager og anklagede stemmer. Flertal for snyd = dømt. */
const trialVoters = () => state.trial ? onlineIds().filter(id => id !== state.trial.accuser && id !== state.trial.accused) : [];
function resolveTrial(){
  const t = state.trial; if(!t) return;
  state.trial = null;
  const yes = Object.values(t.votes).filter(Boolean).length, no = Object.values(t.votes).length - yes;
  if(yes > no) giveNow(t.accused, S()*2, `Dømt for snyd (${yes} mod ${no})!`);
  else giveNow(t.accuser, S(), `Frifundet (${yes} mod ${no}). Falsk anklage:`);
}

/* Handlinger uden for runden: missioner, regelbrud og snyd */
function hostSide(pid, v){
  if(v.k === "mission"){
    const m = state.missions.find(x => x.id === v.id && x.agent === pid); if(!m) return;
    state.missions = state.missions.filter(x => x !== m);
    const a = player(m.agent), t = player(m.target);
    if(v.ok){
      if(a) a.wins = (a.wins||0) + 1;
      giveNow(m.target, S()*2, `Hemmelig mission klaret! ${a?.name} fik kaldt ${t?.name} for "${m.name}" uden at blive opdaget.`);
    } else giveNow(m.agent, S()*2, `${a?.name} blev afsløret i at kalde ${t?.name} for "${m.name}".`);
    commit();
  }
  if(v.k === "accuse"){
    const acc = player(v.id);
    if(state.trial || !acc || v.id === pid || online().length < 3) return;
    state.trial = {id:Date.now(), accuser:pid, accused:v.id, votes:{}, end:Date.now() + TRIAL_MS};
    flash(`🚨 ${player(pid)?.name} anklager ${acc.name} for snyd! Stem nu.`);
    commit();
  }
  if(v.k === "verdict"){
    const t = state.trial;
    if(!t || v.id !== t.id || pid === t.accuser || pid === t.accused) return;
    t.votes[pid] = !!v.yes;
    if(trialVoters().every(id => t.votes[id] !== undefined)) resolveTrial();
    commit();
  }
  if(v.k === "broke"){
    const ev = state.event, p = player(v.id);
    if(!ev || Date.now() > ev.end || !p) return;
    ev.calls = ev.calls || {};
    if(Date.now() - (ev.calls[p.id] || 0) < 8000) return;   // samme person kan ikke straffes to gange på 8 sek
    ev.calls[p.id] = Date.now();
    giveNow(p.id, S(), `Regelbrud!`);
    commit();
  }
}

function hostCmd(cmd, arg){
  if(role !== "host" || !state) return;
  if(cmd === "start" || cmd === "next") startRound();
  if(cmd === "reveal") doReveal();
  if(cmd === "skip"){ state.round = null; startRound() }
  if(cmd === "level"){ state.intensity = +arg; commit() }
  if(cmd === "spice"){ state.spice = +arg; commit() }
  if(cmd === "mode" && MODES[arg] && state.phase === "lobby"){ state.mode = arg; commit() }
  if(cmd === "toggle" && TYPES[arg]){
    const on = modeTypes().filter(t => state.enabled[t] !== false);
    if(state.enabled[arg] !== false && on.length <= 1) return toast("Mindst ét spil skal være slået til.");
    state.enabled[arg] = state.enabled[arg] === false; commit();
  }
  if(cmd === "rounds" && ROUND_CHOICES.includes(+arg)){ state.maxRounds = +arg; commit() }
  if(cmd === "end") endGame();
  if(cmd === "togglecat"){
    const list = Object.keys(TYPES).filter(t => (TYPES[t].cat || "klassik") === arg);
    const anyOn = list.some(t => state.enabled[t] !== false);
    const others = modeTypes().filter(t => !list.includes(t) && state.enabled[t] !== false);
    if(anyOn && !others.length) return toast("Mindst ét spil skal være slået til.");
    list.forEach(t => state.enabled[t] = !anyOn); commit();
  }
  if(cmd === "again"){ state.players.forEach(p => { p.sips = 0; p.wins = 0 }); Object.assign(state, {phase:"lobby", round:null, n:0, used:{}, count:{}, seen:{}, bonus:null, buddy:null, missions:[], event:null, trial:null}); commit() }
  if(cmd === "kick") removePlayer(arg);
  if(cmd === "hostact") hostAct(myId, state.round && state.round.n, arg);
  ui.menu = false; render();
}

const avatar = p => !p ? "" : photoOf(p) ? `<img class="av" src="${photoOf(p)}" alt="">` : esc(p.emoji);
const emojiOf = id => avatar(player(id));
const who = id => `${emojiOf(id)} ${nameOf(id)}`;
const chili = l => l >= 2 ? `<span class="chili" aria-label="krydderi ${l}">${"🌶️".repeat(l)}</span>` : "";
const isHost = () => role === "host";
const card = (color, kind, body, extra) => `<article class="card ${color}"><div class="kind"><span>${kind}</span>${extra||""}</div>${body}</article>`;
const judge = (title, btns) => isHost() ? `<div class="judge"><div class="label">${title}</div><div class="row">${btns.map(([v,t]) => `<button class="btn small" data-a="hostact" data-v="${esc(v)}">${t}</button>`).join("")}</div></div>` : "";
const actj = obj => `data-actj="${esc(JSON.stringify(obj))}"`;
const sidej = obj => `data-side="${esc(JSON.stringify(obj))}"`;
function progress(ids, isDone){
  const list = ids.map(player).filter(Boolean);
  const n = list.filter(p => isDone(p.id)).length;
  return `<div class="label">${n} af ${list.length} er færdige</div>
    <div class="progress">${list.map(p => `<span class="dot ${isDone(p.id)?"ok":""}"><span class="e">${avatar(p)}</span>${esc(p.name)}</span>`).join("")}</div>`;
}
function tallyVotes(A){
  const tally = {}; Object.values(A).forEach(id => { if(player(id)) tally[id] = (tally[id]||0) + 1 });
  return Object.entries(tally).sort((a,b) => b[1]-a[1]);
}
function tallyView(tally){
  const total = tally.reduce((a,[,c]) => a + c, 0) || 1;
  return `<div class="label">Stemmer</div><div class="result">${tally.map(([id,c]) => `<div class="res"><span class="e">${emojiOf(id)}</span><span class="n">${nameOf(id)}<div class="bar"><i style="width:${Math.round(c/total*100)}%"></i></div></span><span class="v">${c}</span></div>`).join("")}</div>`;
}
function voteButtons(ids, mine){
  return `<div class="voters">${ids.map(id => `<button class="choice" data-act="${esc(id)}" aria-pressed="${mine===id}"><span class="em">${emojiOf(id)}</span>${nameOf(id)}</button>`).join("")}</div>`;
}
const onlineIds = () => online().map(p => p.id);
function countdown(startHost, dur){
  const until = L(startHost) + dur;
  return `<div class="timer" style="font-size:40px;text-align:center" data-until="${until}">${fmtLeft(Math.max(0, until - Date.now()))}</div>
    <div class="tbar"><i data-bar="${until}" data-dur="${dur}" style="width:100%"></i></div>`;
}

/* ---- minispil (lokal tidtagning på hver telefon) ---- */
function gameReveal(r, lower, perPlayer){
  const A = r.answers;
  const early = Object.keys(A).filter(id => A[id] < 0);
  const valid = Object.keys(A).filter(id => A[id] >= 0).sort((a,b) => lower ? A[a]-A[b] : A[b]-A[a]);
  const asleep = onlineIds().filter(id => A[id] === undefined);
  const sips = {};
  const add = (id, s) => sips[id] = (sips[id]||0) + s;
  early.forEach(id => add(id, S())); asleep.forEach(id => add(id, S()));
  if(valid.length >= 2){
    const worst = A[valid[valid.length-1]];
    if(worst !== A[valid[0]]) valid.filter(id => A[id] === worst).forEach(id => add(id, S()));
  }
  if(perPlayer) valid.forEach(id => { const s = perPlayer(A[id]); if(s) add(id, s) });
  return {order:valid, early, asleep, drink:Object.entries(sips).map(([id,s]) => ({id, s})), win: valid.length ? [valid[0]] : []};
}
function gameResult(r, res, color, extra){
  const A = r.answers, best = res.win[0], T = TYPES[r.type];
  return card(color, T.name, `<h2 class="prompt">${best ? `${nameOf(best)} vandt!` : "Ingen gennemførte"}</h2>
      ${best ? `<div class="who">${fmtScore(r, A[best])}${extra ? " · " + extra(A[best]) : ""}</div>` : ""}`) +
    `<div class="label">Resultater</div><div class="result">${[
      ...res.order.map((id,i) => `<div class="res ${i===0?"win":""}"><span class="e">${emojiOf(id)}</span><span class="n">${i+1}. ${nameOf(id)}</span><span class="v">${fmtScore(r, A[id])}</span></div>`),
      ...res.early.map(id => `<div class="res"><span class="e">${emojiOf(id)}</span><span class="n">${nameOf(id)}</span><span class="v">For tidligt</span></div>`),
      ...res.asleep.map(id => `<div class="res"><span class="e">${emojiOf(id)}</span><span class="n">${nameOf(id)}</span><span class="v">Sov</span></div>`)
    ].join("")}</div>`;
}
function fmtScore(r, v){
  if(r.type === "reflex") return v < 0 ? "For tidligt" : v + " ms";
  if(r.type === "tap") return v + " tryk";
  if(r.type === "stop") return v >= 9999 ? "Nåede ikke" : "±" + dk(v/1000,2) + " s";
  return v;
}
const gameAct = max => (r, pid, v) => {
  if(typeof v !== "number" || !isFinite(v) || r.answers[pid] !== undefined) return false;
  r.answers[pid] = (r.type === "reflex" && v < 0) ? -1 : Math.max(0, Math.min(Math.round(v), max));
  return true;
};
const allOnlineAnswered = r => { const ids = onlineIds(); return ids.length > 0 && ids.every(id => r.answers[id] !== undefined) };

  /* ---------- Idé 6: Find fem ting til fælles ---------- */
  common:{
    name:"Vælg en makker", desc:"30 udfordringer for to", w:1.3, min:2,
    start(r, pool){
      r.chooser = pickLeast("common", pool, 1)[0].id; r.partner = null; r.found = 0; r.started = null;
      const c = pickFresh("partner", PARTNER, 10);
      Object.assign(r, {lvl:c[0], text:c[1], goal:c[2], secs:c[3]});
    },
    act(r, pid, v){
      const inTeam = pid === r.chooser || pid === r.partner || pid === myId;
      if(isObj(v) && pid === r.chooser && !r.partner && player(v.partner) && v.partner !== pid){ r.partner = v.partner; return true }
      if(v === "start" && r.partner && inTeam && !r.started){
        r.started = Date.now(); const n = r.n;
        setTimeout(() => { if(state.round && state.round.n === n && state.phase === "round") doReveal() }, r.secs*1000 + 1000);
        return true;
      }
      if(v === "plus" && r.started && inTeam){ r.found = Math.min(r.goal, r.found + 1); return r.found >= r.goal ? "reveal" : true }
      return false;
    },
    reveal(r){
      if(!r.partner) return {drink:[{id:r.chooser, s:S()}]};
      if(r.found >= r.goal) return {win:[r.chooser, r.partner], drink:[]};
      const s = r.found * 2 >= r.goal ? S() : S()*2;   // under halvvejs = dobbelt straf
      return {drink:[{id:r.chooser, s}, {id:r.partner, s}]};
    },
    view(r){
      const team = r.chooser === myId || r.partner === myId;
      const rules = `<p>Nå I ${r.goal} på ${r.secs} sekunder, får I begge et 🏆. Ellers drikker I ${tar(S())} hver, eller ${tar(S()*2)} hvis I ikke nåede halvvejs.</p>`;
      if(!r.partner){

          `<div class="label">Hvem tager du med?</div><div class="voters">${online().filter(p => p.id !== myId).map(p => `<button class="choice" ${actj({partner:p.id})}><span class="em">${avatar(p)}</span>${esc(p.name)}</button>`).join("")}</div>`;
        return card("sky", "Vælg en makker", `<div class="who">${who(r.chooser)} vælger en makker…</div><h2 class="prompt sm">${esc(r.text)}</h2>`, chili(r.lvl));
      }
      return card("sky", "Vælg en makker", `<div class="who">${who(r.chooser)} & ${who(r.partner)}</div><h2 class="prompt sm">${esc(r.text)}</h2>${rules}`, chili(r.lvl)) +
        `<div class="counter">${r.found}/${r.goal}</div>` +

          : (team || isHost() ? `<button class="btn primary" data-act="start">Start ${r.secs} sekunder</button>` : `<p class="waiting">Venter på, at de starter…</p>`));

  /* ---------- Idé 7: Drukmakker ---------- */
  buddy:{
    name:"Drukmakker", desc:"To drikker altid sammen", w:0.7, min:2,

      let pair, tries = 0;
      do { pair = shuffle([...pool]).slice(0,2) } while(tries++ < 10 && state.buddy && pool.length > 2 &&
        [state.buddy.a, state.buddy.b].includes(pair[0].id) && [state.buddy.a, state.buddy.b].includes(pair[1].id));
      r.a = pair[0].id; r.b = pair[1].id; r.prev = state.buddy;

        <p>Skål sammen nu! Hver gang den ene drikker, drikker den anden med, indtil næste makkerskifte.</p>`);

      state.event = {id:r.n, text, end:Date.now() + e.d*1000, dur:e.d*1000, calls:{}};

  /* ---------- Idé 9: Saml sætningen ---------- */
  sentence:{
    name:"Saml sætningen", desc:"Hvert sit hemmelige ord", w:0.9, min:2,
    start(r, pool){
      const c = pickCard("sentence", SENTENCES); r.sentence = c[1]; r.lvl = c[0];
      const words = r.sentence.split(" "), ids = shuffle(pool.map(p => p.id));
      r.words = {}; ids.forEach(id => r.words[id] = []);
      words.forEach((w,i) => r.words[ids[i % ids.length]].push(w));
      Object.values(r.words).forEach(shuffle);
      r.count = words.length; r.wrong = {};
    },
    act(r, pid, v){
      if(v === "giveup" && pid === myId){ r.giveup = true; return "reveal" }
      if(!isObj(v) || typeof v.guess !== "string") return false;
      if(norm(v.guess) === norm(r.sentence)){ r.solvedBy = pid; return "reveal" }
      r.wrong[pid] = (r.wrong[pid]||0) + 1;
      giveNow(pid, 1, `Forkert sætning: "${clean(v.guess,80)}".`);
      return true;
    },
    reveal(r){
      if(r.solvedBy) return {win:[r.solvedBy], drink:[]};
      return {drink:onlineIds().map(id => ({id, s:S()}))};
    },
    view(r){
      const mine = r.words[myId] || [];
      const wrongs = Object.values(r.wrong).reduce((a,b) => a+b, 0);
      return card("sky", "Saml sætningen", `<h2 class="prompt sm">Sætningen har ${r.count} ord. Hver af jer har en del af den.</h2>
          <p>Giv hinanden ledetråde, men sig ikke jeres ord direkte. Når I tror, I har den, skriver én den ind. Hvert forkert gæt koster gætteren 1 tår.</p>`, chili(r.lvl)) +
        `<div class="label">${mine.length ? "Dine hemmelige ord" : "Dine ord"}</div>` +
        (mine.length ? `<div class="words">${mine.map(w => `<span class="word">${esc(w)}</span>`).join("")}</div>` : `<p class="hint">Du har intet ord. Du er detektiv: hjælp de andre med at samle sætningen.</p>`) +
        `<input class="field" id="sent-${r.n}" autocomplete="off" placeholder="Skriv hele sætningen" maxlength="120">
        <button class="btn primary" data-a="sentsend">Lås op</button>
        ${wrongs ? `<p class="hint">Forkerte gæt indtil nu: ${wrongs}</p>` : ""}
        ${isHost() ? `<button class="btn small ghost" data-a="hostact" data-v="giveup">Giv op (alle drikker ${tar(S())})</button>` : ""}`;
    },
    result(r){
      return card("sky", "Saml sætningen", `<div class="who">${r.solvedBy ? `${who(r.solvedBy)} låste den op!` : "I gav op"}</div><h2 class="prompt">"${esc(r.sentence)}"</h2>`, chili(r.lvl));
    }

  /* ---------- Idé 10: Find impostoren ---------- */
  impostor:{
    name:"Find impostoren", desc:"Én har et andet ord", w:1.2, min:3,
    start(r, pool){
      const c = pickCard("impostor", IMPOSTOR); r.cat = c[1]; r.crew = c[2]; r.fake = c[3]; r.lvl = c[0];
      r.impostor = pick(pool).id; r.players = pool.map(p => p.id);
      r.starter = pick(pool).id;   // appen vælger, hvem der starter beskrivelserne
    },
    act(r, pid, v){ if(player(v) && v !== pid && r.players.includes(pid)){ r.answers[pid] = v; return true } return false },
    opt: () => true,
    done: r => { const ids = onlineIds().filter(id => r.players.includes(id)); return ids.length > 0 && ids.every(id => r.answers[id]) },
    reveal(r){
      const tally = tallyVotes(r.answers);
      const top = tally[0], caught = top && top[0] === r.impostor && (!tally[1] || tally[1][1] < top[1]);
      if(caught) return {caught, tally, drink:[{id:r.impostor, s:S()*2}, ...Object.keys(r.answers).filter(id => r.answers[id] !== r.impostor && id !== r.impostor).map(id => ({id, s:S()}))]};
      return {caught, tally, win:[r.impostor], drink:r.players.filter(id => id !== r.impostor && player(id)).map(id => ({id, s:S()}))};

    view(r){
      if(!r.players.includes(myId)) return card("violet", "Find impostoren", `<h2 class="prompt sm">Du kom med midt i runden. Se med, og stem næste gang.</h2>`);
      const word = r.impostor === myId ? r.fake : r.crew;

      return card("violet", "Find impostoren", `<h2 class="prompt sm">Alle har fået et ord. Én af jer har et lidt andet ord.</h2>
