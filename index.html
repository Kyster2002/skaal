/* Layout: én kolonne, telefon-først. Topbar med kode + egne tår/sejre, et stort kort pr. runde, handlinger under. */
:root{
  --bg:#23101B;        /* aubergine bodega-mørke */
  --bg2:#33172A;
  --line:#4A2440;
  --foam:#FFF3E2;      /* ølskum */
  --ink:#23101B;
  --amber:#FFB020;     /* pilsner */
  --pink:#FF5C8A;
  --teal:#3DD6C0;
  --violet:#A98BFF;
  --red:#FF4D3D;
  --green:#2FD36B;
  --muted:#C9A9B8;
  --display:"Bagel Fat One","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:22px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--foam);font-family:var(--body);font-size:16px}
body{min-height:100dvh;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}

.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:16px;min-height:100dvh}
.wrap.game{padding-top:calc(env(safe-area-inset-top,0px) + 72px)}

/* Topbar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.topbar-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-weight:800;font-size:14px;letter-spacing:.06em;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip .k{color:var(--muted);font-weight:600;letter-spacing:.04em;font-size:11px;text-transform:uppercase}
.spacer{flex:1}
.iconbtn{width:44px;height:44px;flex:none;border-radius:14px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.offline-banner{background:var(--red);color:#fff;text-align:center;font-weight:800;padding:8px 12px;border-radius:14px;font-size:14px}

/* Hero */
.hero{padding-top:24px;text-align:center;position:relative}
.logo{font-family:var(--display);font-size:clamp(72px,24vw,120px);line-height:.9;margin:0;color:var(--amber);text-shadow:0 6px 0 #8A4A00,0 10px 30px rgba(255,176,32,.25);transform:rotate(-4deg);font-weight:400}
.logo small{display:block;font-family:var(--body);font-weight:800;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);text-shadow:none;margin-top:18px;transform:rotate(4deg)}
.bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bubbles i{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(255,243,226,.35);animation:rise 6s linear infinite}
@keyframes rise{to{transform:translateY(-240px);opacity:0}}
@media (prefers-reduced-motion:reduce){.bubbles{display:none}*{animation:none!important;transition:none!important}}

/* Paneler & felter */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field{width:100%;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--bg);font-size:18px;font-weight:600}
.field:focus{border-color:var(--amber);outline:none}
.field.code{text-transform:uppercase;letter-spacing:.4em;text-align:center;font-family:var(--display);font-size:28px;padding:12px}
.emojis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.emojis button{aspect-ratio:1;min-width:0;padding:0;border-radius:12px;font-size:24px;background:var(--bg);border:2px solid transparent}
.emojis button[aria-pressed="true"]{border-color:var(--amber);background:#4a2a1a}
.err{color:var(--pink);font-weight:600;margin:0}
.hint{color:var(--muted);font-size:14px;line-height:1.45;margin:0}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:14px 18px;border-radius:18px;font-weight:800;font-size:18px;background:var(--bg2);border:2px solid var(--line);width:100%;text-align:center;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--amber);color:var(--ink);border-color:var(--amber);box-shadow:0 5px 0 #8A4A00}
.btn.primary:active{box-shadow:0 1px 0 #8A4A00;transform:translateY(4px)}
.btn.ghost{background:transparent}
.btn.small{min-height:44px;font-size:15px;padding:10px 14px;border-radius:14px}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

/* Lobby */
.bigcode{font-family:var(--display);font-size:clamp(56px,18vw,84px);letter-spacing:.12em;text-align:center;line-height:1;color:var(--foam)}
.qr{display:grid;place-items:center}
.qr img{width:180px;height:180px;border-radius:14px;background:#fff;padding:8px;image-rendering:pixelated}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pl{position:relative;background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:12px 6px 10px;text-align:center;min-width:0}
.pl .em{font-size:34px;line-height:1.1}
.pl .nm{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .sub{font-size:12px;color:var(--muted)}
.pl.off{opacity:.45}
.pl.me{border-color:var(--amber)}
.pl .x{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:10px;color:var(--muted);font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding:5px;border-radius:16px}
.seg button{padding:10px 4px;border-radius:12px;font-weight:800;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--ink)}
.seg.hot button[aria-pressed="true"]{background:var(--pink);color:var(--ink)}
.seg button small{display:block;font-weight:600;font-size:11px;opacity:.85}
.consent{border-left:4px solid var(--pink);padding:2px 0 2px 12px}

/* Spilkort */
.eyebrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.eyebrow .t{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.card{--c:var(--amber);background:var(--c);color:var(--ink);border-radius:28px;padding:24px 22px 26px;box-shadow:0 8px 0 color-mix(in srgb,var(--c) 45%,#000);position:relative;overflow:hidden;animation:deal .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes deal{from{transform:translateY(30px) rotate(-3deg);opacity:0}}
.card .kind{font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.75;display:flex;justify-content:space-between;gap:8px}
.card .prompt{font-family:var(--display);font-size:clamp(25px,7.2vw,34px);line-height:1.12;margin:10px 0 0;text-wrap:balance;font-weight:400}
.card .prompt.sm{font-size:clamp(21px,6vw,27px)}
.card .who{font-weight:800;font-size:18px;margin-top:6px}
.card b{font-weight:800}
.card.vote{--c:var(--amber)}
.card.duel{--c:var(--pink)}
.card.hot{--c:var(--violet)}
.card.game{--c:var(--teal)}
.card.chaos{--c:var(--foam);background:repeating-linear-gradient(-45deg,var(--foam) 0 22px,#FFE7C2 22px 44px)}
.chili{letter-spacing:-.1em;opacity:1}

.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:14px;text-align:center}
.vs .side{min-width:0}
.vs .e{font-size:44px;line-height:1}
.vs .nm{font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs .x{font-family:var(--display);font-size:34px;transform:rotate(-8deg)}
.vs .side.win .nm::after{content:" 🏆"}
.vs .side.lose{opacity:.55}

/* Minispil-flade */
.pad{min-height:320px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:24px;user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer;background:var(--bg2);border:2px solid var(--line);color:var(--foam);position:relative}
.pad .big{font-family:var(--display);font-size:clamp(48px,16vw,76px);line-height:1;font-variant-numeric:tabular-nums}
.pad p{margin:0;font-weight:600;color:inherit;opacity:.85}
.pad.wait{background:var(--red);border-color:var(--red);color:#fff}
.pad.go{background:var(--green);border-color:var(--green);color:var(--ink)}
.pad.play{background:var(--teal);border-color:var(--teal);color:var(--ink)}
.pad.play:active{transform:scale(.985)}
.mathq{font-family:var(--display);font-size:clamp(40px,13vw,60px);line-height:1}
.mathopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.mathopts button{min-height:70px;border-radius:18px;background:var(--foam);color:var(--ink);font-family:var(--display);font-size:30px}

.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{min-height:64px;padding:14px;border-radius:18px;background:var(--bg2);border:2px solid var(--line);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;line-height:1.2;min-width:0}
.choice .em{font-size:26px}
.choice[aria-pressed="true"]{background:var(--foam);color:var(--ink);border-color:var(--foam)}
.choice.tall{min-height:110px;flex-direction:column}
.choice.hotpick{min-height:130px;font-family:var(--display);font-weight:400;font-size:26px}
.voters{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}

.progress{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dot{display:inline-flex;align-items:center;gap:4px;padding:4px 10px 4px 6px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:600}
.dot.ok{background:#1f3a2c;border-color:var(--green)}
.dot .e{font-size:16px}

/* Resultat */
.result{display:flex;flex-direction:column;gap:8px}
.res{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--bg2);border:1px solid var(--line)}
.res .e{font-size:28px}
.res .n{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .v{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted);white-space:nowrap}
.res.drink{background:var(--foam);color:var(--ink);border-color:var(--foam)}
.res.drink .v{color:var(--ink)}
.res.win{border-color:var(--amber)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--amber)}
.drinkhead{font-family:var(--display);font-size:30px;color:var(--amber);margin:4px 0 0;font-weight:400}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split .col{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:12px;min-width:0}
.split .col h4{margin:0 0 8px;font-size:14px;line-height:1.3}
.names{font-size:14px;color:var(--muted);line-height:1.5;word-break:break-word}

.waiting{color:var(--muted);text-align:center;font-weight:600;padding:8px;margin:0}
.hostbar{display:flex;gap:8px;flex-wrap:wrap}
.hostbar .btn{flex:1 1 140px}
.judge{border:1px dashed var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.stickybottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}

/* Menu-ark */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-top:2px solid var(--line);border-radius:26px 26px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:85dvh;overflow:auto;animation:up .2s ease-out}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(100%)}}
.board{display:flex;flex-direction:column;gap:6px}
.board .res .rank{font-family:var(--display);width:26px;text-align:center;color:var(--muted)}

.podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;align-items:end;text-align:center}
.podium .p{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 6px 6px;padding:12px 4px;min-width:0}
.podium .p .e{font-size:38px}
.podium .p .nm{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .p .s{font-family:var(--display);font-size:24px;color:var(--amber)}
.podium .p1{padding-block:26px;border-color:var(--amber)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--foam);color:var(--ink);font-weight:800;padding:12px 18px;border-radius:14px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.foot{font-size:12px;color:var(--muted);text-align:center;opacity:.8;margin:0}
</style>
</head>

const TYPES = {

  hot:{kind:"Sandhed eller konsekvens",w:2.5},

const EMOJIS = ["🍺","🍷","🥂","🍹","🥃","🍾","🧉","🍸","🦄","🐸","🐙","🦊","🐻","🐷","🦖","👽","🤠","🥸","😎","🤡","👑","🔥","🌶️","🍑"];
const LEVELS = [{v:1,t:"Mild",s:"1 tår"},{v:2,t:"Medium",s:"2 tår"},{v:3,t:"Vild",s:"3 tår"}];
const SPICES = [{v:1,t:"Hyggelig",s:"Ingen flirt"},{v:2,t:"Spicy",s:"🌶️🌶️"},{v:3,t:"Uartig",s:"🌶️🌶️🌶️"}];
const PREFIX = "skaal-dk-v1-";
const SAVE_HOST = "skaal-host2", SAVE_LAST = "skaal-last";

/* ============================================================

const $ = s => document.querySelector(s);
const app = $("#app");
const store = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]} return a };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean = (s,max) => String(s ?? "").replace(/[\u0000-\u001f\u007f]/g,"").trim().slice(0,max);
const tar = n => n + " tår";
const buzz = ms => { if(navigator.vibrate) try{ navigator.vibrate(ms) }catch(e){} };
const dk = (n,d) => n.toFixed(d).replace(".",",");
function makeCode(){const a="ABCDEFGHJKLMNPRSTUVWXYZ";let s="";for(let i=0;i<4;i++)s+=a[rnd(a.length)];return s}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}

let myId = store.get("skaal-id");
if(!myId){myId="p"+Math.random().toString(36).slice(2,10);store.set("skaal-id",myId)}
const me = {name: store.get("skaal-name") || "", emoji: store.get("skaal-emoji") || EMOJIS[rnd(EMOJIS.length)]};

/* ============================================================
   TILSTAND
   ============================================================ */
let role = null;          // "host" | "guest" | null
let state = null;         // delt spiltilstand (værten ejer den)
let peer = null;
let ui = {screen:"home", err:"", code:"", menu:false, online:true};
const guests = new Map(); // vært: playerId -> {conn, seen}
let hostConn = null, guestTimer = null, lastHostMsg = 0, everConnected = false, connecting = false;

const player = id => state && state.players.find(p => p.id === id);
const sipsBase = () => (state && state.intensity) || 2;

/* ============================================================
   VÆRT
   ============================================================ */
function newState(code){
  return {code, phase:"lobby", hostId:myId, intensity:2, spice:2, n:0, round:null, used:{}, count:{},
          players:[{id:myId,name:me.name,emoji:me.emoji,sips:0,wins:0,online:true}]};
}

function hostGame(resume){
  teardown();
  role = "host";
  ui = {...ui, screen:"connecting", err:"", menu:false};
  render();
  const code = resume ? resume.code : makeCode();
  let tries = 0;
  const start = () => {
    peer = new Peer(PREFIX + code.toLowerCase(), {debug:0});
    peer.on("open", () => {
      if(!state || state.code !== code) state = resume || newState(code);
      const mine = player(myId);
      if(mine){mine.name=me.name;mine.emoji=me.emoji;mine.online=true}
      state.players.forEach(p => { if(p.id!==myId) p.online=false });
      ui.screen = "game"; ui.online = true;
      commit(); keepAwake();
    });
    peer.on("connection", conn => {
      conn.on("data", d => onGuestData(conn, d));
      conn.on("close", () => dropConn(conn));
      conn.on("error", () => dropConn(conn));
    });
    peer.on("disconnected", () => { ui.online=false; render(); setTimeout(() => { if(peer && !peer.destroyed) peer.reconnect() }, 1500) });
    peer.on("error", e => {
      if(e.type === "unavailable-id"){
        peer.destroy();
        if(resume && tries++ < 12){ setTimeout(start, 2500); return }   // den gamle forbindelse er ikke sluppet endnu
        if(!resume){ setTimeout(() => hostGame(), 100); return }
        ui = {...ui, screen:"home", err:"Koden er optaget. Start et nyt spil."}; role=null; render(); return;
      }
      if(e.type === "network" || e.type === "server-error" || e.type === "socket-error"){
        ui.online=false; render(); setTimeout(() => { if(peer && !peer.destroyed && peer.disconnected) peer.reconnect() }, 3000);
      }
    });
  };
  start();
}

function onGuestData(conn, d){
  if(!d || typeof d !== "object" || !state) return;
  if(d.t === "hello"){
    const id = clean(d.id, 24), name = clean(d.name, 16) || "Gæst", emoji = clean(d.emoji, 8) || "🍺";
    if(!id || id === myId) return;
    const old = guests.get(id);
    if(old && old.conn !== conn) try{ old.conn.close() }catch(e){}
    guests.set(id, {conn, seen:Date.now()});
    conn._pid = id;
    const p = player(id);
    if(p){ p.name=name; p.emoji=emoji; p.online=true }
    else state.players.push({id,name,emoji,sips:0,wins:0,online:true});
    commit();
    return;
  }
  const id = conn._pid; if(!id) return;
  const g = guests.get(id); if(g) g.seen = Date.now();
  const p = player(id);
  if(d.t === "ping"){ if(p && !p.online){ p.online=true; commit() } return }
  if(d.t === "act" && p) hostAct(id, d.n, d.v);
  if(d.t === "leave") removePlayer(id);
}

function dropConn(conn){
  const id = conn._pid; if(!id) return;
  const g = guests.get(id);
  if(g && g.conn === conn){ guests.delete(id); const p = player(id); if(p){ p.online=false; commit(); checkAllIn() } }
}

function removePlayer(id){
  if(id === myId) return;
  const g = guests.get(id); if(g){ try{ g.conn.send({t:"kicked"}) }catch(e){} setTimeout(()=>{try{g.conn.close()}catch(e){}},300); guests.delete(id) }
  state.players = state.players.filter(p => p.id !== id);
  commit(); checkAllIn();
}

function broadcast(){
  const msg = {t:"state", s:state};
  guests.forEach(g => { if(g.conn.open) try{ g.conn.send(msg) }catch(e){} });
}
function commit(){
  store.set(SAVE_HOST, JSON.stringify({state, at:Date.now()}));
  broadcast(); render();
}
setInterval(() => {
  if(role !== "host" || !state) return;
  const now = Date.now(); let changed = false;
  guests.forEach((g, id) => { if(now - g.seen > 16000){ const p = player(id); if(p && p.online){ p.online=false; changed=true } } });
  if(changed){ commit(); checkAllIn() } else broadcast();   // fungerer også som hjerteslag
}, 4000);

/* ---- kort og runder ---- */
const lvl = c => Array.isArray(c) ? c[0] : c.l;
function pickCard(key, arr){
  const spice = state.spice;
  const ok = arr.map((_,i) => i).filter(i => lvl(arr[i]) <= spice);
  const used = state.used[key] = state.used[key] || [];
  let free = ok.filter(i => !used.includes(i));
  if(!free.length){ used.length = 0; free = ok }
  const top = free.filter(i => lvl(arr[i]) === spice);
  if(spice > 1 && top.length && Math.random() < 0.65) free = top;   // højere krydderi = flere af de stærke kort
  const i = free[rnd(free.length)];
  used.push(i); return arr[i];
}
function pickType(nOnline){
  const last = state.round && state.round.type;
  const opts = Object.entries(TYPES).filter(([t]) => t !== last && !(t === "duel" && nOnline < 2));
  const total = opts.reduce((a,[,v]) => a + v.w, 0);
  let x = Math.random() * total;
  for(const [t,v] of opts){ if((x -= v.w) <= 0) return t }
  return opts[0][0];
}
/* Vælg dem, der har været mindst på i den rolle */
function pickLeast(key, pool, k){
  const c = state.count[key] = state.count[key] || {};
  const sorted = shuffle([...pool]).sort((a,b) => (c[a.id]||0) - (c[b.id]||0)).slice(0,k);
  sorted.forEach(p => c[p.id] = (c[p.id]||0) + 1);
  return sorted;
}
function makeMath(){
  const qs = [];
  for(let i=0;i<3;i++){
    let q, a; const k = rnd(3);
    if(k === 0){ const x = 12+rnd(48), y = 12+rnd(48); q = `${x} + ${y}`; a = x+y }
    else if(k === 1){ const x = 3+rnd(10), y = 3+rnd(10); q = `${x} × ${y}`; a = x*y }
    else { const x = 40+rnd(60), y = 11+rnd(29); q = `${x} − ${y}`; a = x-y }
    const opts = new Set([a]);
    while(opts.size < 4){ const d = (1+rnd(10)) * (Math.random()<.5?-1:1); if(a+d > 0) opts.add(a+d) }
    qs.push({q, a, opts: shuffle([...opts])});
  }
  return qs;
}
const mark = name => "\u0001" + name + "\u0002";

function startRound(){
  const pool = state.players.filter(p => p.online);
  const type = pickType(pool.length);
  const r = {type, n: ++state.n, answers:{}, reveal:null};
  if(type === "duel"){
    const [a,b] = pickLeast("duel", pool, 2);
    let c = pickCard("duel", DUELS);
    for(let i=0; i<6 && (a.id === myId || b.id === myId) && /værten/.test(c[1]); i++) c = pickCard("duel", DUELS);  // værten kan ikke dømme sin egen duel
    r.a = a.id; r.b = b.id; r.text = c[1]; r.lvl = c[0];
  }
  if(type === "hot"){
    r.target = pickLeast("hot", pool, 1)[0].id;
    const t = pickCard("truth", TRUTHS), d = pickCard("dare", DARES);
    r.truth = t[1]; r.tl = t[0]; r.dare = d[1]; r.dl = d[0]; r.pick = null;
  }
  if(type === "vote"){ const c = pickCard("vote", VOTES); r.text = c[1]; r.lvl = c[0] }
  if(type === "reflex"){ r.delay = 1500 + rnd(4000); r.limit = 3000 + r.delay + 6000 }
  if(type === "tap") r.limit = 3000 + 5000 + 5000;
  if(type === "stopwatch") r.limit = 3000 + 12000 + 3000;
  if(type === "math"){ r.qs = makeMath(); r.limit = 3000 + 45000 + 3000 }
  state.round = r;
  if(type === "chaos"){ dealChaos(r); return }
  state.phase = "round";
  commit();
  if(r.limit){ const n = r.n; setTimeout(() => { if(state && state.round && state.round.n===n && state.phase==="round") doReveal() }, r.limit) }
}

function dealChaos(r){
  const S = sipsBase();
  const card = pickCard("chaos", CHAOS);
  r.lvl = card.l;
  const pool = state.players.filter(p => p.online);
  const p = pool[rnd(pool.length)];
  const rest = pool.filter(x => x !== p);
  const q = rest.length ? rest[rnd(rest.length)] : p;
  let drinkers = [], pName = p.name;
  if(card.who === "rand") drinkers = [p];
  if(card.who === "pair") drinkers = q === p ? [p] : [p, q];
  if(card.who === "all") drinkers = pool;
  if(card.who === "least"){
    const min = Math.min(...pool.map(x => x.sips));
    drinkers = pool.filter(x => x.sips === min);
    pName = drinkers.map(x => x.name).join(" og ");
  }
  r.text = card.t.replace(/\{p\}/g, mark(pName)).replace(/\{q\}/g, mark(q.name)).replace(/\{S\}/g, tar(S));
  applyReveal(r, {drink: drinkers.map(x => ({id:x.id, s:S}))});
}

const SCORE_MAX = {reflex:99999, tap:150, stopwatch:60000, math:120000};
function hostAct(pid, n, v){
  const r = state.round;
  if(!r || r.n !== n || state.phase !== "round") return;
  const T = TYPES[r.type];
  if(r.type === "vote"){ if(!player(v)) return; r.answers[pid] = v }
  else if(r.type === "duel"){
    if(v === "lose" && (pid === r.a || pid === r.b)){ r.winner = pid === r.a ? "b" : "a"; return doReveal() }
    if(v === "tie" && (pid === r.a || pid === r.b || pid === myId)){ r.winner = "tie"; return doReveal() }
    if((v === "win:a" || v === "win:b") && pid === myId){ r.winner = v.slice(4); return doReveal() }
    if((v === "a" || v === "b") && pid !== r.a && pid !== r.b) r.answers[pid] = v;
    else return;
  }
  else if(r.type === "hot"){
    if(pid !== r.target && pid !== myId) return;
    if((v === "truth" || v === "dare") && !r.pick){ r.pick = v }
    else if((v === "done" || v === "drank") && r.pick){ r.answers[r.target] = v; return doReveal() }
    else return;
  }
  else if(T && T.game){
    if(typeof v !== "number" || !isFinite(v) || r.answers[pid] !== undefined) return;
    r.answers[pid] = (r.type === "reflex" && v < 0) ? -1 : Math.max(0, Math.min(Math.round(v), SCORE_MAX[r.type]));
  }
  else return;
  commit(); checkAllIn();
}

function checkAllIn(){
  const r = state && state.round;
  if(!r || state.phase !== "round" || !(r.type === "vote" || TYPES[r.type].game)) return;
  const need = state.players.filter(p => p.online).map(p => p.id);
  if(need.length && need.every(id => r.answers[id] !== undefined)){
    const n = r.n;
    setTimeout(() => { if(state.round && state.round.n === n && state.phase === "round") doReveal() }, 900);
  }
}

function doReveal(){
  const r = state.round; if(!r || state.phase !== "round") return;
  const S = sipsBase(), A = r.answers;
  const res = {drink:[], win:[]};
  if(r.type === "vote"){
    const tally = {}; Object.values(A).forEach(id => { if(player(id)) tally[id] = (tally[id] || 0) + 1 });
    const max = Math.max(0, ...Object.values(tally));
    res.tally = Object.entries(tally).sort((a,b) => b[1]-a[1]);
    if(max > 0) res.drink = res.tally.filter(([,c]) => c === max).map(([id]) => ({id, s:S}));
  }
  if(r.type === "duel"){
    const w = r.winner || "tie";
    res.winner = w;
    res.right = Object.keys(A).filter(id => w !== "tie" && A[id] === w);
    res.wrong = Object.keys(A).filter(id => w !== "tie" && A[id] !== w);
    if(w === "tie") res.drink = [{id:r.a, s:S}, {id:r.b, s:S}];
    else {
      const winner = w === "a" ? r.a : r.b, loser = w === "a" ? r.b : r.a;
      res.drink = [{id:loser, s:S*2}, ...res.wrong.map(id => ({id, s:S}))];
      res.win = [winner];
    }
  }
  if(r.type === "hot"){
    res.choice = A[r.target] || "drank";
    if(res.choice === "drank") res.drink = [{id:r.target, s:S*2}];
    else res.win = [r.target];
  }
  if(TYPES[r.type].game){
    const lower = r.type !== "tap";
    const early = Object.keys(A).filter(id => A[id] < 0);
    const valid = Object.keys(A).filter(id => A[id] >= 0).sort((a,b) => lower ? A[a]-A[b] : A[b]-A[a]);
    const asleep = state.players.filter(p => p.online && A[p.id] === undefined).map(p => p.id);
    res.order = valid; res.early = early; res.asleep = asleep;
    const losers = new Set([...early, ...asleep]);
    if(valid.length >= 2){
      const worst = A[valid[valid.length-1]];
      valid.filter(id => A[id] === worst && A[id] !== A[valid[0]]).forEach(id => losers.add(id));
    }
    res.drink = [...losers].map(id => ({id, s:S}));
    if(valid.length) res.win = [valid[0]];
  }
  applyReveal(r, res);
}

function applyReveal(r, res){
  res.win = res.win || [];
  res.drink.forEach(d => { const p = player(d.id); if(p) p.sips += d.s });
  res.win.forEach(id => { const p = player(id); if(p) p.wins = (p.wins||0) + 1 });
  r.reveal = res; state.phase = "reveal";
  commit();
}

function hostCmd(cmd, arg){
  if(role !== "host" || !state) return;
  if(cmd === "start" || cmd === "next") startRound();
  if(cmd === "reveal") doReveal();
  if(cmd === "skip"){ state.round = null; startRound() }
  if(cmd === "level"){ state.intensity = +arg; commit() }
  if(cmd === "spice"){ state.spice = +arg; commit() }
  if(cmd === "end"){ state.phase = "end"; state.round = null; commit() }
  if(cmd === "again"){ state.players.forEach(p => { p.sips = 0; p.wins = 0 }); state.phase = "lobby"; state.round = null; state.n = 0; state.count = {}; commit() }
  if(cmd === "kick") removePlayer(arg);
  if(cmd === "hostact") hostAct(myId, state.round.n, arg);
  ui.menu = false; render();
}

function closeGame(){
  if(role === "host"){
    guests.forEach(g => { try{ g.conn.send({t:"closed"}) }catch(e){} });
    store.del(SAVE_HOST);
  } else if(hostConn && hostConn.open){
    try{ hostConn.send({t:"leave"}) }catch(e){}
    store.del(SAVE_LAST);
  }
  setTimeout(() => { teardown(); state = null; role = null; ui = {screen:"home", err:"", code:"", menu:false, online:true}; render() }, 250);
}

function teardown(){
  clearTimeout(guestTimer); guestTimer = null;
  guests.forEach(g => { try{ g.conn.close() }catch(e){} }); guests.clear();
  if(hostConn) try{ hostConn.close() }catch(e){}
  hostConn = null;
  if(peer) try{ peer.destroy() }catch(e){}
  peer = null; everConnected = false; connecting = false;
  clearMg(); mg = {n:-1};
}

/* ============================================================
   GÆST
   ============================================================ */
function joinGame(code){
  teardown();
  role = "guest"; state = null;
  ui = {...ui, screen:"connecting", err:"", code, menu:false};
  render();
  peer = new Peer({debug:0});
  peer.on("open", () => connectHost());
  peer.on("disconnected", () => setTimeout(() => { if(peer && !peer.destroyed) peer.reconnect() }, 1500));
  peer.on("error", e => {
    if(e.type === "peer-unavailable"){
      connecting = false;
      if(!everConnected){ teardown(); role=null; ui = {...ui, screen:"home", err:`Fandt ikke spillet ${code}. Tjek koden, og at værten har spillet åbent.`}; render(); return }
      ui.online = false; render(); scheduleReconnect();
      return;
    }
    if(["network","server-error","socket-error","disconnected"].includes(e.type)){ ui.online=false; render(); scheduleReconnect() }
  });
}

function connectHost(){
  if(!peer || peer.destroyed || connecting) return;
  if(peer.disconnected){ peer.reconnect(); scheduleReconnect(); return }
  connecting = true;
  const c = peer.connect(PREFIX + ui.code.toLowerCase(), {reliable:true});
  const timeout = setTimeout(() => { if(!c.open){ connecting=false; try{c.close()}catch(e){} scheduleReconnect() } }, 9000);
  c.on("open", () => {
    clearTimeout(timeout); connecting = false;
    hostConn = c; everConnected = true; lastHostMsg = Date.now(); ui.online = true;
    store.set(SAVE_LAST, ui.code);
    c.send({t:"hello", id:myId, name:me.name, emoji:me.emoji});
    keepAwake();
  });
  c.on("data", d => {
    lastHostMsg = Date.now();
    if(!d || typeof d !== "object") return;
    if(d.t === "state" && d.s){ state = d.s; ui.screen = "game"; ui.online = true; render() }
    if(d.t === "closed"){ store.del(SAVE_LAST); teardown(); role=null; state=null; ui={...ui, screen:"home", err:"Værten har lukket spillet."}; render() }
    if(d.t === "kicked"){ store.del(SAVE_LAST); teardown(); role=null; state=null; ui={...ui, screen:"home", err:"Du blev fjernet fra spillet."}; render() }
  });
  c.on("close", () => { if(hostConn === c){ hostConn = null; ui.online = false; render(); scheduleReconnect() } });
  c.on("error", () => {});
}
function scheduleReconnect(){
  if(role !== "guest" || guestTimer) return;
  guestTimer = setTimeout(() => { guestTimer = null; if(role === "guest" && !(hostConn && hostConn.open)) connectHost() }, 2500);
}
setInterval(() => {
  if(role !== "guest") return;
  if(hostConn && hostConn.open){
    try{ hostConn.send({t:"ping"}) }catch(e){}
    if(Date.now() - lastHostMsg > 14000){ try{ hostConn.close() }catch(e){} hostConn = null; ui.online = false; render(); scheduleReconnect() }
  }
}, 4000);

function send(msg){ if(hostConn && hostConn.open) try{ hostConn.send(msg) }catch(e){} }

/* ---- handling fra denne telefon ---- */
function act(v){
  const r = state && state.round; if(!r) return;
  buzz(15);
  if(role === "host") hostAct(myId, r.n, v);
  else {
    if(r.type === "hot" && (v === "truth" || v === "dare")) r.pick = v;
    else if(!(r.type === "duel" && (v === "lose" || v === "tie"))) r.answers[myId] = v;
    send({t:"act", n:r.n, v}); render();
  }
}

/* ============================================================
   MINISPIL — tidtagning sker lokalt på hver telefon
   ============================================================ */
let mg = {n:-1};
function clearMg(){ (mg.timers || []).forEach(clearTimeout) }
function mgLater(fn, ms){ const n = mg.n; mg.timers.push(setTimeout(() => { if(mg.n === n) fn() }, ms)) }
function ensureMg(r){
  if(mg.n === r.n) return;
  clearMg();
  mg = {n:r.n, type:r.type, phase:"count", start:performance.now() + 3000, timers:[]};
  if(r.answers[myId] !== undefined){ mg.phase = "done"; mg.score = r.answers[myId]; return }
  mgLater(render, 1000); mgLater(render, 2000);
  mgLater(() => beginMg(r), 3000);
}
function beginMg(r){
  if(mg.phase !== "count") return;
  mg.t0 = performance.now();
  if(r.type === "reflex"){
    mg.phase = "wait";
    mgLater(() => { if(mg.phase === "wait"){ mg.phase = "go"; mg.t0 = performance.now(); buzz(60); render() } }, r.delay);
  }
  if(r.type === "tap"){ mg.phase = "play"; mg.taps = 0; mgLater(() => finishMg(mg.taps), 5000) }
  if(r.type === "stopwatch"){ mg.phase = "play"; mgLater(() => { if(mg.phase === "play") finishMg(7000) }, 12000) }
  if(r.type === "math"){ mg.phase = "play"; mg.qi = 0; mg.wrong = 0; mgLater(() => { if(mg.phase === "play") finishMg(60000) }, 45000) }
  buzz(30); render();
}
function finishMg(score){
  if(mg.phase === "done") return;
  mg.phase = "done"; mg.score = score; clearMg(); mg.timers = [];
  act(score); render();
}
function mgTap(){
  const r = state && state.round;
  if(!r || state.phase !== "round" || mg.n !== r.n) return;
  if(r.type === "reflex"){
    if(mg.phase === "wait") finishMg(-1);
    else if(mg.phase === "go") finishMg(Math.round(performance.now() - mg.t0));
  }
  if(r.type === "tap" && mg.phase === "play"){ mg.taps++; const el = $("#tapn"); if(el) el.textContent = mg.taps }
  if(r.type === "stopwatch" && mg.phase === "play") finishMg(Math.round(Math.abs(performance.now() - mg.t0 - 5000)));
}
function mathAnswer(v){
  const r = state && state.round;
  if(!r || r.type !== "math" || mg.phase !== "play") return;
  const q = r.qs[mg.qi];
  if(+v !== q.a){ mg.wrong++; buzz([40,40,40]); toast("Forkert! +3 sek.") } else buzz(15);
  mg.qi++;
  if(mg.qi >= r.qs.length) finishMg(Math.round(performance.now() - mg.t0 + mg.wrong*3000));
  else render();
}
(function loop(){
  if(mg.phase === "play" && mg.t0){
    const e = performance.now() - mg.t0;
    if(mg.type === "tap"){ const el = $("#tapleft"); if(el) el.textContent = dk(Math.max(0,(5000-e)/1000),1) }
    if(mg.type === "stopwatch"){ const el = $("#sw"); if(el) el.textContent = e < 1500 ? dk(e/1000,2) : "?,??" }
    if(mg.type === "math"){ const el = $("#mt"); if(el) el.textContent = dk(e/1000,1) + " s" }
  }
  requestAnimationFrame(loop);
})();
function fmtScore(type, v){
  if(type === "reflex") return v < 0 ? "For tidligt" : v + " ms";
  if(type === "tap") return v + " tryk";
  if(type === "stopwatch") return "±" + dk(v/1000,2) + " s";
  if(type === "math") return dk(v/1000,1) + " s";
  return v;
}

/* Hold skærmen tændt */
let wakeLock = null;
async function keepAwake(){
  try{ if("wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null) } }catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "visible" || !role) return;
  keepAwake();
  if(peer && !peer.destroyed && peer.disconnected) peer.reconnect();
  if(role === "guest" && !(hostConn && hostConn.open)) scheduleReconnect();
});

function eyebrow(r, extra){ return `<div class="eyebrow"><span class="t">Runde ${r.n}${extra?" · "+extra:""}</span><span class="t">${tar(sipsBase())} pr. straf</span></div>` }

function progress(r){
  const on = state.players.filter(p => p.online);
  const done = on.filter(p => r.answers[p.id] !== undefined).length;
  return `<div class="label">${done} af ${on.length} er færdige</div>

}
function hostControls(r, withReveal){

function vsBlock(r, res){

function roundView(){
  const r = state.round, T = TYPES[r.type], S = sipsBase();

  if(r.type === "duel"){
    const amA = r.a === myId, amB = r.b === myId, inDuel = amA || amB;
    const opp = amA ? r.b : r.a, bet = r.answers[myId];
    const bettors = state.players.filter(p => p.online && p.id !== r.a && p.id !== r.b);
    return `${eyebrow(r)}
      <article class="card duel"><div class="kind"><span>${T.kind}</span>${chili(r.lvl)}</div>
        ${vsBlock(r)}
        <h2 class="prompt sm">${esc(r.text)}</h2></article>
      ${inDuel ? `<p class="hint">Du dyster mod <b>${nameOf(opp)}</b>. Taberen drikker ${tar(S*2)}. Vær ærlig, når I er færdige:</p>
        <div class="choices two">
          <button class="choice tall" data-act="lose"><span class="em">😩</span>Jeg tabte</button>
          <button class="choice tall" data-act="tie"><span class="em">🤝</span>Uafgjort</button></div>`
      : `<div class="label">Hvem vinder? Gætter du forkert, drikker du ${tar(S)}</div>
        <div class="choices two">
          <button class="choice tall" data-act="a" aria-pressed="${bet==="a"}"><span class="em">${emojiOf(r.a)}</span>${nameOf(r.a)}</button>
          <button class="choice tall" data-act="b" aria-pressed="${bet==="b"}"><span class="em">${emojiOf(r.b)}</span>${nameOf(r.b)}</button></div>`}
      ${bettors.length ? `<div class="label">${bettors.filter(p => r.answers[p.id]).length} af ${bettors.length} har gættet</div>` : ""}
      ${role === "host" ? `<div class="judge"><div class="label">Dommer: hvem vandt?</div>
        <div class="row"><button class="btn small" data-a="hostact" data-v="win:a">${nameOf(r.a)}</button><button class="btn small" data-a="hostact" data-v="win:b">${nameOf(r.b)}</button></div>
        <button class="btn small ghost" data-a="hostact" data-v="tie">Uafgjort</button></div>` : ""}
      ${hostControls(r, false)}`;
  }

  if(r.type === "hot"){
    const isT = r.target === myId, t = nameOf(r.target);
    if(!r.pick) return `${eyebrow(r)}
      <article class="card hot"><div class="kind"><span>${T.kind}</span></div>
        <div class="who">${isT ? "Det er dig i stolen!" : `${emojiOf(r.target)} ${t} er i stolen`}</div>
        <h2 class="prompt">${isT ? "Sandhed eller konsekvens?" : `${t} vælger…`}</h2></article>
      ${isT ? `<div class="choices two">
          <button class="choice hotpick" data-act="truth">Sandhed</button>
          <button class="choice hotpick" data-act="dare">Konsekvens</button></div>
          <p class="hint">Du ser kortet, når du har valgt. Siger du nej bagefter, drikker du ${tar(S*2)}.</p>`
        : role === "host" ? `<p class="hint">Hvis ${t} ikke kan trykke, kan du vælge for dem:</p><div class="row"><button class="btn small" data-a="hostact" data-v="truth">Sandhed</button><button class="btn small" data-a="hostact" data-v="dare">Konsekvens</button></div>` : `<p class="waiting">Venter på ${t}…</p>`}
      ${hostControls(r, false)}`;
    const isTruth = r.pick === "truth", l = isTruth ? r.tl : r.dl;
    return `${eyebrow(r)}
      <article class="card hot"><div class="kind"><span>${isTruth ? "Sandhed" : "Konsekvens"}</span>${chili(l)}</div>
        <div class="who">${isT ? "Din tur:" : `${emojiOf(r.target)} ${t}:`}</div>
        <h2 class="prompt sm">${esc(isTruth ? r.truth : r.dare)}</h2></article>
      ${isT ? `<div class="choices two">
          <button class="choice tall" data-act="done"><span class="em">😈</span>${isTruth ? "Svaret" : "Klaret"}</button>
          <button class="choice tall" data-act="drank"><span class="em">🍺</span>Drik ${tar(S*2)}</button></div>`
        : role === "host" ? `<div class="judge"><div class="label">Dommer</div><div class="row"><button class="btn small" data-a="hostact" data-v="done">${t} klarede det</button><button class="btn small" data-a="hostact" data-v="drank">${t} drak</button></div></div>`
        : `<p class="waiting">${t} ${isTruth ? "svarer" : "gør det"} eller drikker ${tar(S*2)}.</p>`}
      ${hostControls(r, false)}`;
  }

  if(r.type === "vote"){
    const mine = r.answers[myId];
    return `${eyebrow(r)}
      <article class="card vote"><div class="kind"><span>${T.kind}</span>${chili(r.lvl)}</div><h2 class="prompt">${esc(r.text)}</h2></article>
      <div class="label">Stem på én · flest stemmer drikker ${tar(S)}</div>
      <div class="voters">${state.players.map(p => `<button class="choice" data-act="${esc(p.id)}" aria-pressed="${mine===p.id}"><span class="em">${esc(p.emoji)}</span>${esc(p.name)}</button>`).join("")}</div>
      ${progress(r)}${hostControls(r, true)}`;
  }

  if(T.game){
    ensureMg(r);
    const rules = {
      reflex:"Tryk, så snart feltet bliver grønt. Trykker du for tidligt, drikker du.",
      tap:"Tryk så mange gange som muligt på 5 sekunder.",
      stopwatch:"Stop uret på præcis 5,00 sekunder. Tallene forsvinder efter 1,5 sekund.",
      math:"Tre regnestykker. Hurtigst vinder. Hvert forkert svar koster 3 sekunder."
    }[r.type];
    let pad;
    if(mg.phase === "count"){
      const c = Math.max(1, Math.ceil((mg.start - performance.now())/1000));
      pad = `<div class="pad"><div class="big">${c}</div><p>${esc(rules)}</p></div>`;
    } else if(mg.phase === "done"){
      pad = `<div class="pad"><div class="big" style="font-size:44px">${fmtScore(r.type, mg.score)}</div><p>Venter på de andre…</p></div>`;
    } else if(r.type === "reflex"){
      pad = mg.phase === "wait" ? `<div class="pad wait" data-mg="1"><div class="big">Vent…</div><p>Ikke endnu!</p></div>`
        : `<div class="pad go" data-mg="1"><div class="big">TRYK!</div></div>`;
    } else if(r.type === "tap"){
      pad = `<div class="pad play" data-mg="1"><div class="big" id="tapn">${mg.taps}</div><p>TRYK! TRYK! TRYK! · <span id="tapleft">5,0</span> s</p></div>`;
    } else if(r.type === "stopwatch"){
      pad = `<div class="pad play" data-mg="1"><div class="big" id="sw">0,00</div><p>Tryk ved 5,00</p></div>`;
    } else if(r.type === "math"){
      const q = r.qs[mg.qi];
      pad = `<div class="pad"><p>${mg.qi+1} af ${r.qs.length} · <span id="mt">0,0 s</span></p><div class="mathq">${esc(q.q)}</div>
        <div class="mathopts">${q.opts.map(o => `<button data-mq="${o}">${o}</button>`).join("")}</div></div>`;
    }
    return `${eyebrow(r, "Minispil")}
      <div class="eyebrow"><span class="drinkhead" style="font-size:26px;margin:0">${T.kind}</span></div>
      ${pad}
      <p class="hint">Bedst vinder et 🏆. Dårligst drikker ${tar(S)}.</p>
      ${progress(r)}${hostControls(r, true)}`;
  }
  return "";
}

    `<div class="res drink"><span class="e">${emojiOf(d.id)}</span><span class="n">${nameOf(d.id)}${d.id===myId?" (dig)":""}</span><span class="v">${tar(d.s)}</span></div>`).join("")}</div>`;

function revealView(){
  const r = state.round, T = TYPES[r.type], res = r.reveal, S = sipsBase();
  let card = "", detail = "";
  if(r.type === "duel"){
    const w = res.winner === "a" ? r.a : res.winner === "b" ? r.b : null;
    card = `<article class="card duel"><div class="kind"><span>${T.kind}</span>${chili(r.lvl)}</div>${vsBlock(r, res)}
      <h2 class="prompt">${w ? `${nameOf(w)} vandt!` : "Uafgjort!"}</h2></article>`;
    if(res.right.length || res.wrong.length) detail = `<div class="split">
      <div class="col"><h4>Gættede rigtigt</h4><div class="names">${res.right.map(nameOf).join(", ") || "Ingen"}</div></div>
      <div class="col"><h4>Gættede forkert</h4><div class="names">${res.wrong.map(nameOf).join(", ") || "Ingen"}</div></div></div>`;
  }
  if(r.type === "hot"){
    const isTruth = r.pick === "truth";
    card = `<article class="card hot"><div class="kind"><span>${isTruth?"Sandhed":"Konsekvens"}</span>${chili(isTruth?r.tl:r.dl)}</div>
      <div class="who">${emojiOf(r.target)} ${nameOf(r.target)}:</div><h2 class="prompt sm">${esc(isTruth ? r.truth : r.dare)}</h2></article>`;
    if(res.choice === "done") detail = `<div class="drinkhead">${nameOf(r.target)} turde! +1 🏆</div>`;
  }
  if(r.type === "vote"){
    card = `<article class="card vote"><div class="kind"><span>${T.kind}</span>${chili(r.lvl)}</div><h2 class="prompt">${esc(r.text)}</h2></article>`;
    const total = res.tally.reduce((a,[,c]) => a + c, 0) || 1;
    detail = `<div class="label">Stemmer</div><div class="result">${res.tally.map(([id,c]) => `<div class="res"><span class="e">${emojiOf(id)}</span><span class="n">${nameOf(id)}<div class="bar"><i style="width:${Math.round(c/total*100)}%"></i></div></span><span class="v">${c}</span></div>`).join("")}</div>`;
  }
  if(T.game){
    const A = r.answers, best = res.win[0];
    card = `<article class="card game"><div class="kind"><span>${T.kind}</span></div>
      <h2 class="prompt">${best ? `${nameOf(best)} vandt!` : "Ingen gennemførte"}</h2>
      ${best ? `<div class="who">${fmtScore(r.type, A[best])} · må dele ${tar(S)} ud</div>` : ""}</article>`;
    detail = `<div class="label">Resultater</div><div class="result">${[
      ...res.order.map((id,i) => `<div class="res ${i===0?"win":""}"><span class="e">${emojiOf(id)}</span><span class="n">${i+1}. ${nameOf(id)}</span><span class="v">${fmtScore(r.type, A[id])}</span></div>`),
      ...res.early.map(id => `<div class="res"><span class="e">${emojiOf(id)}</span><span class="n">${nameOf(id)}</span><span class="v">For tidligt</span></div>`),
      ...res.asleep.map(id => `<div class="res"><span class="e">${emojiOf(id)}</span><span class="n">${nameOf(id)}</span><span class="v">Sov</span></div>`)
    ].join("")}</div>`;
  }
  if(r.type === "chaos"){
    card = `<article class="card chaos"><div class="kind"><span>${T.kind}</span>${chili(r.lvl)}</div><h2 class="prompt sm">${richText(r.text)}</h2></article>`;
  }
  const showDrinks = !(r.type === "hot" && res.choice === "done") && !(r.type === "chaos" && !res.drink.length);
  return `<div class="eyebrow"><span class="t">Runde ${r.n} · Resultat</span></div>
    ${card}${showDrinks ? drinkList(res) : ""}${detail}${nextBtn()}`;
}

function board(){
  const sorted = [...state.players].sort((a,b) => (b.wins||0) - (a.wins||0) || a.sips - b.sips);
  return `<div class="board">${sorted.map((p,i) => `<div class="res ${p.id===myId?"drink":""}"><span class="rank">${i+1}</span><span class="e">${esc(p.emoji)}</span><span class="n">${esc(p.name)}${p.online?"":" · offline"}</span><span class="v">🏆 ${p.wins||0} · 🍺 ${p.sips}</span></div>`).join("")}</div>`;
}

function endView(){
  const byWins = [...state.players].sort((a,b) => (b.wins||0) - (a.wins||0) || a.sips - b.sips);
  const bySips = [...state.players].sort((a,b) => b.sips - a.sips);
  const pod = (s, i, f) => s[i] ? `<div class="p p${i+1}"><div class="e">${esc(s[i].emoji)}</div><div class="nm">${esc(s[i].name)}</div><div class="s">${f(s[i])}</div></div>` : `<div></div>`;
  const total = state.players.reduce((a,p) => a + p.sips, 0);
  return `<header class="hero" style="padding-top:8px"><h1 class="logo" style="font-size:60px">Tak for i aften!</h1></header>
    <section class="panel"><div class="label">Aftenens mester · flest sejre</div>
      <div class="podium">${pod(byWins,1,p=>"🏆"+(p.wins||0))}${pod(byWins,0,p=>"🏆"+(p.wins||0))}${pod(byWins,2,p=>"🏆"+(p.wins||0))}</div></section>
    <section class="panel"><div class="label">Aftenens tørstigste</div>
      <div class="podium">${pod(bySips,1,p=>p.sips)}${pod(bySips,0,p=>p.sips)}${pod(bySips,2,p=>p.sips)}</div>
      <p class="hint">${state.n} runder · ${tar(total)} i alt</p></section>
    <section class="panel"><div class="label">Stilling</div>${board()}</section>
    ${role === "host" ? `<div class="stickybottom"><button class="btn primary" data-a="again">Spil igen med samme hold</button><button class="btn ghost" data-a="close">Luk spillet</button></div>`
      : `<button class="btn ghost" data-a="close">Forlad spillet</button>`}`;
}

function menuView(){
  const isHost = role === "host";
  return `<div class="scrim" data-a="menu"></div>
  <div class="sheet" role="dialog" aria-label="Menu"><div class="sheet-in">
    <div class="eyebrow"><span class="label">Stilling</span><span class="label">Kode ${esc(state.code)}</span></div>
    ${board()}
    ${isHost ? `<div class="label">Tår pr. straf</div>${picker(LEVELS,"intensity","level",true)}<div class="label">Krydderi</div>${picker(SPICES,"spice","spice",true,"hot")}` : ""}
    ${isHost && state.phase==="round" ? `<button class="btn small" data-a="skip">Spring runden over</button>` : ""}
    ${isHost && state.phase!=="end" && state.phase!=="lobby" ? `<button class="btn small" data-a="end">Afslut og vis resultat</button>` : ""}
    <button class="btn small ghost" data-a="close">${isHost?"Luk spillet for alle":"Forlad spillet"}</button>
    <button class="btn small" data-a="menu">Tilbage</button>
  </div></div>`;
}

/* ============================================================
   INPUT
   ============================================================ */
function readHomeInputs(){
  const n = $("#name"); if(n){ me.name = clean(n.value, 16); store.set("skaal-name", me.name) }
  store.set("skaal-emoji", me.emoji);
}
document.addEventListener("pointerdown", e => {
  if(e.target.closest("[data-mg]")){ e.preventDefault(); mgTap() }
});
document.addEventListener("click", e => {
  const em = e.target.closest("[data-emoji]");
  if(em){ readHomeInputs(); me.emoji = em.dataset.emoji; store.set("skaal-emoji", me.emoji); document.querySelectorAll("[data-emoji]").forEach(b => b.setAttribute("aria-pressed", b.dataset.emoji === me.emoji)); return }
  const mq = e.target.closest("[data-mq]");
  if(mq){ mathAnswer(mq.dataset.mq); return }
  const ac = e.target.closest("[data-act]");
  if(ac){ act(ac.dataset.act); return }
  const b = e.target.closest("[data-a]"); if(!b) return;
  const a = b.dataset.a, v = b.dataset.v;
  if(a === "host" || a === "join" || a === "rejoin" || a === "resume"){
    readHomeInputs();
    if(!me.name){ ui.err = "Skriv dit navn først."; ui.code = clean($("#code")?.value, 4).toUpperCase(); renderHome(); $("#name")?.focus(); return }
    if(typeof Peer !== "function"){ ui.err = "Kunne ikke hente netværksmodulet. Tjek internetforbindelsen."; renderHome(); return }
    if(a === "host"){ state = null; return hostGame() }
    if(a === "resume"){ try{ const s = JSON.parse(store.get(SAVE_HOST)); state = s.state; return hostGame(s.state) }catch(err){ state = null; return hostGame() } }
    const code = (a === "rejoin" ? store.get(SAVE_LAST) : clean($("#code")?.value, 4)).toUpperCase();
    if(!/^[A-Z]{4}$/.test(code)){ ui.err = "Koden er 4 bogstaver."; renderHome(); return }
    return joinGame(code);
  }
  if(a === "cancel"){ teardown(); role=null; state=null; ui={...ui, screen:"home"}; return render() }
  if(a === "menu"){ ui.menu = !ui.menu; return render() }
  if(a === "close") return closeGame();
  if(a === "copy"){
    const url = joinUrl();
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast("Link kopieret"), () => toast(url)); else toast(url);
    return;
  }
  if(a === "share"){ navigator.share({title:"Skål!", text:`Kom med i Skål! Kode: ${state.code}`, url:joinUrl()}).catch(()=>{}); return }
  hostCmd(a, v);
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.id === "code") $('[data-a="join"]')?.click();
});
document.addEventListener("input", e => {
  if(e.target.id === "code"){ const p = e.target.selectionStart; e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g,""); try{e.target.setSelectionRange(p,p)}catch(_){} }
});

render();
</script>
</body>
</html>
