<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#23101B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skål!">
<title>Skål!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: én kolonne, telefon-først. Topbar med kode + egne tår/sejre, bannere for hændelser/missioner, et stort kort pr. runde. */
:root{
  --bg:#23101B;        /* aubergine bodega-mørke */
  --bg2:#33172A;
  --line:#4A2440;
  --foam:#FFF3E2;      /* ølskum */
  --ink:#23101B;
  --amber:#FFB020;     /* pilsner */
  --pink:#FF5C8A;
  --teal:#3DD6C0;
  --sky:#6EC1FF;
  --violet:#A98BFF;
  --red:#FF4D3D;
  --green:#2FD36B;
  --muted:#C9A9B8;
  --display:"Bagel Fat One","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:22px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--foam);font-family:var(--body);font-size:16px}
body{min-height:100dvh;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}

.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:16px;min-height:100dvh}
.wrap.game{padding-top:calc(env(safe-area-inset-top,0px) + 72px)}

/* Topbar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.topbar-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-weight:800;font-size:14px;letter-spacing:.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip .k{color:var(--muted);font-weight:600;letter-spacing:.04em;font-size:11px;text-transform:uppercase}
.spacer{flex:1}
.iconbtn{width:44px;height:44px;flex:none;border-radius:14px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.offline-banner{background:var(--red);color:#fff;text-align:center;font-weight:800;padding:8px 12px;border-radius:14px;font-size:14px}

/* Bannere: hændelse og hemmelig mission */
.banner{border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.banner .top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800}
.banner .top .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.banner .txt{font-weight:800;font-size:17px;line-height:1.3}
.banner.event{background:var(--amber);color:var(--ink)}
.banner.mission{background:var(--bg2);border:2px dashed var(--amber)}
.tbar{height:6px;border-radius:3px;background:rgba(0,0,0,.18);overflow:hidden}
.banner.mission .tbar{background:var(--line)}
.tbar i{display:block;height:100%;background:currentColor;transition:width .2s linear}
.timer{font-family:var(--display);font-variant-numeric:tabular-nums}

/* Hero */
.hero{padding-top:24px;text-align:center;position:relative}
.logo{font-family:var(--display);font-size:clamp(72px,24vw,120px);line-height:.9;margin:0;color:var(--amber);text-shadow:0 6px 0 #8A4A00,0 10px 30px rgba(255,176,32,.25);transform:rotate(-4deg);font-weight:400}
.logo small{display:block;font-family:var(--body);font-weight:800;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);text-shadow:none;margin-top:18px;transform:rotate(4deg)}
.bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bubbles i{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(255,243,226,.35);animation:rise 6s linear infinite}
@keyframes rise{to{transform:translateY(-240px);opacity:0}}
@media (prefers-reduced-motion:reduce){.bubbles{display:none}*{animation:none!important;transition:none!important}}

/* Paneler & felter */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field{width:100%;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--bg);font-size:18px;font-weight:600}
.field:focus{border-color:var(--amber);outline:none}
.field.code{text-transform:uppercase;letter-spacing:.4em;text-align:center;font-family:var(--display);font-size:28px;padding:12px}
.emojis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.emojis button{aspect-ratio:1;min-width:0;padding:0;border-radius:12px;font-size:24px;background:var(--bg);border:2px solid transparent}
.emojis button[aria-pressed="true"]{border-color:var(--amber);background:#4a2a1a}
.photorow{display:flex;align-items:center;gap:10px}
.photorow .btn{width:auto;flex:1;cursor:pointer}
.avatar-lg{width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:38px;background:var(--bg);border:2px solid var(--amber);overflow:hidden}
.avatar-lg img{width:100%;height:100%;object-fit:cover}
img.av{width:1.15em;height:1.15em;border-radius:50%;object-fit:cover;vertical-align:-.22em;display:inline-block;background:var(--line)}
.err{color:var(--pink);font-weight:600;margin:0}
.hint{color:var(--muted);font-size:14px;line-height:1.45;margin:0}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:14px 18px;border-radius:18px;font-weight:800;font-size:18px;background:var(--bg2);border:2px solid var(--line);width:100%;text-align:center;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--amber);color:var(--ink);border-color:var(--amber);box-shadow:0 5px 0 #8A4A00}
.btn.primary:active{box-shadow:0 1px 0 #8A4A00;transform:translateY(4px)}
.btn.go{background:var(--green);color:var(--ink);border-color:var(--green)}
.btn.ghost{background:transparent}
.btn.small{min-height:44px;font-size:15px;padding:10px 14px;border-radius:14px}
.btn.ink{background:var(--ink);color:var(--foam);border-color:var(--ink)}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

/* Lobby */
.bigcode{font-family:var(--display);font-size:clamp(56px,18vw,84px);letter-spacing:.12em;text-align:center;line-height:1;color:var(--foam)}
.qr{display:grid;place-items:center}
.qr img{width:180px;height:180px;border-radius:14px;background:#fff;padding:8px;image-rendering:pixelated}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pl{position:relative;background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:12px 6px 10px;text-align:center;min-width:0}
.pl .em{font-size:34px;line-height:1.1}
.pl .nm{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .sub{font-size:12px;color:var(--muted)}
.pl.off{opacity:.45}
.pl.me{border-color:var(--amber)}
.pl .x{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:10px;color:var(--muted);font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding:5px;border-radius:16px}
.seg button{padding:10px 4px;border-radius:12px;font-weight:800;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--ink)}
.seg.hot button[aria-pressed="true"]{background:var(--pink);color:var(--ink)}
.seg button small{display:block;font-weight:600;font-size:11px;opacity:.85}
.consent{border-left:4px solid var(--pink);padding:2px 0 2px 12px}
.toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tog{padding:10px 12px;border-radius:14px;background:var(--bg);border:2px solid var(--line);text-align:left;font-weight:800;font-size:14px;line-height:1.25;min-width:0}
.tog small{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:2px}
.tog[aria-pressed="true"]{border-color:var(--amber)}
.tog[aria-pressed="false"]{opacity:.4;text-decoration:line-through}
.tog:disabled{cursor:default}

/* Spilkort */
.eyebrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.eyebrow .t{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.card{--c:var(--amber);background:var(--c);color:var(--ink);border-radius:28px;padding:24px 22px 26px;box-shadow:0 8px 0 color-mix(in srgb,var(--c) 45%,#000);position:relative;overflow:hidden;animation:deal .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes deal{from{transform:translateY(30px) rotate(-3deg);opacity:0}}
.card .kind{font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.75;display:flex;justify-content:space-between;gap:8px}
.card .prompt{font-family:var(--display);font-size:clamp(25px,7.2vw,34px);line-height:1.12;margin:10px 0 0;text-wrap:balance;font-weight:400}
.card .prompt.sm{font-size:clamp(21px,6vw,27px)}
.card .who{font-weight:800;font-size:18px;margin-top:6px}
.card p{margin:10px 0 0;font-weight:600;line-height:1.4}
.card b{font-weight:800}
.card.amber{--c:var(--amber)}
.card.pink{--c:var(--pink)}
.card.violet{--c:var(--violet)}
.card.teal{--c:var(--teal)}
.card.sky{--c:var(--sky)}
.card.red{--c:var(--red)}
.card.chaos{--c:var(--foam);background:repeating-linear-gradient(-45deg,var(--foam) 0 22px,#FFE7C2 22px 44px)}
.card.secret{--c:var(--bg2);color:var(--foam);border:2px dashed var(--amber);box-shadow:none}
.card.secret .kind{color:var(--amber);opacity:1}
.chili{letter-spacing:-.1em}

.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:14px;text-align:center}
.vs .side{min-width:0}
.vs .e{font-size:44px;line-height:1}
.vs .nm{font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs .x{font-family:var(--display);font-size:30px;transform:rotate(-8deg)}
.vs .side.win .nm::after{content:" 🏆"}
.vs .side.lose{opacity:.55}

/* Minispil-flade */
.pad{min-height:300px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:24px;user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer;background:var(--bg2);border:2px solid var(--line);color:var(--foam);position:relative}
.pad .big{font-family:var(--display);font-size:clamp(48px,16vw,76px);line-height:1;font-variant-numeric:tabular-nums}
.pad p{margin:0;font-weight:600;opacity:.85}
.pad.wait{background:var(--red);border-color:var(--red);color:#fff}
.pad.go{background:var(--green);border-color:var(--green);color:var(--ink)}
.pad.play{background:var(--teal);border-color:var(--teal);color:var(--ink)}
.pad.play:active{transform:scale(.985)}

.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{min-height:64px;padding:14px;border-radius:18px;background:var(--bg2);border:2px solid var(--line);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;line-height:1.2;min-width:0}
.choice .em{font-size:26px}
.choice[aria-pressed="true"]{background:var(--foam);color:var(--ink);border-color:var(--foam)}
.choice.tall{min-height:110px;flex-direction:column}
.choice.hotpick{min-height:130px;font-family:var(--display);font-weight:400;font-size:26px}
.choice:disabled{opacity:.4}
.voters{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}

.progress{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dot{display:inline-flex;align-items:center;gap:4px;padding:4px 10px 4px 6px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:600}
.dot.ok{background:#1f3a2c;border-color:var(--green)}
.dot .e{font-size:16px}

/* Ord, bogstaver, tastatur, kæde, MFK */
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{font-family:var(--display);font-size:26px;background:var(--foam);color:var(--ink);padding:6px 14px;border-radius:14px}
.peek{min-height:120px;border-radius:22px;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;padding:16px;background:var(--bg2)}
.peek .w{font-family:var(--display);font-size:clamp(36px,11vw,52px);line-height:1}
.board-letters{display:flex;flex-wrap:wrap;gap:12px 16px;justify-content:center;padding:6px 0}
.lw{display:flex;gap:3px}
.lc{width:24px;height:34px;border-bottom:3px solid currentColor;display:grid;place-items:center;font-family:var(--display);font-size:21px;line-height:1}
.abc{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.abc button{height:46px;border-radius:10px;background:var(--foam);color:var(--ink);font-weight:800;font-size:18px;min-width:0;padding:0}
.abc button:disabled{opacity:.2}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{height:58px;border-radius:14px;background:var(--bg2);border:2px solid var(--line);font-family:var(--display);font-size:26px}
.keypad button.ok{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.kpdisp{font-family:var(--display);font-size:44px;text-align:center;min-height:64px;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:6px;font-variant-numeric:tabular-nums}
.eq{font-family:var(--display);font-size:clamp(34px,11vw,48px);text-align:center;line-height:1.1}
.chain{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.step .e{font-size:24px}
.step .n{flex:1;min-width:0;font-weight:800}
.step .n small{display:block;font-weight:600;color:var(--muted)}
.step.done{opacity:.5}
.step.now{border-color:var(--green);background:#1f3a2c}
.step.me .n::after{content:" · dig";color:var(--amber)}
.mfk{display:flex;flex-direction:column;gap:8px}
.mfkrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.mfkrow .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mfkbtns{display:flex;gap:6px}
.mfkbtns button{min-width:56px;height:44px;border-radius:12px;background:var(--bg);border:2px solid var(--line);font-weight:800;font-size:13px;padding:0 8px}
.mfkbtns button[aria-pressed="true"]{background:var(--pink);color:var(--ink);border-color:var(--pink)}
.counter{font-family:var(--display);font-size:72px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}

/* Resultat */
.result{display:flex;flex-direction:column;gap:8px}
.res{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--bg2);border:1px solid var(--line)}
.res .e{font-size:28px}
.res .n{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .v{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted);white-space:nowrap}
.res.drink{background:var(--foam);color:var(--ink);border-color:var(--foam)}
.res.drink .v{color:var(--ink)}
.res.win{border-color:var(--amber)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--amber)}
.drinkhead{font-family:var(--display);font-size:30px;color:var(--amber);margin:4px 0 0;font-weight:400}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split .col{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:12px;min-width:0}
.split .col h4{margin:0 0 8px;font-size:14px;line-height:1.3}
.names{font-size:14px;color:var(--muted);line-height:1.5;word-break:break-word}

.waiting{color:var(--muted);text-align:center;font-weight:600;padding:8px;margin:0}
.hostbar{display:flex;gap:8px;flex-wrap:wrap}
.hostbar .btn{flex:1 1 140px}
.judge{border:1px dashed var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.stickybottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}

/* Menu-ark */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-top:2px solid var(--line);border-radius:26px 26px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:85dvh;overflow:auto;animation:up .2s ease-out}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(100%)}}
.board{display:flex;flex-direction:column;gap:6px}
.board .res .rank{font-family:var(--display);width:26px;text-align:center;color:var(--muted)}

.podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;align-items:end;text-align:center}
.podium .p{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 6px 6px;padding:12px 4px;min-width:0}
.podium .p .e{font-size:38px}
.podium .p .nm{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .p .s{font-family:var(--display);font-size:24px;color:var(--amber)}
.podium .p1{padding-block:26px;border-color:var(--amber)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:var(--foam);color:var(--ink);font-weight:800;padding:12px 18px;border-radius:14px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.4);text-align:center}
.foot{font-size:12px;color:var(--muted);text-align:center;opacity:.8;margin:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>

function hostGame(resume){
  teardown();
  role = "host"; clockOffset = 0;
  ui = {...ui, screen:"connecting", err:"", menu:false};
  render();
  const code = resume ? resume.code : makeCode();
  let tries = 0;
  const start = () => {
    peer = new Peer(PREFIX + code.toLowerCase(), {debug:0});
    peer.on("open", () => {
      if(!state || state.code !== code) state = resume || newState(code);
      const mine = player(myId);
      if(mine){mine.name=me.name;mine.emoji=me.emoji;mine.photo=me.photo;mine.online=true}
      state.players.forEach(p => { if(p.id!==myId) p.online=false });
      ui.screen = "game"; ui.online = true;
      commit(); keepAwake();
    });
    peer.on("connection", conn => {
      conn.on("data", d => onGuestData(conn, d));
      conn.on("close", () => dropConn(conn));
      conn.on("error", () => dropConn(conn));
    });
    peer.on("disconnected", () => { ui.online=false; render(); setTimeout(() => { if(peer && !peer.destroyed) peer.reconnect() }, 1500) });
    peer.on("error", e => {
      if(e.type === "unavailable-id"){
        peer.destroy();
        if(resume && tries++ < 12){ setTimeout(start, 2500); return }   // den gamle forbindelse er ikke sluppet endnu
        if(!resume){ setTimeout(() => hostGame(), 100); return }
        ui = {...ui, screen:"home", err:"Koden er optaget. Start et nyt spil."}; role=null; render(); return;
      }
      if(e.type === "network" || e.type === "server-error" || e.type === "socket-error"){
        ui.online=false; render(); setTimeout(() => { if(peer && !peer.destroyed && peer.disconnected) peer.reconnect() }, 3000);

    });
  };

}

    else state.players.push({id,name,emoji,photo,sips:0,wins:0,online:true});

  const id = conn._pid; if(!id) return;

const lvl = c => Array.isArray(c) ? c[0] : c.l;
function pickCard(key, arr){
  const spice = state.spice;
  const ok = arr.map((_,i) => i).filter(i => lvl(arr[i]) <= spice);
  const used = state.used[key] = state.used[key] || [];
  let free = ok.filter(i => !used.includes(i));
  if(!free.length){ used.length = 0; free = ok }
  const top = free.filter(i => lvl(arr[i]) === spice);
  if(spice > 1 && top.length && Math.random() < 0.6) free = top;   // højere krydderi = flere af de stærke kort
  const i = pick(free);
  used.push(i); return arr[i];
}

function pickLeast(key, pool, k){
  const c = state.count[key] = state.count[key] || {};
  const chosen = shuffle([...pool]).sort((a,b) => (c[a.id]||0) - (c[b.id]||0)).slice(0,k);
  chosen.forEach(p => c[p.id] = (c[p.id]||0) + 1);
  return chosen;
}

function pickType(pool){
  const last = state.round && state.round.type;
  const opts = Object.entries(TYPES).filter(([t,T]) =>
    state.enabled[t] !== false && t !== last && pool.length >= T.min && (!T.can || T.can(pool)));
  if(!opts.length) return "chaos";
  const total = opts.reduce((a,[,T]) => a + T.w, 0);
  let x = Math.random() * total;
  for(const [t,T] of opts){ if((x -= T.w) <= 0) return t }
  return opts[0][0];
}

function giveNow(id, s, why){
  const list = withMate([{id, s}]);
  list.forEach(d => { const p = player(d.id); if(p) p.sips += d.s });
  const mate = list.find(d => d.mate);
  flash(`${why} ${player(id)?.name || "?"} drikker ${tar(s)}${mate ? ` (og makker ${player(mate.id)?.name} med)` : ""}.`);
}
function withMate(list){
  const b = state.buddy; if(!b) return list;
  const out = [...list];
  for(const d of list){
    const m = d.id === b.a ? b.b : d.id === b.b ? b.a : null;
    if(m && player(m) && !out.some(x => x.id === m)) out.push({id:m, s:d.s, mate:true});

  return out;
}

  if(!T.done || !T.done(r)) return;
  const n = r.n;
  setTimeout(() => { if(state.round && state.round.n === n && state.phase === "round") doReveal() }, 900);
}

function doReveal(){
  const r = state.round; if(!r || state.phase !== "round") return;
  applyReveal(r, TYPES[r.type].reveal(r));
}

function applyReveal(r, res){
  res.win = res.win || [];
  res.drink = withMate(res.drink || []);
  res.drink.forEach(d => { const p = player(d.id); if(p) p.sips += d.s });
  res.win.forEach(id => { const p = player(id); if(p) p.wins = (p.wins||0) + 1 });
  if(res.buddy) state.buddy = res.buddy;   // nye makkere gælder først fra næste runde
  r.reveal = res; state.phase = "reveal";
  commit();
}

/* Handlinger uden for runden: missioner og regelbrud */
function hostSide(pid, v){
  if(v.k === "mission"){
    const m = state.missions.find(x => x.id === v.id && x.agent === pid); if(!m) return;
    state.missions = state.missions.filter(x => x !== m);
    const a = player(m.agent), t = player(m.target);
    if(v.ok){
      if(a) a.wins = (a.wins||0) + 1;
      giveNow(m.target, S()*2, `Hemmelig mission klaret! ${a?.name} fik kaldt ${t?.name} for "${m.name}" uden at blive opdaget.`);
    } else giveNow(m.agent, S()*2, `${a?.name} blev afsløret i at kalde ${t?.name} for "${m.name}".`);
    commit();
  }
  if(v.k === "broke"){
    const ev = state.event, p = player(v.id);
    if(!ev || Date.now() > ev.end || !p) return;
    ev.calls = ev.calls || {};
    if(Date.now() - (ev.calls[p.id] || 0) < 8000) return;   // samme person kan ikke straffes to gange på 8 sek
    ev.calls[p.id] = Date.now();
    giveNow(p.id, S(), `Regelbrud!`);
    commit();
  }
}

function hostCmd(cmd, arg){
  if(role !== "host" || !state) return;
  if(cmd === "start" || cmd === "next") startRound();
  if(cmd === "reveal") doReveal();
  if(cmd === "skip"){ state.round = null; startRound() }
  if(cmd === "level"){ state.intensity = +arg; commit() }
  if(cmd === "spice"){ state.spice = +arg; commit() }
  if(cmd === "toggle" && TYPES[arg]){
    const on = Object.keys(TYPES).filter(t => state.enabled[t] !== false);
    if(state.enabled[arg] !== false && on.length <= 1) return toast("Mindst ét spil skal være slået til.");
    state.enabled[arg] = state.enabled[arg] === false; commit();
  }
  if(cmd === "end"){ state.phase = "end"; state.round = null; state.event = null; commit() }
  if(cmd === "again"){ state.players.forEach(p => { p.sips = 0; p.wins = 0 }); Object.assign(state, {phase:"lobby", round:null, n:0, count:{}, buddy:null, missions:[], event:null}); commit() }
  if(cmd === "kick") removePlayer(arg);
  if(cmd === "hostact") hostAct(myId, state.round && state.round.n, arg);
  ui.menu = false; render();
}

const actj = obj => `data-actj="${esc(JSON.stringify(obj))}"`;

function progress(ids, isDone){
  const list = ids.map(player).filter(Boolean);

  return `<div class="label">${n} af ${list.length} er færdige</div>
    <div class="progress">${list.map(p => `<span class="dot ${isDone(p.id)?"ok":""}"><span class="e">${avatar(p)}</span>${esc(p.name)}</span>`).join("")}</div>`;
}
function tallyVotes(A){
  const tally = {}; Object.values(A).forEach(id => { if(player(id)) tally[id] = (tally[id]||0) + 1 });
  return Object.entries(tally).sort((a,b) => b[1]-a[1]);
}
function tallyView(tally){
  const total = tally.reduce((a,[,c]) => a + c, 0) || 1;
  return `<div class="label">Stemmer</div><div class="result">${tally.map(([id,c]) => `<div class="res"><span class="e">${emojiOf(id)}</span><span class="n">${nameOf(id)}<div class="bar"><i style="width:${Math.round(c/total*100)}%"></i></div></span><span class="v">${c}</span></div>`).join("")}</div>`;
}

}
const onlineIds = () => online().map(p => p.id);
function countdown(startHost, dur){
  const until = L(startHost) + dur;
  return `<div class="timer" style="font-size:40px;text-align:center" data-until="${until}">${fmtLeft(Math.max(0, until - Date.now()))}</div>
    <div class="tbar"><i data-bar="${until}" data-dur="${dur}" style="width:100%"></i></div>`;
}

/* ---- minispil (lokal tidtagning på hver telefon) ---- */
function gameReveal(r, lower, perPlayer){
  const A = r.answers;
  const early = Object.keys(A).filter(id => A[id] < 0);
  const valid = Object.keys(A).filter(id => A[id] >= 0).sort((a,b) => lower ? A[a]-A[b] : A[b]-A[a]);
  const asleep = onlineIds().filter(id => A[id] === undefined);
  const sips = {};
  const add = (id, s) => sips[id] = (sips[id]||0) + s;
  early.forEach(id => add(id, S())); asleep.forEach(id => add(id, S()));
  if(valid.length >= 2){
    const worst = A[valid[valid.length-1]];
    if(worst !== A[valid[0]]) valid.filter(id => A[id] === worst).forEach(id => add(id, S()));
  }
  if(perPlayer) valid.forEach(id => { const s = perPlayer(A[id]); if(s) add(id, s) });
  return {order:valid, early, asleep, drink:Object.entries(sips).map(([id,s]) => ({id, s})), win: valid.length ? [valid[0]] : []};
}
function gameResult(r, res, color, extra){
  const A = r.answers, best = res.win[0], T = TYPES[r.type];
  return card(color, T.name, `<h2 class="prompt">${best ? `${nameOf(best)} vandt!` : "Ingen gennemførte"}</h2>
      ${best ? `<div class="who">${fmtScore(r, A[best])}${extra ? " · " + extra(A[best]) : ""}</div>` : ""}`) +
    `<div class="label">Resultater</div><div class="result">${[
      ...res.order.map((id,i) => `<div class="res ${i===0?"win":""}"><span class="e">${emojiOf(id)}</span><span class="n">${i+1}. ${nameOf(id)}</span><span class="v">${fmtScore(r, A[id])}</span></div>`),
      ...res.early.map(id => `<div class="res"><span class="e">${emojiOf(id)}</span><span class="n">${nameOf(id)}</span><span class="v">For tidligt</span></div>`),
      ...res.asleep.map(id => `<div class="res"><span class="e">${emojiOf(id)}</span><span class="n">${nameOf(id)}</span><span class="v">Sov</span></div>`)
    ].join("")}</div>`;
}
function fmtScore(r, v){
  if(r.type === "reflex") return v < 0 ? "For tidligt" : v + " ms";
  if(r.type === "tap") return v + " tryk";
  if(r.type === "stop") return v >= 9999 ? "Nåede ikke" : "±" + dk(v/1000,2) + " s";
  return v;
}
const gameAct = max => (r, pid, v) => {
  if(typeof v !== "number" || !isFinite(v) || r.answers[pid] !== undefined) return false;
  r.answers[pid] = (r.type === "reflex" && v < 0) ? -1 : Math.max(0, Math.min(Math.round(v), max));
  return true;
};
const allOnlineAnswered = r => { const ids = onlineIds(); return ids.length > 0 && ids.every(id => r.answers[id] !== undefined) };

          : (team || isHost() ? `<button class="btn primary" data-act="start">Start 30 sekunder</button>` : `<p class="waiting">Venter på, at de starter…</p>`));
    },
    result(r, res){
      return card("sky", "Fem ting til fælles", `<div class="who">${who(r.chooser)} & ${r.partner ? who(r.partner) : "?"}</div>

  /* ---------- Idé 7: Drukmakker ---------- */
  buddy:{
    name:"Drukmakker", desc:"To drikker altid sammen", w:0.7, min:2,

      do { pair = shuffle([...pool]).slice(0,2) } while(tries++ < 10 && state.buddy && pool.length > 2 &&

      r.a = pair[0].id; r.b = pair[1].id; r.prev = state.buddy;

        <p>Skål sammen nu! Hver gang den ene drikker, drikker den anden med, indtil næste makkerskifte.</p>`);

  /* ---------- Idé 9: Saml sætningen ---------- */
  sentence:{
    name:"Saml sætningen", desc:"Hvert sit hemmelige ord", w:0.9, min:2,
    start(r, pool){
      const c = pickCard("sentence", SENTENCES); r.sentence = c[1]; r.lvl = c[0];
      const words = r.sentence.split(" "), ids = shuffle(pool.map(p => p.id));
      r.words = {}; ids.forEach(id => r.words[id] = []);
      words.forEach((w,i) => r.words[ids[i % ids.length]].push(w));
      Object.values(r.words).forEach(shuffle);
      r.count = words.length; r.wrong = {};
    },
    act(r, pid, v){
      if(v === "giveup" && pid === myId){ r.giveup = true; return "reveal" }
      if(!isObj(v) || typeof v.guess !== "string") return false;
      if(norm(v.guess) === norm(r.sentence)){ r.solvedBy = pid; return "reveal" }
      r.wrong[pid] = (r.wrong[pid]||0) + 1;
      giveNow(pid, 1, `Forkert sætning: "${clean(v.guess,80)}".`);
      return true;
    },
    reveal(r){
      if(r.solvedBy) return {win:[r.solvedBy], drink:[]};
      return {drink:onlineIds().map(id => ({id, s:S()}))};
    },
    view(r){
      const mine = r.words[myId] || [];
      const wrongs = Object.values(r.wrong).reduce((a,b) => a+b, 0);
      return card("sky", "Saml sætningen", `<h2 class="prompt sm">Sætningen har ${r.count} ord. Hver af jer har en del af den.</h2>
          <p>Giv hinanden ledetråde, men sig ikke jeres ord direkte. Når I tror, I har den, skriver én den ind. Hvert forkert gæt koster gætteren 1 tår.</p>`, chili(r.lvl)) +
        `<div class="label">${mine.length ? "Dine hemmelige ord" : "Dine ord"}</div>` +
        (mine.length ? `<div class="words">${mine.map(w => `<span class="word">${esc(w)}</span>`).join("")}</div>` : `<p class="hint">Du har intet ord. Du er detektiv: hjælp de andre med at samle sætningen.</p>`) +
        `<input class="field" id="sent-${r.n}" autocomplete="off" placeholder="Skriv hele sætningen" maxlength="120">
        <button class="btn primary" data-a="sentsend">Lås op</button>
        ${wrongs ? `<p class="hint">Forkerte gæt indtil nu: ${wrongs}</p>` : ""}
        ${isHost() ? `<button class="btn small ghost" data-a="hostact" data-v="giveup">Giv op (alle drikker ${tar(S())})</button>` : ""}`;
    },
    result(r){
      return card("sky", "Saml sætningen", `<div class="who">${r.solvedBy ? `${who(r.solvedBy)} låste den op!` : "I gav op"}</div><h2 class="prompt">"${esc(r.sentence)}"</h2>`, chili(r.lvl));
    }
  },

  /* ---------- Idé 10: Find impostoren ---------- */
  impostor:{
    name:"Find impostoren", desc:"Én har et andet ord", w:1.2, min:3,
    start(r, pool){
      const c = pickCard("impostor", IMPOSTOR); r.cat = c[1]; r.crew = c[2]; r.fake = c[3]; r.lvl = c[0];
      r.impostor = pick(pool).id; r.players = pool.map(p => p.id);
    },
    act(r, pid, v){ if(player(v) && v !== pid && r.players.includes(pid)){ r.answers[pid] = v; return true } return false },
    opt: () => true,
    done: r => { const ids = onlineIds().filter(id => r.players.includes(id)); return ids.length > 0 && ids.every(id => r.answers[id]) },
    reveal(r){
      const tally = tallyVotes(r.answers);
      const top = tally[0], caught = top && top[0] === r.impostor && (!tally[1] || tally[1][1] < top[1]);
      if(caught) return {caught, tally, drink:[{id:r.impostor, s:S()*2}, ...Object.keys(r.answers).filter(id => r.answers[id] !== r.impostor && id !== r.impostor).map(id => ({id, s:S()}))]};
      return {caught, tally, win:[r.impostor], drink:r.players.filter(id => id !== r.impostor && player(id)).map(id => ({id, s:S()}))};

    view(r){

      const word = r.impostor === myId ? r.fake : r.crew;
      if(peek.n !== r.n) peek = {n:r.n, on:false};
      return card("violet", "Find impostoren", `<h2 class="prompt sm">Alle har fået et ord. Én af jer har et lidt andet ord.</h2>
          <p>Beskriv på skift jeres ord uden at sige det. Stem så på, hvem I tror er impostoren. Bliver impostoren fanget, drikker de ${tar(S()*2)}. Ellers drikker alle andre ${tar(S())}.</p>`, chili(r.lvl)) +
        `<button class="peek" data-a="peek">${peek.on ? `<span><span class="label">Dit ord</span><br><span class="w">${esc(word)}</span></span>` : `<span class="hint">Tryk for at se dit ord<br>(skjul det for sidemanden)</span>`}</button>
        <div class="label">Hvem er impostoren?</div>` +
        voteButtons(r.players.filter(id => id !== myId && player(id)), r.answers[myId]) +
        progress(onlineIds().filter(id => r.players.includes(id)), id => r.answers[id]);
    },
    result(r, res){
      return card("violet", "Find impostoren", `<div class="who">Impostoren var ${who(r.impostor)}</div>
          <h2 class="prompt">${res.caught ? "Fanget! 🕵️" : "Slap væk! 😈"}</h2>
          <p>Holdets ord: <b>${esc(r.crew)}</b> · Impostorens ord: <b>${esc(r.fake)}</b></p>`, chili(r.lvl)) + tallyView(res.tally);
    }
  },

  /* ---------- Idé 11: Gæt bogstavet ---------- */
  letters:{
    name:"Gæt bogstavet", desc:"Afslør den hemmelige sætning", w:0.9, min:2,
    start(r, pool){
      const c = pickCard("letters", PHRASES); r.phrase = c[1]; r.lvl = c[0];
      r.order = shuffle(pool.map(p => p.id)); r.turn = 0; r.used = []; r.winner = null;
    },
    cur: r => r.order[r.turn],
    next(r){ for(let i=1;i<=r.order.length;i++){ const j = (r.turn+i) % r.order.length; if(player(r.order[j])?.online){ r.turn = j; return } } },
    act(r, pid, v){
      const T = TYPES.letters;
      if(v === "skipturn" && pid === myId && !r.winner){ T.next(r); return true }
      if(r.winner){
        if(pid === r.winner && isObj(v) && player(v.victim) && v.victim !== pid){ r.victim = v.victim; return "reveal" }
        return false;
      }
      if(pid !== T.cur(r) || !isObj(v)) return false;
      if(typeof v.l === "string" && ABC.includes(v.l) && !r.used.includes(v.l)){
        r.used.push(v.l);
        if(r.phrase.includes(v.l)){
          if([...r.phrase].every(ch => !ABC.includes(ch) || r.used.includes(ch))) r.winner = pid;
        } else { giveNow(pid, 1, `Intet ${v.l}!`); T.next(r) }
        return true;
      }
      if(typeof v.full === "string"){
        if(norm(v.full) === norm(r.phrase)){ r.winner = pid; r.solvedFull = true; return true }
        giveNow(pid, S(), `Forkert gæt på hele sætningen.`); T.next(r); return true;
      }
      return false;
    },
    reveal(r){ return r.victim ? {win:[r.winner], drink:[{id:r.victim, s:S()*2}]} : {drink:[]} },
    board(r, all){
      return `<div class="board-letters">${r.phrase.split(" ").map(w => `<div class="lw">${[...w].map(ch => {
        const show = all || !ABC.includes(ch) || r.used.includes(ch);
        return `<span class="lc">${show ? esc(ch) : ""}</span>`}).join("")}</div>`).join("")}</div>`;
    },
    view(r){
      const T = TYPES.letters, cur = T.cur(r);
      let body = card("violet", "Gæt bogstavet", T.board(r, !!r.winner), chili(r.lvl));
      if(r.winner){
        if(r.winner === myId) return body + `<div class="drinkhead">Du løste den!</div><div class="label">Giv ${tar(S()*2)} til…</div>
          <div class="voters">${online().filter(p => p.id !== myId).map(p => `<button class="choice" ${actj({victim:p.id})}><span class="em">${avatar(p)}</span>${esc(p.name)}</button>`).join("")}</div>
          <p class="hint">Eller find på en alkoholfri straf til dem i stedet.</p>`;
        return body + `<p class="waiting">${nameOf(r.winner)} løste den og vælger, hvem der skal straffes…</p>`;
      }
      body += `<div class="label">Brugt: ${r.used.join(" ") || "ingen endnu"}</div>`;
      if(cur === myId) return body + `<div class="drinkhead" style="font-size:24px">Din tur! Forkert bogstav koster 1 tår.</div>
          <div class="abc">${ABC.map(ch => `<button ${actj({l:ch})} ${r.used.includes(ch)?"disabled":""}>${ch}</button>`).join("")}</div>
          <div class="row"><input class="field" id="full-${r.n}" autocomplete="off" placeholder="Gæt hele sætningen" maxlength="80"><button class="btn small" data-a="fullsend" style="flex:0 0 auto;width:auto">Gæt</button></div>
          <p class="hint">Gætter du forkert på hele sætningen, drikker du ${tar(S())}.</p>`;
      return body + `<p class="waiting">${who(cur)} gætter…</p>` +
        (isHost() ? `<button class="btn small ghost" data-a="hostact" data-v="skipturn">Spring ${gen(nameOf(cur))} tur over</button>` : "");
    },
    result(r){
      return card("violet", "Gæt bogstavet", TYPES.letters.board(r, true) + `<p>${who(r.winner)} løste den${r.solvedFull ? " i ét gæt" : ""} og gav ${tar(S()*2)} til ${nameOf(r.victim)}.</p>`, chili(r.lvl));
    }
  },

  /* ---------- Idé 12: Timingkæden ---------- */
  chain:{
    name:"Timingkæden", desc:"Samarbejd i den rigtige rækkefølge", w:0.8, min:2,
    start(r, pool){
      let order = shuffle(pool.map(p => p.id));
      if(order.length < 4) order = order.concat(shuffle([...order]));
      r.order = order; r.acts = order.map(() => pick(CHAIN_ACTIONS)); r.step = 0; r.started = null; r.fail = null;
    },
    timer(r){
      const n = r.n, step = r.step;
      setTimeout(() => {
        const q = state.round;
        if(q && q.n === n && state.phase === "round" && q.step === step && !q.fail){ q.fail = {id:q.order[step], why:"for langsom"}; doReveal() }
      }, step === 0 ? 6000 : 3500);
    },
    act(r, pid, v){
      if(v === "start" && pid === myId && !r.started){ r.started = Date.now(); TYPES.chain.timer(r); return true }
      if(v !== "tap" || !r.started || r.fail) return false;
      if(pid !== r.order[r.step]){ r.fail = {id:pid, why:"trykkede uden for tur"}; return "reveal" }
      r.step++;
      if(r.step >= r.order.length) return "reveal";
      TYPES.chain.timer(r); return true;
    },
    reveal(r){
      if(!r.fail && r.step >= r.order.length) return {drink:[]};
      if(!r.fail) r.fail = {id:r.order[r.step], why:"nåede ikke"};
      return {drink:[{id:r.fail.id, s:S()}, ...onlineIds().filter(id => id !== r.fail.id).map(id => ({id, s:1}))]};
    },
    list(r){
      return `<div class="chain">${r.order.map((id,i) => `<div class="step ${i < r.step ? "done" : i === r.step && r.started ? "now" : ""} ${id===myId?"me":""}">
        <span class="e">${i < r.step ? "✅" : emojiOf(id)}</span><span class="n">${i+1}. ${nameOf(id)}<small>${esc(r.acts[i])}</small></span></div>`).join("")}</div>`;
    },
    view(r){
      const myTurn = r.started && r.order[r.step] === myId;
      return card("sky", "Timingkæden", `<h2 class="prompt sm">Gør jeres handling og tryk, når det er jeres tur. Én ad gangen, i rækkefølge.</h2>
          <p>Hvert led har ${dk(3.5,1)} sekunder. Trykker nogen uden for tur, eller går der for lang tid, ryger kæden. Så drikker synderen ${tar(S())} og alle andre 1.</p>`) +
        (!r.started ? (isHost() ? `<button class="btn primary" data-a="hostact" data-v="start">Start kæden</button>` : `<p class="waiting">Venter på, at ${nameOf(state.hostId)} starter kæden…</p>`)
          : `<button class="btn ${myTurn ? "go" : ""}" data-act="tap" style="min-height:96px;font-size:22px">${myTurn ? `${esc(r.acts[r.step])}, TRYK NU!` : "Vent på din tur…"}</button>`) +
        TYPES.chain.list(r);
    },
    result(r){
      const ok = !r.fail;
      return card("sky", "Timingkæden", `<h2 class="prompt">${ok ? "Hele kæden holdt! 🎉" : `Kæden røg ved ${nameOf(r.fail.id)}`}</h2>${ok ? "<p>Ingen drikker. I er et hold.</p>" : `<p>${nameOf(r.fail.id)} ${esc(r.fail.why)}.</p>`}`) + TYPES.chain.list(r);
    }
  },

  /* ---------- Idé 13: Regnestykke under pres ---------- */
  mathpress:{
    name:"Regnestykke under pres", desc:"Flere fejl end spillere = straf", w:0.9, min:1,
    gen(){
      const k = rnd(4);
      if(k === 0){ const a = 3+rnd(10), b = 3+rnd(7), c = 5+rnd(36); return {q:`${a} × ${b} + ${c}`, a:a*b+c} }
      if(k === 1){ const a = 4+rnd(9), b = 4+rnd(6), c = 2+rnd(Math.min(15, a*b-2)); return {q:`${a} × ${b} − ${c}`, a:a*b-c} }
      if(k === 2){ const a = 2+rnd(11), b = 2+rnd(11), c = 2+rnd(5); return {q:`(${a} + ${b}) × ${c}`, a:(a+b)*c} }
      const a = 12+rnd(49), b = 12+rnd(49), c = 5+rnd(Math.min(40, a+b-6)); return {q:`${a} + ${b} − ${c}`, a:a+b-c};
    },
    start(r, pool){ r.probs = {}; r.err = {}; r.solved = {}; pool.forEach(p => r.probs[p.id] = TYPES.mathpress.gen()) },
    act(r, pid, v){
      if(!isObj(v) || typeof v.g !== "number" || !r.probs[pid] || r.solved[pid]) return false;
      if(v.g === r.probs[pid].a) r.solved[pid] = true;
      else r.err[pid] = (r.err[pid]||0) + 1;
      return true;
    },
    done: r => { const ids = onlineIds().filter(id => r.probs[id]); return ids.length > 0 && ids.every(id => r.solved[id]) },
    reveal(r){
      const ids = Object.keys(r.probs).filter(id => player(id)?.online || r.solved[id]);
      const E = Object.values(r.err).reduce((a,b) => a+b, 0), P = ids.length, excess = Math.min(10, Math.max(0, E - P));
      return {E, P, excess, drink: excess ? onlineIds().map(id => ({id, s:excess})) : []};
    },
    view(r){
      const prob = r.probs[myId], ids = onlineIds().filter(id => r.probs[id]);
      const E = Object.values(r.err).reduce((a,b) => a+b, 0);
      if(kp.n !== r.n) kp = {n:r.n, v:"", seen:0};
      const myErr = r.err[myId] || 0;
      if(myErr > kp.seen){ kp.seen = myErr; setTimeout(() => { toast("Forkert! Prøv igen."); buzz([40,40,40]) }) }
      let mine;
      if(!prob) mine = `<p class="hint">Du kom med midt i runden. Hep på de andre.</p>`;
      else if(r.solved[myId]) mine = `<div class="drinkhead" style="text-align:center">Løst! ✅</div><p class="waiting">Venter på de andre…</p>`;
      else mine = `<div class="eq">${esc(prob.q)} = ?</div><div class="kpdisp">${esc(kp.v) || "&nbsp;"}</div>
        <div class="keypad">${["1","2","3","4","5","6","7","8","9","del","0","ok"].map(k => `<button data-kp="${k}" class="${k==="ok"?"ok":""}">${k==="del"?"⌫":k==="ok"?"OK":k}</button>`).join("")}</div>`;
      return card("teal", "Regnestykke under pres", `<h2 class="prompt sm">Alle skal løse deres eget regnestykke.</h2>
          <p>Fejl tæller for hele bordet. Bliver der flere fejl end spillere (${ids.length}), drikker alle 1 tår pr. ekstra fejl.</p>`) +
        `<div class="label">Fejl indtil nu: ${E} af ${ids.length} tilladte</div>` + mine +
        progress(ids, id => r.solved[id]);
    },
    result(r, res){
      return card("teal", "Regnestykke under pres", `<h2 class="prompt">${res.E} fejl, ${res.P} spillere</h2>
          <p>${res.excess ? `${res.excess} fejl for meget. Alle drikker ${tar(res.excess)}.` : "Under grænsen. Ingen fælles straf!"}</p>`) +
        `<div class="result">${Object.keys(r.probs).filter(id => player(id)).map(id => `<div class="res"><span class="e">${emojiOf(id)}</span><span class="n">${nameOf(id)}</span><span class="v">${r.solved[id] ? "✅" : "❌"} ${r.err[id]||0} fejl</span></div>`).join("")}</div>`;
    }
  },

  /* ---------- Konkurrencer fra før ---------- */
  duel:{
    name:"Duel", desc:"1 mod 1, de andre gætter", w:2, min:2,
    start(r, pool){
      const [a,b] = pickLeast("duel", pool, 2);
      let c = pickCard("duel", DUELS);
      for(let i=0; i<6 && (a.id === myId || b.id === myId) && /værten/.test(c[1]); i++) c = pickCard("duel", DUELS);  // værten kan ikke dømme sin egen duel
      r.a = a.id; r.b = b.id; r.text = c[1]; r.lvl = c[0];
    },
    act(r, pid, v){
      if(v === "lose" && (pid === r.a || pid === r.b)){ r.winner = pid === r.a ? "b" : "a"; return "reveal" }
      if(v === "tie" && (pid === r.a || pid === r.b || pid === myId)){ r.winner = "tie"; return "reveal" }
      if((v === "win:a" || v === "win:b") && pid === myId){ r.winner = v.slice(4); return "reveal" }
      if((v === "a" || v === "b") && pid !== r.a && pid !== r.b){ r.answers[pid] = v; return true }
      return false;
    },
    opt: v => v === "a" || v === "b",
    reveal(r){
      const w = r.winner || "tie", A = r.answers;
      const res = {winner:w, right:Object.keys(A).filter(id => w !== "tie" && A[id] === w), wrong:Object.keys(A).filter(id => w !== "tie" && A[id] !== w)};
      if(w === "tie") res.drink = [{id:r.a, s:S()}, {id:r.b, s:S()}];
      else { res.drink = [{id: w === "a" ? r.b : r.a, s:S()*2}, ...res.wrong.map(id => ({id, s:S()}))]; res.win = [w === "a" ? r.a : r.b] }
      return res;
    },
    vs(r, res){
      const cls = s => !res || res.winner === "tie" ? "" : res.winner === s ? "win" : "lose";
      return `<div class="vs"><div class="side ${cls("a")}"><div class="e">${emojiOf(r.a)}</div><div class="nm">${nameOf(r.a)}</div></div><div class="x">VS</div>
        <div class="side ${cls("b")}"><div class="e">${emojiOf(r.b)}</div><div class="nm">${nameOf(r.b)}</div></div></div>`;
    },
    view(r){
      const inDuel = r.a === myId || r.b === myId, bet = r.answers[myId];
      return card("pink", "Duel", TYPES.duel.vs(r) + `<h2 class="prompt sm">${esc(r.text)}</h2>`, chili(r.lvl)) +

          <div class="choices two"><button class="choice tall" data-act="lose"><span class="em">😩</span>Jeg tabte</button>
          <button class="choice tall" data-act="tie"><span class="em">🤝</span>Uafgjort</button></div>`
        : `<div class="label">Hvem vinder? Forkert gæt koster ${tar(S())}</div><div class="choices two">
          <button class="choice tall" data-act="a" aria-pressed="${bet==="a"}"><span class="em">${emojiOf(r.a)}</span>${nameOf(r.a)}</button>
          <button class="choice tall" data-act="b" aria-pressed="${bet==="b"}"><span class="em">${emojiOf(r.b)}</span>${nameOf(r.b)}</button></div>`) +
        judge("Dommer: hvem vandt?", [["win:a", nameOf(r.a)], ["win:b", nameOf(r.b)], ["tie","Uafgjort"]]);
    },
    result(r, res){
      const w = res.winner === "a" ? r.a : res.winner === "b" ? r.b : null;
      return card("pink", "Duel", TYPES.duel.vs(r, res) + `<h2 class="prompt">${w ? `${nameOf(w)} vandt!` : "Uafgjort!"}</h2>`, chili(r.lvl)) +
        (res.right.length || res.wrong.length ? `<div class="split"><div class="col"><h4>Gættede rigtigt</h4><div class="names">${res.right.map(nameOf).join(", ") || "Ingen"}</div></div>
          <div class="col"><h4>Gættede forkert</h4><div class="names">${res.wrong.map(nameOf).join(", ") || "Ingen"}</div></div></div>` : "");
    }
  },

  hot:{
    name:"Sandhed eller konsekvens", desc:"Gør det, eller drik dobbelt", w:1.5, min:1,
    start(r, pool){
      r.target = pickLeast("hot", pool, 1)[0].id;
      const t = pickCard("truth", TRUTHS), d = pickCard("dare", DARES);
      Object.assign(r, {truth:t[1], tl:t[0], dare:d[1], dl:d[0], pick:null});
    },
    act(r, pid, v){
      if(pid !== r.target && pid !== myId) return false;
      if((v === "truth" || v === "dare") && !r.pick){ r.pick = v; return true }
      if((v === "done" || v === "drank") && r.pick){ r.choice = v; return "reveal" }
      return false;
    },
    reveal: r => r.choice === "done" ? {win:[r.target], drink:[]} : {drink:[{id:r.target, s:S()*2}]},
    view(r){
      const isT = r.target === myId, t = nameOf(r.target);
      if(!r.pick) return card("violet", "Sandhed eller konsekvens", `<div class="who">${isT ? "Det er dig i stolen!" : `${who(r.target)} er i stolen`}</div>
          <h2 class="prompt">${isT ? "Sandhed eller konsekvens?" : `${t} vælger…`}</h2>`) +
        (isT ? `<div class="choices two"><button class="choice hotpick" data-act="truth">Sandhed</button><button class="choice hotpick" data-act="dare">Konsekvens</button></div>
          <p class="hint">Du ser kortet, når du har valgt. Siger du nej bagefter, drikker du ${tar(S()*2)}.</p>` : judge("Vælg for dem", [["truth","Sandhed"],["dare","Konsekvens"]]));
      const isTruth = r.pick === "truth";
      return card("violet", isTruth ? "Sandhed" : "Konsekvens", `<div class="who">${isT ? "Din tur:" : `${who(r.target)}:`}</div><h2 class="prompt sm">${esc(isTruth ? r.truth : r.dare)}</h2>`, chili(isTruth ? r.tl : r.dl)) +
        (isT ? `<div class="choices two"><button class="choice tall" data-act="done"><span class="em">😈</span>${isTruth ? "Svaret" : "Klaret"}</button>
          <button class="choice tall" data-act="drank"><span class="em">🍺</span>Drik ${tar(S()*2)}</button></div>`
          : `<p class="waiting">${t} ${isTruth ? "svarer" : "gør det"} eller drikker ${tar(S()*2)}.</p>` + judge("Dommer", [["done",`${t} klarede det`],["drank",`${t} drak`]]));
    },
    result(r){
      const isTruth = r.pick === "truth";
      return card("violet", isTruth ? "Sandhed" : "Konsekvens", `<div class="who">${who(r.target)}:</div><h2 class="prompt sm">${esc(isTruth ? r.truth : r.dare)}</h2>
        ${r.choice === "done" ? `<p>${nameOf(r.target)} turde! +1 🏆</p>` : ""}`, chili(isTruth ? r.tl : r.dl));
    }
  },

  reflex:{
    name:"Hurtigste finger", desc:"Tryk når skærmen er grøn", w:0.8, min:1,
    start(r){ r.delay = 1500 + rnd(4000); r.limit = 3000 + r.delay + 6000 },
    act: gameAct(99999), done: allOnlineAnswered,
    reveal: r => gameReveal(r, true),
    result: (r,res) => gameResult(r, res, "teal", () => `må dele ${tar(S())} ud`)
  },
  tap:{
    name:"Tap-krig", desc:"Flest tryk på 5 sekunder", w:0.8, min:1,
    start(r){ r.limit = 3000 + 5000 + 5000 },
    act: gameAct(150), done: allOnlineAnswered,
    reveal: r => gameReveal(r, false),
    result: (r,res) => gameResult(r, res, "teal", () => `må dele ${tar(S())} ud`)
  },

  vote:{
    name:"Afstemning", desc:"Flest stemmer drikker", w:0.8, min:2,
    start(r){ const c = pickCard("vote", VOTES); r.text = c[1]; r.lvl = c[0] },
    act(r, pid, v){ if(player(v)){ r.answers[pid] = v; return true } return false },
    opt: () => true, done: allOnlineAnswered,
    reveal(r){
      const tally = tallyVotes(r.answers), max = tally.length ? tally[0][1] : 0;
      return {tally, drink: tally.filter(([,c]) => c === max && max > 0).map(([id]) => ({id, s:S()}))};
    },
    view(r){
      return card("amber", "Afstemning", `<h2 class="prompt">${esc(r.text)}</h2>`, chili(r.lvl)) +
        `<div class="label">Stem på én · flest stemmer drikker ${tar(S())}</div>` + voteButtons(state.players.map(p => p.id), r.answers[myId]) +
        progress(onlineIds(), id => r.answers[id]);
    },
    result: (r,res) => card("amber", "Afstemning", `<h2 class="prompt">${esc(r.text)}</h2>`, chili(r.lvl)) + tallyView(res.tally)
  },

  chaos:{
    name:"Kaoskort", desc:"Tilfældige kort", w:0.8, min:1,
    start(r, pool){
      const c = pickCard("chaos", CHAOS); r.lvl = c.l;
      const p = pick(pool); let drinkers = [], pName = p.name;
      if(c.who === "rand") drinkers = [p];
      if(c.who === "all") drinkers = pool;
      if(c.who === "least"){ const min = Math.min(...pool.map(x => x.sips)); drinkers = pool.filter(x => x.sips === min); pName = drinkers.map(x => x.name).join(" og ") }
      r.text = c.t.replace(/\{p\}/g, "\u0001" + pName + "\u0002").replace(/\{S\}/g, tar(S()));
      return {drink: drinkers.map(x => ({id:x.id, s:S()}))};
    },
    result: r => card("chaos", "Kaoskort", `<h2 class="prompt sm">${esc(r.text).replace(/\u0001(.*?)\u0002/g, "<b>$1</b>")}</h2>`, chili(r.lvl))
  }
};

/* ============================================================
   GÆST
   ============================================================ */
function joinGame(code){
  teardown();
  role = "guest"; state = null; lastJson = ""; lastFlash = null;
  ui = {...ui, screen:"connecting", err:"", code, menu:false};
  render();
  peer = new Peer({debug:0});
  peer.on("open", () => connectHost());
  peer.on("disconnected", () => setTimeout(() => { if(peer && !peer.destroyed) peer.reconnect() }, 1500));
  peer.on("error", e => {
    if(e.type === "peer-unavailable"){
      connecting = false;
      if(!everConnected){ teardown(); role=null; ui = {...ui, screen:"home", err:`Fandt ikke spillet ${code}. Tjek koden, og at værten har spillet åbent.`}; render(); return }
      ui.online = false; render(); scheduleReconnect();
      return;
    }
    if(["network","server-error","socket-error","disconnected"].includes(e.type)){ ui.online=false; render(); scheduleReconnect() }
  });
}

function connectHost(){
  if(!peer || peer.destroyed || connecting) return;
  if(peer.disconnected){ peer.reconnect(); scheduleReconnect(); return }
  connecting = true;
  const c = peer.connect(PREFIX + ui.code.toLowerCase(), {reliable:true});
  const timeout = setTimeout(() => { if(!c.open){ connecting=false; try{c.close()}catch(e){} scheduleReconnect() } }, 9000);
  c.on("open", () => {
    clearTimeout(timeout); connecting = false;
    hostConn = c; everConnected = true; lastHostMsg = Date.now(); ui.online = true;
    store.set(SAVE_LAST, ui.code);
    c.send({t:"hello", id:myId, name:me.name, emoji:me.emoji, photo:me.photo});
    keepAwake();
  });
  c.on("data", d => {
    lastHostMsg = Date.now();
    if(!isObj(d)) return;
    if(d.t === "state" && isObj(d.s)){
      if(typeof d.now === "number") clockOffset = Date.now() - d.now;
      const json = JSON.stringify(d.s);
      const wasOffline = !ui.online || ui.screen !== "game";
      ui.screen = "game"; ui.online = true;
      if(json === lastJson && !wasOffline) return;   // intet nyt: undgå at gentegne midt i en indtastning
      lastJson = json; state = d.s; render();
    }
    if(d.t === "closed"){ store.del(SAVE_LAST); teardown(); role=null; state=null; ui={...ui, screen:"home", err:"Værten har lukket spillet."}; render() }
    if(d.t === "kicked"){ store.del(SAVE_LAST); teardown(); role=null; state=null; ui={...ui, screen:"home", err:"Du blev fjernet fra spillet."}; render() }
  });
  c.on("close", () => { if(hostConn === c){ hostConn = null; ui.online = false; render(); scheduleReconnect() } });
  c.on("error", () => {});
}
function scheduleReconnect(){
  if(role !== "guest" || guestTimer) return;
  guestTimer = setTimeout(() => { guestTimer = null; if(role === "guest" && !(hostConn && hostConn.open)) connectHost() }, 2500);
}
setInterval(() => {
  if(role !== "guest") return;
  if(hostConn && hostConn.open){
    try{ hostConn.send({t:"ping"}) }catch(e){}
    if(Date.now() - lastHostMsg > 14000){ try{ hostConn.close() }catch(e){} hostConn = null; ui.online = false; render(); scheduleReconnect() }
  }
}, 4000);

function send(msg){ if(hostConn && hostConn.open) try{ hostConn.send(msg) }catch(e){} }

function closeGame(){
  if(role === "host"){
    guests.forEach(g => { try{ g.conn.send({t:"closed"}) }catch(e){} });
    store.del(SAVE_HOST);
  } else if(hostConn && hostConn.open){
    try{ hostConn.send({t:"leave"}) }catch(e){}
    store.del(SAVE_LAST);
  }
  setTimeout(() => { teardown(); state = null; role = null; ui = {screen:"home", err:"", code:"", menu:false, online:true, call:false}; render() }, 250);
}

function teardown(){
  clearTimeout(guestTimer); guestTimer = null;
  guests.forEach(g => { try{ g.conn.close() }catch(e){} }); guests.clear();
  if(hostConn) try{ hostConn.close() }catch(e){}
  hostConn = null;
  if(peer) try{ peer.destroy() }catch(e){}
  peer = null; everConnected = false; connecting = false;
  clearMg(); mg = {n:-1};
}

/* ---- handlinger fra denne telefon ---- */
function act(v){
  const r = state && state.round; if(!r) return;
  buzz(15);
  if(role === "host") return hostAct(myId, r.n, v);
  const T = TYPES[r.type];
  if(T.opt && T.opt(v)){ r.answers[myId] = v; render() }   // vis valget med det samme
  send({t:"act", n:r.n, v});
}
function side(v){
  buzz(15);
  if(role === "host") hostSide(myId, v); else send({t:"side", v});
}

/* ============================================================
   LOKALE MOTORER
   ============================================================ */
let mfkSel = {n:-1}, kp = {n:-1}, peek = {n:-1};
let mg = {n:-1};
const MG_TYPES = ["reflex","tap","stop"];
function clearMg(){ (mg.timers || []).forEach(clearTimeout) }
function mgLater(fn, ms){ const n = mg.n; mg.timers.push(setTimeout(() => { if(mg.n === n) fn() }, ms)) }
function ensureMg(r){
  if(mg.n === r.n) return;
  clearMg();
  mg = {n:r.n, type:r.type, phase:"count", start:performance.now() + 3000, timers:[]};
  if(r.answers[myId] !== undefined){ mg.phase = "done"; mg.score = r.answers[myId]; return }
  mgLater(render, 1000); mgLater(render, 2000);
  mgLater(() => beginMg(r), 3000);
}
function beginMg(r){
  if(mg.phase !== "count") return;
  mg.t0 = performance.now();
  if(r.type === "reflex"){
    mg.phase = "wait";
    mgLater(() => { if(mg.phase === "wait"){ mg.phase = "go"; mg.t0 = performance.now(); buzz(60); render() } }, r.delay);
  }
  if(r.type === "tap"){ mg.phase = "play"; mg.taps = 0; mgLater(() => finishMg(mg.taps), 5000) }
  if(r.type === "stop"){ mg.phase = "play"; mg.target = r.target; mgLater(() => { if(mg.phase === "play") finishMg(9999) }, r.target + 5000) }
  buzz(30); render();
}
function finishMg(score){
  if(mg.phase === "done") return;
  mg.phase = "done"; mg.score = score; clearMg(); mg.timers = [];
  act(score); render();
}
function mgTap(){
  const r = state && state.round;
  if(!r || state.phase !== "round" || mg.n !== r.n) return;
  if(r.type === "reflex"){
    if(mg.phase === "wait") finishMg(-1);
    else if(mg.phase === "go") finishMg(Math.round(performance.now() - mg.t0));
  }
  if(r.type === "tap" && mg.phase === "play"){ mg.taps++; const el = $("#tapn"); if(el) el.textContent = mg.taps }
  if(r.type === "stop" && mg.phase === "play") finishMg(Math.round(Math.abs(performance.now() - mg.t0 - r.target)));
}
function mgView(r){
  ensureMg(r);
  const rules = {
    reflex:"Tryk, så snart feltet bliver grønt. Trykker du for tidligt, drikker du.",
    tap:"Tryk så mange gange som muligt på 5 sekunder.",
    stop:`Stop uret på præcis ${dk(r.target/1000,2)} sekunder. Tallene forsvinder efter 1,5 sekund. Mere end 1 sekund ved siden af koster ${tar(S())}.`
  }[r.type];
  let pad;
  if(mg.phase === "count") pad = `<div class="pad"><div class="big">${Math.max(1, Math.ceil((mg.start - performance.now())/1000))}</div><p>${esc(rules)}</p></div>`;
  else if(mg.phase === "done") pad = `<div class="pad"><div class="big" style="font-size:44px">${fmtScore(r, mg.score)}</div><p>Venter på de andre…</p></div>`;
  else if(r.type === "reflex") pad = mg.phase === "wait" ? `<div class="pad wait" data-mg="1"><div class="big">Vent…</div><p>Ikke endnu!</p></div>` : `<div class="pad go" data-mg="1"><div class="big">TRYK!</div></div>`;
  else if(r.type === "tap") pad = `<div class="pad play" data-mg="1"><div class="big" id="tapn">${mg.taps}</div><p>TRYK! TRYK! TRYK! · <span id="tapleft">5,0</span> s</p></div>`;
  else if(r.type === "stop") pad = `<div class="pad play" data-mg="1"><p>Stop på ${dk(r.target/1000,2)}</p><div class="big" id="sw">0,00</div><p>Tryk når du tror, tiden er inde</p></div>`;
  return `<div class="drinkhead" style="font-size:26px;margin:0">${TYPES[r.type].name}</div>${pad}
    <p class="hint">Bedst vinder et 🏆. Dårligst drikker ${tar(S())}.</p>` + progress(onlineIds(), id => r.answers[id] !== undefined);
}
(function loop(){
  if(mg.phase === "play" && mg.t0){
    const e = performance.now() - mg.t0;
    if(mg.type === "tap"){ const el = $("#tapn"); const l = $("#tapleft"); if(l) l.textContent = dk(Math.max(0,(5000-e)/1000),1) }
    if(mg.type === "stop"){ const el = $("#sw"); if(el) el.textContent = e < 1500 ? dk(e/1000,2) : "?,??" }
  }
  requestAnimationFrame(loop);
})();
/* Nedtællinger på skærmen */
setInterval(() => {
  let rerender = false;
  document.querySelectorAll("[data-until]").forEach(el => {
    const left = +el.dataset.until - Date.now();
    el.textContent = fmtLeft(Math.max(0, left));
    if(left <= 0 && el.hasAttribute("data-rerender") && !el.dataset.fired){ el.dataset.fired = "1"; rerender = true }
  });
  document.querySelectorAll("[data-bar]").forEach(el => { el.style.width = Math.max(0, Math.min(100, (+el.dataset.bar - Date.now()) / +el.dataset.dur * 100)) + "%" });
  if(rerender) render();
}, 250);

/* Hold skærmen tændt */
let wakeLock = null;
async function keepAwake(){
  try{ if("wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null) } }catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "visible" || !role) return;
  keepAwake();
  if(peer && !peer.destroyed && peer.disconnected) peer.reconnect();
  if(role === "guest" && !(hostConn && hostConn.open)) scheduleReconnect();
});

  const keep = {}; let focus = null;
  app.querySelectorAll("input[id]").forEach(i => keep[i.id] = i.value);
  const ae = document.activeElement;
  if(ae && ae.tagName === "INPUT" && ae.id) focus = {id:ae.id, s:ae.selectionStart, e:ae.selectionEnd};

  if(ui.screen === "home") renderHome();
  else if(ui.screen === "connecting" || !state) renderConnecting();
  else renderGame();

  if(ui.screen !== "home") Object.entries(keep).forEach(([id,v]) => { const el = document.getElementById(id); if(el) el.value = v });

  if(state && state.flash && state.flash.id !== lastFlash){
    if(lastFlash !== null || role === "host") toast(state.flash.text, 4500);
    lastFlash = state.flash.id;
  }
}

}

function renderGame(){
  const mine = player(myId), b = state.buddy;
  const mate = b && (b.a === myId ? b.b : b.b === myId ? b.a : null);
  let body = "";
  if(state.phase === "lobby") body = lobbyView();
  else if(state.phase === "round") body = roundView();
  else if(state.phase === "reveal") body = revealView();
  else if(state.phase === "end") body = endView();

  app.innerHTML = `
  <div class="topbar"><div class="topbar-in">
    <span class="chip"><span class="k">Kode</span>${esc(state.code)}</span>
    ${mine ? `<span class="chip">🍺 ${mine.sips}</span><span class="chip">🏆 ${mine.wins||0}</span>` : ""}
    ${mate ? `<span class="chip" title="Din drukmakker">🤝 ${nameOf(mate)}</span>` : ""}
    <span class="spacer"></span>
    <button class="iconbtn" data-a="menu" aria-label="Menu og stilling">☰</button>
  </div></div>
  <div class="wrap game">
    ${!ui.online ? `<div class="offline-banner">${isHost() ? "Mistet forbindelsen. Prøver igen…" : "Mistet forbindelsen til værten. Prøver igen…"}</div>` : ""}
    ${banners()}
    ${body}
  </div>
  ${ui.menu ? menuView() : ""}
  ${ui.call ? callView() : ""}`;
  if(state.phase === "lobby" && isHost()) drawQR();
}

function playerTiles(withKick){
  return `<div class="players">${state.players.map(p => `
    <div class="pl ${p.online?"":"off"} ${p.id===myId?"me":""}">
      ${withKick && p.id!==myId ? `<button class="x" data-a="kick" data-v="${esc(p.id)}" aria-label="Fjern ${esc(p.name)}">✕</button>` : ""}
      <div class="em">${avatar(p)}</div><div class="nm">${esc(p.name)}</div>
      <div class="sub">${p.id===state.hostId?"Vært":p.online?"Klar":"Offline"}</div>
    </div>`).join("")}</div>`;
}
function picker(list, key, cmd, enabled, cls){
  return `<div class="seg ${cls||""}" role="group">${list.map(l => `<button ${enabled?"":"disabled"} data-a="${cmd}" data-v="${l.v}" aria-pressed="${state[key]===l.v}">${l.t}<small>${l.s}</small></button>`).join("")}</div>`;
}
function settings(enabled){
  return `<section class="panel">
    <div class="label">Tår pr. straf</div>${picker(LEVELS,"intensity","level",enabled)}
    <div class="label">Krydderi</div>${picker(SPICES,"spice","spice",enabled,"hot")}
    ${state.spice > 1 ? `<p class="hint consent">Du kan altid drikke ${tar(S()*2)} i stedet for en udfordring. Udfordringer med andre kræver, at de siger ja.</p>` : ""}
  </section>
  <section class="panel">
    <div class="eyebrow"><span class="label">Spil i rotationen</span><span class="label">${Object.keys(TYPES).filter(t => state.enabled[t] !== false).length} af ${Object.keys(TYPES).length}</span></div>
    <div class="toggles">${Object.entries(TYPES).map(([t,T]) => `<button class="tog" data-a="toggle" data-v="${t}" aria-pressed="${state.enabled[t] !== false}" ${enabled?"":"disabled"}>${T.name}<small>${T.desc}${T.min > 2 ? ` · min. ${T.min}` : ""}</small></button>`).join("")}</div>
  </section>`;
}
function joinUrl(){ return location.origin + location.pathname + "#" + state.code }

function lobbyView(){
  const n = state.players.length;
  if(!isHost()) return `
    <section class="panel" style="text-align:center"><div class="drinkhead">Du er med!</div><p class="hint">Venter på, at ${nameOf(state.hostId)} starter spillet.</p></section>
    <section class="panel"><div class="eyebrow"><span class="label">Spillere</span><span class="label">${n}</span></div>${playerTiles(false)}</section>
    ${settings(false)}`;
  const canLink = location.protocol.startsWith("http");
  return `
  <section class="panel" style="text-align:center">
    <div class="label">Spilkode</div>
    <div class="bigcode">${esc(state.code)}</div>
    ${canLink ? `<div class="qr" id="qr"></div>
    <div class="row"><button class="btn small" data-a="copy">Kopiér link</button>${navigator.share?`<button class="btn small" data-a="share">Del</button>`:""}</div>` : ""}
    <p class="hint">Bed de andre åbne Skål! og skrive koden eller scanne QR-koden.</p>
  </section>
  <section class="panel"><div class="eyebrow"><span class="label">Spillere</span><span class="label">${n}</span></div>${playerTiles(true)}</section>
  ${settings(true)}
  <div class="stickybottom"><button class="btn primary" data-a="start" ${n<2?"disabled":""}>${n<2?"Venter på spillere…":"Start spillet"}</button></div>`;
}

function drawQR(){
  const el = $("#qr"); if(!el || typeof qrcode !== "function") return;
  try{ const q = qrcode(0, "M"); q.addData(joinUrl()); q.make(); el.innerHTML = `<img alt="QR-kode til spillet" src="${q.createDataURL(6, 2)}">` }catch(e){}
}

function roundView(){
  const r = state.round, T = TYPES[r.type];
  const body = MG_TYPES.includes(r.type) ? mgView(r) : T.view ? T.view(r) : "";
  const force = isHost() && T.done && Object.keys(r.answers).length ? `<button class="btn small" data-a="reveal">Vis resultat nu</button>` : "";
  return `<div class="eyebrow"><span class="t">Runde ${r.n} · ${esc(T.name)}</span><span class="t">${tar(S())} pr. straf</span></div>
    ${body}
    ${isHost() ? `<div class="hostbar">${force}<button class="btn small ghost" data-a="skip">Spring over</button></div>` : ""}`;
}

function drinkList(res){
  if(!res.drink.length) return `<div class="drinkhead">Ingen drikker!</div>`;
  return `<div class="drinkhead">Skål!</div><div class="result">${res.drink.map(d =>
    `<div class="res drink"><span class="e">${emojiOf(d.id)}</span><span class="n">${nameOf(d.id)}${d.id===myId?" (dig)":""}${d.mate?" · makker 🤝":""}</span><span class="v">${tar(d.s)}</span></div>`).join("")}</div>`;
}

function revealView(){
  const r = state.round, T = TYPES[r.type], res = r.reveal;
  const silent = (r.type === "mission" || r.type === "event") && !res.drink.length;
  return `<div class="eyebrow"><span class="t">Runde ${r.n} · Resultat</span></div>
    ${T.result(r, res)}
    ${silent ? "" : drinkList(res)}
    ${isHost() ? `<div class="stickybottom"><button class="btn primary" data-a="next">Næste runde</button></div>`
      : `<p class="waiting">Venter på, at ${nameOf(state.hostId)} starter næste runde…</p>`}`;
}

function board(){
  const b = state.buddy, sorted = [...state.players].sort((x,y) => (y.wins||0) - (x.wins||0) || x.sips - y.sips);
  return `<div class="board">${sorted.map((p,i) => `<div class="res ${p.id===myId?"drink":""}"><span class="rank">${i+1}</span><span class="e">${avatar(p)}</span>
    <span class="n">${esc(p.name)}${b && (b.a===p.id||b.b===p.id) ? " 🤝" : ""}${p.online?"":" · offline"}</span><span class="v">🏆 ${p.wins||0} · 🍺 ${p.sips}</span></div>`).join("")}</div>`;
}

function endView(){
  const byWins = [...state.players].sort((a,b) => (b.wins||0) - (a.wins||0) || a.sips - b.sips);
  const bySips = [...state.players].sort((a,b) => b.sips - a.sips);
  const pod = (s, i, f) => s[i] ? `<div class="p p${i+1}"><div class="e">${avatar(s[i])}</div><div class="nm">${esc(s[i].name)}</div><div class="s">${f(s[i])}</div></div>` : `<div></div>`;
  const total = state.players.reduce((a,p) => a + p.sips, 0);
  return `<header class="hero" style="padding-top:8px"><h1 class="logo" style="font-size:60px">Tak for i aften!</h1></header>
    <section class="panel"><div class="label">Aftenens mester · flest sejre</div>
      <div class="podium">${pod(byWins,1,p=>"🏆"+(p.wins||0))}${pod(byWins,0,p=>"🏆"+(p.wins||0))}${pod(byWins,2,p=>"🏆"+(p.wins||0))}</div></section>
    <section class="panel"><div class="label">Aftenens tørstigste</div>
      <div class="podium">${pod(bySips,1,p=>p.sips)}${pod(bySips,0,p=>p.sips)}${pod(bySips,2,p=>p.sips)}</div>
      <p class="hint">${state.n} runder · ${tar(total)} i alt</p></section>
    <section class="panel"><div class="label">Stilling</div>${board()}</section>
    ${isHost() ? `<div class="stickybottom"><button class="btn primary" data-a="again">Spil igen med samme hold</button><button class="btn ghost" data-a="close">Luk spillet</button></div>`
      : `<button class="btn ghost" data-a="close">Forlad spillet</button>`}`;
}

function menuView(){
  return `<div class="scrim" data-a="menu"></div>
  <div class="sheet" role="dialog" aria-label="Menu"><div class="sheet-in">
    <div class="eyebrow"><span class="label">Stilling</span><span class="label">Kode ${esc(state.code)}</span></div>
    ${board()}
    ${isHost() ? `<div class="label">Tår pr. straf</div>${picker(LEVELS,"intensity","level",true)}<div class="label">Krydderi</div>${picker(SPICES,"spice","spice",true,"hot")}` : ""}
    ${isHost() && state.phase==="round" ? `<button class="btn small" data-a="skip">Spring runden over</button>` : ""}
    ${isHost() && state.phase!=="end" && state.phase!=="lobby" ? `<button class="btn small" data-a="end">Afslut og vis resultat</button>` : ""}
    <button class="btn small ghost" data-a="close">${isHost()?"Luk spillet for alle":"Forlad spillet"}</button>
    <button class="btn small" data-a="menu">Tilbage</button>
  </div></div>`;
}

function callView(){
  return `<div class="scrim" data-a="call"></div>
  <div class="sheet" role="dialog" aria-label="Hvem brød reglen"><div class="sheet-in">
    <div class="label">Hvem brød reglen? De drikker ${tar(S())}</div>
    <div class="voters">${online().map(p => `<button class="choice" ${sidej({k:"broke", id:p.id})}><span class="em">${avatar(p)}</span>${esc(p.name)}</button>`).join("")}</div>
    <button class="btn small" data-a="call">Fortryd</button>
  </div></div>`;
}

/* ============================================================
   INPUT
   ============================================================ */
function readHomeInputs(){
  const n = $("#name"); if(n){ me.name = clean(n.value, 16); store.set("skaal-name", me.name) }
  const c = $("#code"); if(c) ui.code = clean(c.value, 4).toUpperCase();
  store.set("skaal-emoji", me.emoji);
}
document.addEventListener("change", e => {
  if(e.target.id === "photo" && e.target.files && e.target.files[0]){ readHomeInputs(); processPhoto(e.target.files[0]) }
});
function parseJ(s){ try{ return JSON.parse(s) }catch(e){ return null } }
document.addEventListener("pointerdown", e => {
  if(e.target.closest("[data-mg]")){ e.preventDefault(); mgTap() }
});
document.addEventListener("click", e => {
  const t = e.target;
  const em = t.closest("[data-emoji]");
  if(em){ readHomeInputs(); me.emoji = em.dataset.emoji; me.photo = ""; store.set("skaal-emoji", me.emoji); store.del("skaal-photo"); return renderHome() }
  if(t.closest('[data-a="nophoto"]')){ readHomeInputs(); me.photo = ""; store.del("skaal-photo"); return renderHome() }
  const sd = t.closest("[data-side]");
  if(sd){ const v = parseJ(sd.dataset.side); if(v) side(v); ui.call = false; return render() }
  const aj = t.closest("[data-actj]");
  if(aj){ const v = parseJ(aj.dataset.actj); if(v) act(v); return }
  const ac = t.closest("[data-act]");
  if(ac){ act(ac.dataset.act); return }
  const mf = t.closest("[data-mfk]");
  if(mf){
    const [k, i] = mf.dataset.mfk.split(":"); const idx = +i;
    ["m","f","k"].forEach(x => { if(mfkSel[x] === idx) mfkSel[x] = null });
    mfkSel[k] = idx; buzz(10); return render();
  }
  const kpb = t.closest("[data-kp]");
  if(kpb){
    const k = kpb.dataset.kp;
    if(k === "del") kp.v = kp.v.slice(0,-1);
    else if(k === "ok"){ if(kp.v){ const g = +kp.v; kp.v = ""; act({g}); return render() } }
    else if(kp.v.length < 5) kp.v += k;
    buzz(8); return render();
  }
  const b = t.closest("[data-a]"); if(!b) return;
  const a = b.dataset.a, v = b.dataset.v;
  if(a === "host" || a === "join" || a === "rejoin" || a === "resume"){
    readHomeInputs();
    if(!me.name){ ui.err = "Skriv dit navn først."; ui.code = clean($("#code")?.value, 4).toUpperCase(); renderHome(); $("#name")?.focus(); return }
    if(typeof Peer !== "function"){ ui.err = "Kunne ikke hente netværksmodulet. Tjek internetforbindelsen."; renderHome(); return }
    if(a === "host"){ state = null; return hostGame() }
    if(a === "resume"){ try{ const s = JSON.parse(store.get(SAVE_HOST)); state = s.state; return hostGame(s.state) }catch(err){ state = null; return hostGame() } }
    const code = (a === "rejoin" ? store.get(SAVE_LAST) : clean($("#code")?.value, 4)).toUpperCase();
    if(!/^[A-Z]{4}$/.test(code)){ ui.err = "Koden er 4 bogstaver."; renderHome(); return }
    return joinGame(code);
  }
  if(a === "cancel"){ teardown(); role=null; state=null; ui={...ui, screen:"home"}; return render() }
  if(a === "menu"){ ui.menu = !ui.menu; return render() }
  if(a === "call"){ ui.call = !ui.call; return render() }
  if(a === "close") return closeGame();
  if(a === "peek"){ peek.on = !peek.on; return render() }
  if(a === "mfksend"){ act({m:mfkSel.m, f:mfkSel.f, k:mfkSel.k}); return }
  if(a === "sentsend" || a === "fullsend"){
    const r = state.round, el = document.getElementById((a === "sentsend" ? "sent-" : "full-") + r.n);
    const txt = clean(el && el.value, 120); if(!txt) return;
    el.value = "";
    act(a === "sentsend" ? {guess:txt} : {full:txt}); return;
  }
  if(a === "copy"){
    const url = joinUrl();
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast("Link kopieret"), () => toast(url)); else toast(url);
    return;
  }
  if(a === "share"){ navigator.share({title:"Skål!", text:`Kom med i Skål! Kode: ${state.code}`, url:joinUrl()}).catch(()=>{}); return }
  hostCmd(a, v);
});
document.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  if(e.target.id === "code") $('[data-a="join"]')?.click();
  if(e.target.id && e.target.id.startsWith("sent-")) $('[data-a="sentsend"]')?.click();
  if(e.target.id && e.target.id.startsWith("full-")) $('[data-a="fullsend"]')?.click();
});
document.addEventListener("input", e => {
  if(e.target.id === "code"){ const p = e.target.selectionStart; e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g,""); try{e.target.setSelectionRange(p,p)}catch(_){} }
});

render();
</script>
</body>
</html>
