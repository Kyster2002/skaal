    ${isHost() ? `<div class="stickybottom"><button class="btn primary" data-a="next">${last ? "Se slutresultatet" : "Næste runde"}</button></div>`
      : `<p class="waiting">Venter på, at ${nameOf(state.hostId)} starter næste runde…</p>`}`;
}

function board(){
  const b = state.buddy, sorted = [...state.players].sort((x,y) => (y.wins||0) - (x.wins||0) || x.sips - y.sips);
  return `<div class="board">${sorted.map((p,i) => `<div class="res ${p.id===myId?"drink":""}"><span class="rank">${i+1}</span><span class="e">${avatar(p)}</span>
    <span class="n">${esc(p.name)}${b && (b.a===p.id||b.b===p.id) ? " 🤝" : ""}${p.online?"":" · offline"}</span><span class="v">🏆 ${p.wins||0} · 🍺 ${p.sips}</span></div>`).join("")}</div>`;
}

function endView(){
  const byWins = [...state.players].sort((a,b) => (b.wins||0) - (a.wins||0) || a.sips - b.sips);
  const bySips = [...state.players].sort((a,b) => b.sips - a.sips);
  const pod = (s, i, f) => s[i] ? `<div class="p p${i+1}"><div class="e">${avatar(s[i])}</div><div class="nm">${esc(s[i].name)}</div><div class="s">${f(s[i])}</div></div>` : `<div></div>`;
  const total = state.players.reduce((a,p) => a + p.sips, 0);
  return `<header class="hero" style="padding-top:8px"><h1 class="logo" style="font-size:60px">Tak for i aften!</h1></header>
    ${state.bonus && state.bonus.length ? `<section class="panel"><div class="label">Bonusstjerner · +1 🏆 hver</div>
      <div class="bonus">${state.bonus.map((b,i) => `<div class="bstar" style="animation-delay:${i*0.6}s"><div class="bt">⭐ ${esc(b.title)}</div>
        <div class="bw">${b.ids.map(id => `${emojiOf(id)} ${nameOf(id)}`).join(", ")}</div><small>${esc(b.desc)}</small></div>`).join("")}</div></section>` : ""}
    <section class="panel"><div class="label">Aftenens mester · flest sejre</div>
      <div class="podium">${pod(byWins,1,p=>"🏆"+(p.wins||0))}${pod(byWins,0,p=>"🏆"+(p.wins||0))}${pod(byWins,2,p=>"🏆"+(p.wins||0))}</div></section>
    <section class="panel"><div class="label">Aftenens tørstigste</div>
      <div class="podium">${pod(bySips,1,p=>p.sips)}${pod(bySips,0,p=>p.sips)}${pod(bySips,2,p=>p.sips)}</div>
      <p class="hint">${state.n} runder · ${tar(total)} i alt</p></section>
    <section class="panel"><div class="label">Stilling</div>${board()}</section>
    ${isHost() ? `<div class="stickybottom"><button class="btn primary" data-a="again">Spil igen med samme hold</button><button class="btn ghost" data-a="close">Luk spillet</button></div>`
      : `<button class="btn ghost" data-a="close">Forlad spillet</button>`}`;
}

function menuView(){
  return `<div class="scrim" data-a="menu"></div>
  <div class="sheet" role="dialog" aria-label="Menu"><div class="sheet-in">
    <div class="eyebrow"><span class="label">Stilling</span><span class="label">Kode ${esc(state.code)}</span></div>
    ${board()}
    ${isHost() ? `<div class="label">Tår pr. straf</div>${picker(LEVELS,"intensity","level",true)}<div class="label">Krydderi</div>${picker(SPICES,"spice","spice",true,"hot")}` : ""}
    ${isHost() && state.phase==="round" ? `<button class="btn small" data-a="skip">Spring runden over</button>` : ""}
    ${isHost() && state.phase!=="end" && state.phase!=="lobby" ? `<button class="btn small" data-a="end">Afslut og vis resultat</button>` : ""}
    <button class="btn small ghost" data-a="close">${isHost()?"Luk spillet for alle":"Forlad spillet"}</button>
    <button class="btn small" data-a="menu">Tilbage</button>
  </div></div>`;
}

function callView(){
  return `<div class="scrim" data-a="call"></div>
  <div class="sheet" role="dialog" aria-label="Hvem brød reglen"><div class="sheet-in">
    <div class="label">Hvem brød reglen? De drikker ${tar(S())}</div>
    <div class="voters">${online().map(p => `<button class="choice" ${sidej({k:"broke", id:p.id})}><span class="em">${avatar(p)}</span>${esc(p.name)}</button>`).join("")}</div>
    <button class="btn small" data-a="call">Fortryd</button>
  </div></div>`;
}

/* ============================================================
   INPUT
   ============================================================ */
function readHomeInputs(){
  const n = $("#name"); if(n){ me.name = clean(n.value, 16); store.set("skaal-name", me.name) }
  const c = $("#code"); if(c) ui.code = clean(c.value, 4).toUpperCase();
  store.set("skaal-emoji", me.emoji);
}
document.addEventListener("change", e => {
  if((e.target.id === "photo" || e.target.id === "photocam") && e.target.files && e.target.files[0]){ readHomeInputs(); processPhoto(e.target.files[0]) }
});
function parseJ(s){ try{ return JSON.parse(s) }catch(e){ return null } }
document.addEventListener("pointerdown", e => {
  if(e.target.closest("[data-mg]")){ e.preventDefault(); mgTap() }
});
document.addEventListener("click", e => {
  const t = e.target;
  const em = t.closest("[data-emoji]");
  if(em){ readHomeInputs(); me.emoji = em.dataset.emoji; me.photo = ""; store.set("skaal-emoji", me.emoji); store.del("skaal-photo"); return renderHome() }
  if(t.closest('[data-a="nophoto"]')){ readHomeInputs(); me.photo = ""; store.del("skaal-photo"); return renderHome() }
  const sd = t.closest("[data-side]");
  if(sd){ const v = parseJ(sd.dataset.side); if(v) side(v); ui.call = false; ui.accuse = false; return render() }
  const aj = t.closest("[data-actj]");
  if(aj){ const v = parseJ(aj.dataset.actj); if(v) act(v); return }
  const ac = t.closest("[data-act]");
  if(ac){ act(ac.dataset.act); return }
  const hx = t.closest("[data-hex]");
  if(hx){ const r = state && state.round; if(r && r.type === "hex" && !r.fall && state.phase === "round") act({tile:+hx.dataset.hex}); return }
  const ro = t.closest("[data-rou]");
  if(ro){ const [k, v] = ro.dataset.rou.split(":"); rouSel[k] = k === "stake" ? +v : v; buzz(10); return render() }
  const mf = t.closest("[data-mfk]");
  if(mf){
    const [k, i] = mf.dataset.mfk.split(":"); const idx = +i;
    ["m","f","k"].forEach(x => { if(mfkSel[x] === idx) mfkSel[x] = null });
    mfkSel[k] = idx; buzz(10); return render();
  }
  const kpb = t.closest("[data-kp]");
  if(kpb){
    const k = kpb.dataset.kp;
    if(k === "del") kp.v = kp.v.slice(0,-1);
    else if(k === "ok"){ if(kp.v){ const g = +kp.v; kp.v = ""; act({g}); return render() } }
    else if(kp.v.length < 5) kp.v += k;
    buzz(8); return render();
  }
  const b = t.closest("[data-a]"); if(!b) return;
  const a = b.dataset.a, v = b.dataset.v;
  if(a === "host" || a === "join" || a === "rejoin" || a === "resume"){
    readHomeInputs();
    if(!me.name){ ui.err = "Skriv dit navn først."; renderHome(); $("#name")?.focus(); return }
    const isJoin = a === "join" || a === "rejoin";
    const code = isJoin ? String(a === "rejoin" ? store.get(SAVE_LAST) : ui.code).toUpperCase() : "";
    if(isJoin && !/^[A-Z]{4}$/.test(code)){ ui.err = "Koden er 4 bogstaver."; renderHome(); return }
    const go = () => {
      if(isJoin) return joinGame(code);
      if(a === "resume"){ try{ const s = JSON.parse(store.get(SAVE_HOST)); state = s.state; return hostGame(s.state) }catch(err){} }
      state = null; hostGame(null, v);
    };
    if(typeof Peer === "function") return go();
    /* netværksdelen er ikke hentet endnu: vis ventende skærm og fortsæt, når den er klar */
    role = isJoin ? "guest" : "host";
    ui = {...ui, screen:"connecting", err:"", code, status:"Henter netværk…"}; render();
    peerReady.then(ok => {
      if(ui.screen !== "connecting") return;   // annulleret imens
      if(ok) return go();
      role = null; ui = {...ui, screen:"home", err:"Kunne ikke hente netværksdelen. Tjek internetforbindelsen, og prøv igen."}; render();
    });
    return;
  }
  if(a === "cancel"){ teardown(); role=null; state=null; ui={...ui, screen:"home"}; return render() }
  if(a === "menu"){ ui.menu = !ui.menu; return render() }
  if(a === "call"){ ui.call = !ui.call; return render() }
  if(a === "accuse"){ ui.accuse = !ui.accuse; return render() }
  if(a === "tracedone") return finishTrace();
  if(a === "rouplace"){ if(rouSel.stake && rouSel.color) act({stake:rouSel.stake, color:rouSel.color}); return }
  if(a === "close") return closeGame();
  if(a === "peek"){ peek.on = !peek.on; return render() }
  if(a === "mfksend"){ act({m:mfkSel.m, f:mfkSel.f, k:mfkSel.k}); return }
  if(a === "sentsend" || a === "fullsend"){
    const r = state.round, el = document.getElementById((a === "sentsend" ? "sent-" : "full-") + r.n);
    const txt = clean(el && el.value, 120); if(!txt) return;
    el.value = "";
    act(a === "sentsend" ? {guess:txt} : {full:txt}); return;
  }
  if(a === "copy"){
    const url = joinUrl();
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast("Link kopieret"), () => toast(url)); else toast(url);
    return;
  }
  if(a === "share"){ navigator.share({title:"Pokaljagt", text:`Kom med i Pokaljagt! Kode: ${state.code}`, url:joinUrl()}).catch(()=>{}); return }
  hostCmd(a, v);
});
document.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  if(e.target.id === "code") $('[data-a="join"]')?.click();
  if(e.target.id && e.target.id.startsWith("sent-")) $('[data-a="sentsend"]')?.click();
  if(e.target.id && e.target.id.startsWith("full-")) $('[data-a="fullsend"]')?.click();
});
document.addEventListener("input", e => {
  if(e.target.id === "code"){ const p = e.target.selectionStart; e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g,""); try{e.target.setSelectionRange(p,p)}catch(_){} }
});

render();
</script>
</body>
</html>
